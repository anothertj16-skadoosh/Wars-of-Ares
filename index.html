// ลูกศรจากดินแดน from ไป to (หยุดก่อนถึงวงดินแดน) เยื้องไปทางขวาของทิศทาง off หน่วย เพื่อไม่ให้ลูกศรไป-กลับทับกัน
function arrowPts(from, to, off = 0) {
  const A = S.nodes[from], B = S.nodes[to];
  const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  const px = -uy * off, py = ux * off;
  return { x1: A.x + ux * 56 + px, y1: A.y + uy * 56 + py, x2: B.x - ux * 70 + px, y2: B.y - uy * 70 + py };
}
const lineAttr = P => `x1="${P.x1.toFixed(1)}" y1="${P.y1.toFixed(1)}" x2="${P.x2.toFixed(1)}" y2="${P.y2.toFixed(1)}"`;
// ความกว้างโดยประมาณของข้อความบนแผนที่ (สระ/วรรณยุกต์ไทยไม่กินที่ อีโมจิกว้างกว่าตัวอักษร)
const textW = (str, fs) => [...str].reduce((w, c) => w + (/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E\uFE0F\u200D]/.test(c) ? 0 : c.codePointAt(0) > 0x2000 && !/[\u0E00-\u0E7F]/.test(c) ? fs * 1.15 : fs * 0.62), 0);
// ป้ายเล็ก (สี่เหลี่ยมมุมมน + ข้อความ) จัดกึ่งกลางที่ x หรือชิดขวา
function tagSvg(txt, { x = 0, y = 0, fs = 22, fill = '#fffaf0', stroke = '#3b2a1d', color = '#2b2118', align = 'mid', cls = '' } = {}) {
  const w = Math.round(textW(txt, fs) + 18), h = Math.round(fs * 1.55), x0 = align === 'right' ? x - w : x - w / 2;
  return `<g class="tag-g ${cls}"><rect x="${x0}" y="${y - h / 2}" width="${w}" height="${h}" rx="${(h / 2.6).toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="3.5"/><text x="${x0 + w / 2}" y="${y + 1}" style="font-size:${fs}px;fill:${color}">${esc(txt)}</text></g>`;
}
// ผลของการบุกในรอบที่บันทึกไว้: ฝ่ายบุกได้ดินแดนนั้นไหม
const stepWon = st => st.ev.some(e => e.t === 'own' && e.node === st.to && e.to === st.fac);
// ไอคอนเล็กบนดินแดน: เกณฑ์ทหาร (+จำนวน) / แต่งตั้งแม่ทัพ / ได้ตำนาน / พลังของ Ares / ภูมิประเทศเปลี่ยน
const MARK_ICON = { hire: '🎖️', legend: '✨', ares: '🩸', terrain: '🌀' };
function stepMarks(st, marks = {}) {
  for (const e of st.ev) {
    const ids = e.t === 'terrain' ? e.nodes : e.node != null ? [e.node] : [];
    for (const id of ids) {
      if (e.t !== 'recruit' && !MARK_ICON[e.t]) continue;
      const m = marks[id] || (marks[id] = { fac: e.fac, add: 0, icons: [] });
      if (e.t === 'recruit') { m.add += e.n; m.fac = e.fac; }
      else { if (!m.icons.includes(MARK_ICON[e.t])) m.icons.push(MARK_ICON[e.t]); if (e.fac >= 0) m.fac = e.fac; }
    }
  }
  return marks;
}
const markText = m => (m.add ? `+${m.add}` : '') + m.icons.join('');
// ภาพจาง ๆ ของทุกการกระทำในรอบที่แล้ว: ลูกศรเดินทัพ / ลูกศรบุก ⚔️ (เขียว = ยึดได้ แดง = ถูกตีกลับ) / ถอนทัพ 🏃
function ghostLayers() {
  const arrows = new Map(), marks = {};
  for (const st of FX.last) {
    if (st.from != null) {
      const key = `${st.from}>${st.to}`, old = arrows.get(key);
      arrows.set(key, { from: st.from, to: st.to, fac: st.fac, kind: st.kind, won: stepWon(st) || !!(old && old.won) });
    }
    for (const e of st.ev) if (e.t === 'retreat') arrows.set(`${e.from}>${e.to}r`, { from: e.from, to: e.to, fac: e.fac, kind: 'retreat' });
    stepMarks(st, marks);
  }
  let under = '', over = '';
  for (const g of arrows.values()) {
    const P = arrowPts(g.from, g.to, 12), col = facColor(g.fac);
    const dash = g.kind === 'retreat' ? ' stroke-dasharray="14 12"' : g.kind === 'move' ? ' stroke-dasharray="3 14"' : '';
    under += `<g class="ghost" data-ghost="${g.kind}"><line ${lineAttr(P)} stroke="#fffaf0" stroke-width="15" opacity=".45" stroke-linecap="round"/><line ${lineAttr(P)} stroke="${col}" stroke-width="8" opacity=".6" stroke-linecap="round" marker-end="url(#arrow)"${dash}/></g>`;
    if (g.kind === 'move') continue;
    const bx = P.x1 + (P.x2 - P.x1) * 0.5, by = P.y1 + (P.y2 - P.y1) * 0.5;
    const fill = g.kind === 'retreat' ? col : g.won ? '#2f7d4f' : '#b03a2e';
    const tip = g.kind === 'retreat' ? `${facName(g.fac)} ถอนทัพ` : `${facName(g.fac)} บุก ${S.nodes[g.to].name} — ${g.won ? 'ยึดได้' : 'ถูกตีกลับ'}`;

/* ---------- ซูม/เลื่อนแผนที่ ---------- */
const canZoom = () => !!S && S.size && S.size !== 's';
// ขอบเขตดินแดนทั้งหมด (เผื่อที่ให้ชื่อ/ป้าย)
function mapBounds() {
  const xs = S.nodes.map(n => n.x), ys = S.nodes.map(n => n.y);
  const x0 = Math.min(...xs) - 105, y0 = Math.min(...ys) - 105;
  return { x: x0, y: y0, w: Math.max(...xs) + 105 - x0, h: Math.max(...ys) + 115 - y0 };
}
const boardRatio = () => { const r = $('map').getBoundingClientRect(); return r.width > 0 && r.height > 0 ? r.height / r.width : 1; };
// ขยายกรอบให้สัดส่วนเท่าพื้นที่แผนที่บนจอ
function fitRatio(b) {
  const k = boardRatio();
  if (b.h / b.w < k) { const h = b.w * k; return { x: b.x, y: b.y - (h - b.h) / 2, w: b.w, h }; }
  const w = b.h / k; return { x: b.x - (w - b.w) / 2, y: b.y, w, h: b.h };
}
// มุมมองเริ่มต้น: ทั้งแผนที่ / จอแคบ + แผนที่กลาง/ใหญ่ = ซูมเข้าหาทัพเราให้ดินแดนใหญ่พอแตะได้แม่น
function defaultView() {
  const full = fitRatio(mapBounds());
  if (!canZoom() || $('map').getBoundingClientRect().width >= 600) return full;
  const h = S.nodes[homeNode(0)] || S.nodes[0];
  const w = Math.min(full.w, 760), k = boardRatio();
  return clampView({ x: h.x - w / 2, y: h.y - w * k / 2, w, h: w * k });
}
function clampView(v) {
  const full = fitRatio(mapBounds()), k = boardRatio();
  let w = Math.max(420, Math.min(full.w, v.w)), h = w * k;
  const cx = Math.max(full.x + w / 2, Math.min(full.x + full.w - w / 2, v.x + v.w / 2));
  const cy = Math.max(full.y + h / 2, Math.min(full.y + full.h - h / 2, v.y + v.h / 2));
  return { x: cx - w / 2, y: cy - h / 2, w, h };
}
function applyView() {
  const v = canZoom() && UI.view ? clampView(UI.view) : canZoom() ? defaultView() : mapBounds();
  if (canZoom() && UI.view) UI.view = v;
  $('map').setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`);
  $('fx').setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`);
  $('board').classList.toggle('zoomable', canZoom());
}
const curView = () => { const [x, y, w, h] = $('map').getAttribute('viewBox').split(' ').map(Number); return { x, y, w, h }; };
// จุดบนจอ → พิกัดแผนที่
function toMap(cx, cy) {
  const m = $('map'), pt = m.createSVGPoint();
  pt.x = cx; pt.y = cy;
  return pt.matrixTransform(m.getScreenCTM().inverse());
}
function zoomAt(cx, cy, f, base = curView()) {
  const p = toMap(cx, cy);
  UI.view = clampView({ x: p.x - (p.x - base.x) * f, y: p.y - (p.y - base.y) * f, w: base.w * f, h: base.h * f });
  applyView();
  coachUpdate();
}
function bindMapGestures() {
  const m = $('map'), ptrs = new Map();
  let drag = null, pinch = null;
  m.addEventListener('pointerdown', e => {
    if (!canZoom()) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) drag = { sx: e.clientX, sy: e.clientY, v: curView(), moved: false };
    else if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, v: curView(), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
      if (drag) drag.moved = true;
    }
  });
  window.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()];
      zoomAt(pinch.cx, pinch.cy, pinch.d / (Math.hypot(a.x - b.x, a.y - b.y) || 1), pinch.v);
    } else if (drag) {
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved && Math.hypot(dx, dy) < 10) return; // แตะสั่น ๆ ไม่นับว่าลาก
      drag.moved = true;
      const r = m.getBoundingClientRect(), k = Math.max(drag.v.w / r.width, drag.v.h / r.height);
      UI.view = clampView({ ...drag.v, x: drag.v.x - dx * k, y: drag.v.y - dy * k });
      applyView(); coachUpdate();
    }
  });
  const up = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (ptrs.size === 0) { if (drag && drag.moved) UI.suppressClick = Date.now(); drag = null; }
  };
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  m.addEventListener('wheel', e => {
    if (!canZoom()) return;
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY > 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });
  const zb = f => { const r = m.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, f); };
  $('btnZoomIn').addEventListener('click', () => zb(1 / 1.3));
  $('btnZoomOut').addEventListener('click', () => zb(1.3));
  $('btnView').addEventListener('click', () => { UI.view = null; applyView(); coachUpdate(); });
}

function moveStatus(a) {

/* ---------- ย้อนการสั่งการ ----------
   ย้อนได้เฉพาะการเดินทัพที่ไม่มีการรบ เกณฑ์ทหาร แต่งตั้งแม่ทัพ รวม/แบ่งทหาร ในเทิร์นเดียวกัน
   พอเกิดการรบ (รวมการถอนทัพ) สแต็กจะถูกล้าง */
function pushUndo() {
  if (!S || LEVELS[S.level].undo === 0) return;
  UI.undo.push(JSON.stringify(S));
  if (UI.undo.length > 40) UI.undo.shift();
}
const clearUndo = () => { UI.undo = []; };
function canUndo() {
  return !!S && LEVELS[S.level].undo !== 0 && UI.undo.length > 0 && S.undoLeft !== 0 && S.phase === 'player' && !UI.busy && !S.over;
}
function doUndo() {
  if (!canUndo()) return;
  const left = S.undoLeft;
  S = JSON.parse(UI.undo.pop());
  S.undoLeft = left < 0 ? -1 : left - 1;
  log(`↩️ ย้อนการสั่งการ${S.undoLeft >= 0 ? ` (เหลือ ${S.undoLeft} ครั้ง)` : ''}`);
  if (UI.selArmy != null && !armyById(UI.selArmy)) UI.selArmy = null;

/* ---------- ความคืบหน้ายศ (ปลดล็อกระดับ) ---------- */
const PROGRESS_KEY = 'legendsWarlord.progress';
function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    if (p && Number.isInteger(p.unlocked)) {
      return { unlocked: Math.max(0, Math.min(LEVELS.length - 1, p.unlocked)), best: Number.isInteger(p.best) ? Math.min(LEVELS.length - 1, p.best) : -1,
        boss: !!p.boss, bossWon: !!p.bossWon };
    }
  } catch (e) { /* ignore */ }
  return { unlocked: 0, best: -1, boss: false, bossWon: false };
}
const saveProgress = p => { try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch (e) { /* ignore */ } };
// ชนะโหมดบอส: ปลดล็อกอากาเม็มนอน + ชุดสงครามทรอย (คืน true ถ้าเพิ่งปลดล็อกครั้งแรก)
function recordBossWin() {
  const p = loadProgress(), first = !p.bossWon;
  p.bossWon = true; p.boss = true;
  saveProgress(p);
  return first;
}
// คืนระดับที่เพิ่งปลดล็อก (หรือ null)
function recordWin(level) {
  const p = loadProgress();
  const next = Math.min(LEVELS.length - 1, level + 1);
  const newly = next > p.unlocked ? next : null;
  p.unlocked = Math.max(p.unlocked, next);
  p.best = Math.max(p.best, level);
  if (level === LEVELS.length - 1) p.boss = true; // ชนะระดับตำนาน = ปลดล็อกศึกชิงอิสรภาพ
  saveProgress(p);
  return newly;
}

/* ---------- แสดงการกระทำของฝ่ายอื่นบนแผนที่: ลูกศร 💥 ตัวเลขทหารที่เสีย ดินแดนกะพริบ / ดูซ้ำ ---------- */
const AI_SPEEDS = { normal: { name: 'ปกติ', icon: '▶️', k: 1 }, fast: { name: 'เร็ว', icon: '⏩', k: 0.4 }, skip: { name: 'ข้าม', icon: '⏭️', k: 0 } };
const SPEED_KEY = 'legendsWarlord.aiSpeed';
const sleep = ms => new Promise(r => setTimeout(r, ms));
// ตัวคูณเวลาแอนิเมชัน (0 = ข้าม) — โหมดทดสอบอัตโนมัติเร่งให้สั้นมาก
const fxK = (speed = UI.aiSpeed) => (AI_SPEEDS[speed] || AI_SPEEDS.normal).k * (Ctrl.auto ? 0.04 : 1);
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
// เดินภาพทีละเฟรมด้วย setTimeout (ไม่ใช้ requestAnimationFrame เพื่อไม่ค้างตอนแท็บอยู่เบื้องหลัง)
function tween(ms, fn) {
  return new Promise(res => {
    const t0 = performance.now();
    const tick = () => { const k = ms > 0 ? Math.min(1, (performance.now() - t0) / ms) : 1; fn(k); if (k < 1) setTimeout(tick, 16); else res(); };
    tick();
  });
}
function fxAdd(html) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.innerHTML = html;
  $('fx').appendChild(g);
  return g;
}
function fxClear() { if (typeof document !== 'undefined' && $('fx')) $('fx').innerHTML = ''; }
// เลื่อนมุมมอง (แผนที่กลาง/ใหญ่) ให้เห็นดินแดนทั้งหมดใน ids — ถ้าเห็นอยู่แล้วไม่ขยับ
async function fxFocus(ids, k) {
  const pts = ids.filter(id => id != null && S.nodes[id]).map(id => S.nodes[id]);
  if (!canZoom() || !k || !pts.length) return;
  const v = curView(), m = 110;
  if (pts.every(p => p.x > v.x + m && p.x < v.x + v.w - m && p.y > v.y + m && p.y < v.y + v.h - m)) return;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y), r = boardRatio();
  const w = Math.max(v.w, Math.max(...xs) - Math.min(...xs) + 340, (Math.max(...ys) - Math.min(...ys) + 340) / r);
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  const to = clampView({ x: cx - w / 2, y: cy - w * r / 2, w, h: w * r });
  FX.panned = true;
  await tween(380 * k, t => { const e = ease(t); UI.view = { x: v.x + (to.x - v.x) * e, y: v.y + (to.y - v.y) * e, w: v.w + (to.w - v.w) * e, h: v.h + (to.h - v.h) * e }; applyView(); });
}
// ลูกศรสีของฝ่ายนั้นวิ่งจาก from ไป to (บุก = ⚔️ ถอนทัพ = 🏃 เส้นประ)
async function fxArrow(from, to, f, kind, k) {
  const P = arrowPts(from, to, 12), col = facColor(f);
  const dash = kind === 'retreat' ? ' stroke-dasharray="16 12"' : '';
  const ico = kind === 'retreat' ? '🏃' : kind === 'atk' ? '⚔️' : '';
  const g = fxAdd(`<line x1="${P.x1}" y1="${P.y1}" x2="${P.x1}" y2="${P.y1}" stroke="#fffaf0" stroke-width="17" stroke-linecap="round"/>`
    + `<line class="fx-line" x1="${P.x1}" y1="${P.y1}" x2="${P.x1}" y2="${P.y1}" stroke="${col}" stroke-width="10" stroke-linecap="round"${dash}/>`
    + `<g class="fx-head"><circle r="${ico ? 23 : 13}" fill="${col}" stroke="#fff" stroke-width="4"/>${ico ? `<text class="fx-ico">${ico}</text>` : ''}</g>`);
  const lines = g.querySelectorAll('line'), head = g.querySelector('.fx-head');
  await tween(560 * k, t => {
    const e = ease(t), x = P.x1 + (P.x2 - P.x1) * e, y = P.y1 + (P.y2 - P.y1) * e;
    for (const l of lines) { l.setAttribute('x2', x); l.setAttribute('y2', y); }
    head.setAttribute('transform', `translate(${x},${y})`);
  });
  lines[1].setAttribute('marker-end', 'url(#arrow)');
}
const fxDur = (ms, k) => `animation-duration:${Math.max(40, Math.round(ms * k))}ms`;
// 💥 + ตัวเลขทหารที่เสียลอยขึ้น (ซ้าย = ฝ่ายบุก ขวา = ฝ่ายรับ)
function fxBoom(e, k) {
  const n = S.nodes[e.node];
  let h = `<text class="fx-boom" x="${n.x}" y="${n.y}" style="${fxDur(900, k)}">💥</text>`;
  if (e.lostA) h += `<text class="fx-float" x="${n.x - 50}" y="${n.y - 30}" style="fill:${facColor(e.atk)};${fxDur(1300, k)}">-${e.lostA}</text>`;
  if (e.lostD) h += `<text class="fx-float" x="${n.x + 50}" y="${n.y - 30}" style="fill:${facColor(e.def)};${fxDur(1300, k)}">-${e.lostD}</text>`;
  fxAdd(h);
}
const fxFlash = (node, col, k) => { const n = S.nodes[node]; fxAdd(`<circle class="fx-flash" cx="${n.x}" cy="${n.y}" r="58" stroke="${col}" style="${fxDur(160, k)}"/>`); };
// ดินแดนที่ต้องเห็นตอนเล่นเหตุการณ์เดี่ยว (ไม่เลื่อนแผนที่เพื่อการเกณฑ์ทหาร)
const focusIds = st => st.ev.filter(e => e.t !== 'recruit' && e.t !== 'own').flatMap(e => e.t === 'terrain' ? e.nodes : e.node != null ? [e.node] : []);
// ผลของ step: 💥/ตัวเลข → ดินแดนกะพริบ → ถอนทัพ → ไอคอนเกณฑ์ทหาร/แม่ทัพ/ตำนาน/พลัง Ares
async function fxOutcome(st, k) {
  for (const e of st.ev) {
    if (e.t === 'battle') { if (!e.human) { fxBoom(e, k); await sleep(750 * k); } }
    else if (e.t === 'own') { fxFlash(e.node, e.to >= 0 ? facColor(e.to) : '#8d8d8d', k); await sleep(140 * k); }
    else if (e.t === 'retreat') await fxArrow(e.from, e.to, e.fac, 'retreat', k * 0.8);
  }
  const marks = stepMarks(st);
  const ids = Object.keys(marks).filter(id => markText(marks[id]));
  if (ids.length) {
    fxAdd(ids.map(id => { const n = S.nodes[id]; return `<g class="fx-pop" style="${fxDur(1200, k)}">${tagSvg(markText(marks[id]), { x: n.x - 28, y: n.y - 38, align: 'right', stroke: facColor(marks[id].fac) })}</g>`; }).join(''));
    await sleep(900 * k);
  }
  await sleep(220 * k);
}
// ตาของฝ่ายอื่นแบบสด: ลูกศรก่อนเดินทัพ
async function fxArrowLive(st) {
  const k = fxK();
  if (!FX.rec || !k || typeof document === 'undefined') return;
  fxClear();
  await fxFocus([st.from, st.to], k);
  await fxArrow(st.from, st.to, st.fac, st.kind, k);
}
// แสดงผลของทุก step ที่ยังไม่ได้แสดง
async function fxCatchUp() {
  if (!FX.rec) return;
  const k = fxK();
  if (!k || typeof document === 'undefined') { FX.played = FX.steps.length; return; }
  if (FX.played >= FX.steps.length) return;
  render();
  while (FX.played < FX.steps.length) {
    const st = FX.steps[FX.played++];
    if (st.from == null) { fxClear(); await fxFocus(focusIds(st), k); }
    await fxOutcome(st, k);
  }
  fxClear();
}
// 🔁 ดูตาศัตรูอีกครั้ง: เล่นทุก step ของรอบล่าสุดบนสถานะแผนที่ตอนนั้น
async function replayRound() {
  if (!S || !FX.last || UI.busy || S.phase !== 'player' || S.over) return;
  const real = S, steps = FX.last, k = fxK() || fxK('normal'), keep = UI.view;
  UI.busy = true;
  render();
  const ban = $('phaseBanner');
  ban.classList.remove('hidden');
  try {
    for (let i = 0; i < steps.length; i++) {
      const st = steps[i];
      S = JSON.parse(st.pre);
      ban.textContent = `🔁 ดูซ้ำ: ${facIcon(st.fac)} ${facName(st.fac)}`;
      renderMap(); fxClear();
      if (st.from != null) { await fxFocus([st.from, st.to], k); await fxArrow(st.from, st.to, st.fac, st.kind, k); }
      else await fxFocus(focusIds(st), k);
      S = i + 1 < steps.length ? JSON.parse(steps[i + 1].pre) : real;
      renderMap();
      await fxOutcome(st, k);
    }
  } finally {
    S = real; fxClear(); UI.busy = false;
    if (FX.panned) { UI.view = keep; FX.panned = false; }
    render();
  }
}
function setAiSpeed(sp) {
  if (!AI_SPEEDS[sp]) return;
  UI.aiSpeed = sp;

// แจ้งเหตุสำคัญของฝ่ายเรา (เมืองหลวงแตก / ไร้แผ่นดิน / เหลือเทิร์นสุดท้าย)

  if (UI.setupLegend && LEGENDS.find(l => l.id === UI.setupLegend).locked && !progT.bossWon) UI.setupLegend = null;
  $('legendGrid').innerHTML = LEGENDS.filter(l => !l.locked || progT.bossWon).map(l => `<button class="legend-card ${UI.setupLegend === l.id ? 'sel' : ''}" style="--c:${l.color}" data-legend="${l.id}">
      <div class="lc-top"><div class="lc-ico">${l.icon}</div><div><div class="lc-name">${l.name}</div><div class="lc-origin">${l.origin}</div></div></div>
      <div class="lc-skill">✨ ${l.skillName}</div><div class="lc-desc">${l.skillDesc}</div>
      <div class="lc-weak">⚠️ ${l.weakName}</div><div class="lc-desc">${l.weakDesc}</div>
      <div class="muted">ทัพเริ่มต้น: ${unitsHtml(l.start)}</div></button>`).join('');
  const bb = $('btnBoss');
  bb.disabled = !progT.boss || !UI.setupLegend;
  bb.textContent = !progT.boss ? '🔒 ศึกชิงอิสรภาพ — ชนะระดับตำนานเพื่อปลดล็อก'
    : !UI.setupLegend ? '🩸 ศึกชิงอิสรภาพ (เลือกจอมทัพก่อน)' : `🩸 ศึกชิงอิสรภาพกับ ${LEGENDS.find(l => l.id === UI.setupLegend).name}${progT.bossWon ? ' ✓' : ''}`;
  const sb = $('btnStart');
  sb.disabled = !UI.setupLegend;
  sb.textContent = UI.setupLegend ? `เริ่มศึกกับ ${LEGENDS.find(l => l.id === UI.setupLegend).name} ⚔️` : 'เลือกจอมทัพก่อน';
  for (const b of document.querySelectorAll('#aiSeg button')) b.classList.toggle('on', +b.dataset.ai === UI.setupAI);
  $('sizeSeg').innerHTML = Object.entries(MAP_SIZES).map(([k, z]) => `<button data-size="${k}" class="${UI.setupSize === k ? 'on' : ''}">${z.name}</button>`).join('');
  const SZ = MAP_SIZES[UI.setupSize];
  $('sizeInfo').textContent = `${SZ.nodes[0]}–${SZ.nodes[1]} ดินแดน · ${SZ.turns} เทิร์น · ตำนานพเนจร ${SZ.wander[0] === SZ.wander[1] ? SZ.wander[0] : SZ.wander.join('–')} ตัว (ระดับแม่ทัพขึ้นไป)${UI.setupSize !== 's' ? ' · ซูม/เลื่อนแผนที่ได้' : ''}`;
  const prog = loadProgress();
  if (UI.setupLevel > prog.unlocked) UI.setupLevel = prog.unlocked;
  $('lvlSeg').innerHTML = LEVELS.map(l => {
    const locked = l.id > prog.unlocked;
    return `<button data-lvl="${l.id}" class="${UI.setupLevel === l.id ? 'on' : ''}" ${locked ? 'disabled title="ชนะระดับก่อนหน้าเพื่อปลดล็อก"' : ''}>${locked ? '🔒' : l.icon} ${l.name}</button>`;
  }).join('');
  const best = prog.best >= 0 ? `${LEVELS[prog.best].icon} ${LEVELS[prog.best].name}` : 'ยังไม่เคยชนะ';
  $('lvlInfo').innerHTML = `${LEVELS[UI.setupLevel].desc}<br><b>ยศสูงสุดที่ทำได้: ${best}</b>${prog.unlocked < LEVELS.length - 1 ? ` · ชนะระดับ${LEVELS[prog.unlocked].name}เพื่อปลดล็อก${LEVELS[prog.unlocked + 1].name}` : ''}`;
  const sv = loadSave();
  const cb = $('btnContinue');
  cb.classList.toggle('hidden', !sv);
  if (sv) cb.textContent = `▶ เล่นต่อ (${LEGENDS.find(l => l.id === sv.factions[0].legend).name} · ${LEVELS[sv.level].name} · แผนที่${(MAP_SIZES[sv.size] || MAP_SIZES.s).name} · เทิร์น ${sv.turn}/${sv.maxTurns || MAX_TURNS})`;
}

function startGame(legendId, numAI, level = UI.setupLevel, size = UI.setupSize, boss = false) {
  newGame(legendId, numAI, undefined, level, size, { boss, troy: loadProgress().bossWon });
  UI.busy = false; UI.view = null; UI.ghost = false; UI.retreatPick = null; FX.last = null;
  clearUndo();
  UI.tut = $('optTut').checked ? 'army' : null;
  if (UI.tut) { UI.selNode = null; UI.selArmy = null; }
  else { UI.selNode = homeNode(0); UI.selArmy = leaderArmy(0).id; }
  showScreen('game');
  saveGame();
  render();
}
function startBoss() {
  if (!UI.setupLegend || !loadProgress().boss) return;
  startGame(UI.setupLegend, 2, LEVELS.length - 1, 'l', true);
  openDialog(bossIntroHtml());
}

      <div class="center"><button class="btn primary" data-act="title">กลับหน้าหลัก</button> <button class="btn ghost" data-close>ดูแผนที่</button></div></div></div>`;

function continueGame() {
  const sv = loadSave();
  if (!sv) { renderTitle(); return; }
  S = sv; S.phase = 'player'; S.current = 0;
  UI.selNode = null; UI.selArmy = null; UI.busy = false; UI.tut = null; UI.view = null; UI.ghost = false; UI.retreatPick = null; FX.last = null;
  clearUndo();
  showScreen('game');
  render();
}

async function onNodeClick(id) {
  if (!S || S.over) return;
  const sa = selArmy();
  if (S.phase === 'player' && !UI.busy && sa && moveTargets(sa).includes(id)) {
    UI.busy = true; UI.ghost = false;
    pushUndo();
    try {
      const res = await moveArmy(sa, id);
      if (res.type === 'cancel') UI.undo.pop();
      else if (res.type === 'battle') clearUndo(); // เกิดการรบ/ถอนทัพแล้ว ย้อนกลับไปก่อนหน้านั้นไม่ได้
      if (res.type !== 'cancel') {
        const alive = S.armies.includes(sa);
        UI.selNode = alive ? sa.node : id;
        UI.selArmy = alive && canMove(sa) ? sa.id : null;
        if (UI.tut === 'target' || UI.tut === 'strat' || UI.tut === 'result') UI.tut = UI.selArmy != null ? 'target' : 'end';
      } else if (UI.tut === 'strat') UI.tut = 'target';
    } finally { UI.busy = false; }
    saveGame();
    render();
    if (S.over) Ctrl.gameOver();
    return;
  }
  UI.selNode = id;
  const a = armyAt(id);
  UI.selArmy = a && a.fac === 0 ? a.id : null;
  if (UI.selArmy != null && S.phase === 'player') UI.ghost = false; // เริ่มสั่งการ: ภาพตาศัตรูจาง ๆ หายไป
  if (UI.tut === 'army' && UI.selArmy != null && canMove(a)) UI.tut = 'target';
  else if (UI.tut === 'target' && UI.selArmy == null) UI.tut = 'army';
  render();
}

function onInfoClick(e) {
  const b = e.target.closest('button');
  if (!b || b.disabled || UI.busy || S.phase !== 'player' || S.over) return;
  const id = UI.selNode, a = armyAt(id);
  pushUndo();
  let changed = false;
  if (b.dataset.recruit) changed = recruit(0, id, b.dataset.recruit);
  else if (b.dataset.act === 'hire') { const na = hireGeneral(0); if (na) { UI.selArmy = na.id; changed = true; } }
  else if (b.dataset.act === 'absorb' && a) { absorbGarrison(a); changed = true; }
  else if (b.dataset.act === 'split' && a) { splitToGarrison(a); changed = true; }
  if (!changed) UI.undo.pop();
  else UI.ghost = false;
  saveGame();
  render();
}

  const sub = side.gen ? side.gen.name : (side.fac === NEUTRAL ? 'ทหารท้องถิ่น' : 'กองรักษาการณ์');

    <div class="side-ico">${side.gen ? side.gen.icon : facIcon(side.fac)}</div>
    <div class="side-name">${esc(facName(side.fac))}</div><div class="side-gen">${esc(sub)}</div>
    <div class="side-units">${unitsHtml(side.units)}</div><div class="side-total">รวม ${sumU(side.units)} นาย</div>
    ${side.gen && side.gen.wid ? '<div class="side-gen" style="color:#7a5a12">✨ ตำนานพเนจร</div>' : ''}

const stratTag = s => `${STRATEGIES[s].icon} <b>${STRATEGIES[s].name}</b>`;

// รายละเอียดปลายทางถอนทัพที่เลือก (แสดงในแถบด้านล่างตอนเลือกบนแผนที่)
function retreatInfoHtml(o) {
  const n = S.nodes[o.to];
  if (o.kind === 'safe') return `<b>🛡️ ถอยเข้า ${esc(n.name)}</b> (ดินแดนเรา) · ปลอดภัย · ทัพเหลือราว ${o.after} นาย`;
  const est = o.ratio === Infinity ? 'ไม่มีทหารป้องกัน ยึดได้ทันที' : `ประเมิน (รวมทัพล้า -20%): <b>${estimateText(o.ratio)}</b>`;
  return `<b>⚔️ ตีฝ่าวงล้อมเข้า ${esc(n.name)}</b> (${facIcon(n.owner)} ${esc(facName(n.owner))}) · ${est} · ทัพเหลือราว ${o.after} นายก่อนรบ<br>ชนะ = ยึด ${esc(n.name)} · แพ้ = ทัพแตกทั้งหมด`;
}
// แผนที่กลาง/ใหญ่: เลื่อนมุมมองให้เห็นจุดที่ถูกบุก ฝ่ายบุก และปลายทางทั้งหมด
function fitRetreatView(P) {
  if (!canZoom()) return;
  const pts = [P.node, P.from, ...P.opts.map(o => o.to)].filter(id => id != null).map(id => S.nodes[id]);
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs) - 150, y0 = Math.min(...ys) - 170, x1 = Math.max(...xs) + 150, y1 = Math.max(...ys) + 150;
  UI.view = clampView(fitRatio({ x: x0, y: y0, w: x1 - x0, h: y1 - y0 }));
}
// แตะดินแดนบนแผนที่ระหว่างเลือกปลายทางถอนทัพ
function retreatPickNode(id) {
  const P = UI.retreatPick;
  if (!P || !P.opts.some(o => o.to === id)) return;
  P.sel = id;
  P.refresh();
}

function uiAskStrategy(ctx, role) {
  return new Promise(resolve => {
    const node = S.nodes[ctx.node], T = TERRAINS[node.terrain];
    const atkE = ctx.alps ? { ...ctx.atk, units: scaleU(ctx.atk.units, ctx.alps) } : ctx.atk;
    const r = estimateSides(atkE, ctx.def, ctx.node, { tired: ctx.breakout });
    const mine = role === 'atk' ? r : 1 / r;
    const canRetreat = role === 'def' && ctx.retreatOpts && ctx.retreatOpts.length > 0;
    let h = `<h2>${role === 'def' ? '🚨 ถูกโจมตี!' : ctx.breakout ? '🏃 ตีฝ่าวงล้อม!' : '⚔️ เตรียมปะทะ'}</h2>`;
    h += `<div class="bt-place">${T.icon} ${esc(node.name)} · ${T.name}: ${T.desc}</div>`;
    h += `<div class="bt-sides">${sideCardHtml(ctx.atk, 'ฝ่ายบุก')}<div class="vs">VS</div>${sideCardHtml(ctx.def, 'ฝ่ายรับ')}</div>`;
    for (const sd of [ctx.atk, ctx.def]) if (sd.gen && sd.gen.wid) h += legendBoxHtml(sd.gen.wid, sd.gen, sd.fac);
    h += `<div class="bt-est">ประเมินกำลังฝ่ายเรา (ก่อนกลยุทธ์): <b>${estimateText(mine)}</b></div>`;
    if (ctx.alps && role === 'atk') h += `<div class="reveal" style="border-color:#b5452b;background:#fbe9e4">🏔️ ราคาของแอลป์: ข้ามเทือกเขาเสียทหาร ${Math.round(ctx.alps * 100)}% ก่อนรบ (ประเมินรวมแล้ว · ยกเลิกการบุกได้โดยไม่เสีย)</div>`;
    const fwF = role === 'def' ? ctx.def.fac : ctx.atk.fac, fwE = role === 'def' ? ctx.atk.fac : ctx.def.fac;
    for (const [f, who] of [[fwF, 'เรา'], [fwE, 'ศัตรู']]) {
      if (f < 0) continue;
      const L2 = legendOf(f);
      const hit = (L2.weak.atkMod && f === ctx.atk.fac) || (L2.weak.siegeWall && f === ctx.atk.fac && isSeat(S.nodes[ctx.node]))
        || (L2.weak.landless && fac(f).capital == null && ctx[f === ctx.atk.fac ? 'atk' : 'def'].gen && ctx[f === ctx.atk.fac ? 'atk' : 'def'].gen.leader);
      if (hit) h += `<div class="reveal" style="border-color:#b5452b;background:#fbe9e4">⚠️ จุดอ่อน${who} ${esc(L2.name)} — ${esc(L2.weakName)}: ${esc(L2.weakDesc)}</div>`;
    }
    const myS = role === 'def' ? ctx.def : ctx.atk;
    if (fac(myS.fac).capital == null && myS.gen && myS.gen.leader && !legendOf(myS.fac).weak.landless) h += `<div class="reveal" style="border-color:#b5452b;background:#fbe9e4">⛺ เราไร้แผ่นดิน: ถ้าทัพจอมทัพแตกในศึกนี้ = แพ้ทันที</div>`;
    if (ctx.wild) h += `<div class="reveal" style="border-color:#c9961a;background:#fff6dc">✨ ${WMAP[ctx.wild].icon} ${esc(WMAP[ctx.wild].name)} พเนจรอยู่ที่นี่ (ไม่ร่วมรบ) — ฝ่ายบุกชนะ = ได้ตำนานนี้เป็นแม่ทัพ</div>`;
    // สปาร์ตาคัส: บทพูดพิเศษก่อนศึกสุดท้าย (บุกบัลลังก์หรือทัพของ Ares ครั้งแรก)
    if (isBoss() && role === 'atk' && legendOf(0).id === 'spartacus' && isAres(ctx.def.fac) && !S.boss.spLine) {
      S.boss.spLine = true;
      log(`⛓️ สปาร์ตาคัส: “${SPARTACUS_LINE}”`);
      h += `<div class="reveal" style="border-color:#a83232;background:#fbe9e4;font-size:16px">⛓️ สปาร์ตาคัส: “${SPARTACUS_LINE}”</div>`;
    }
    if (isBoss() && role === 'atk' && isAres(ctx.def.fac) && ctx.atk.gen && historical(ctx.atk.gen, 0)) h += `<div class="reveal">⚔️ บาดเจ็บจากมนุษย์: ${esc(ctx.atk.gen.name)} เป็นบุคคลในประวัติศาสตร์จริง สู้กับ Ares +10%</div>`;
    if (isBoss() && isAres(role === 'atk' ? ctx.def.fac : ctx.atk.fac)) h += `<div class="reveal" style="border-color:#6b5aa8;background:#eeeaf8">🦉 แพ้อาเธน่า: Ares มักเลือก “บุกตรง” — “ซุ่มโจมตี” แก้ทางได้</div>`;
    if (ctx.breakout && role === 'atk') h += `<div class="reveal" style="border-color:#b5452b;background:#fbe9e4">🏃 ทัพล้า: พลังรบ -20% · ถอยไม่ได้แล้ว แพ้ = ทัพแตกทั้งหมด</div>`;
    if (ctx.reveal) h += `<div class="reveal">🪶 หยั่งรู้ฟ้าดิน: ศัตรูจะเลือก ${stratTag(ctx.reveal)}<br><span class="muted">ใช้ ${stratTag(counterOf(ctx.reveal))} เพื่อแก้ทาง</span></div>`;
    const foe = role === 'atk' ? ctx.def.fac : ctx.atk.fac;
    if (askill(foe, role === 'atk' ? ctx.def.gen : ctx.atk.gen, 'foresight')) h += `<div class="reveal" style="border-color:#b5452b;background:#fbe9e4">⚠️ ขงเบ้งอาจอ่านกลยุทธ์ของเราออก!</div>`;
    h += `<div class="kanit center" style="margin-top:8px">เลือกกลยุทธ์</div><div class="strats">`;
    for (const k of STRAT_KEYS) {
      h += `<button class="btn strat" data-strat="${k}"><span class="si">${STRATEGIES[k].icon}</span>${STRATEGIES[k].name}<small>ชนะทาง ${STRATEGIES[STRATEGIES[k].beats].name}</small></button>`;
    }
    h += `</div><div class="strat-help">ซุ่มโจมตี ชนะ บุกตรง · บุกตรง ชนะ ตั้งรับ · ตั้งรับ ชนะ ซุ่มโจมตี (+30%)</div>`;
    if (role === 'atk' && !ctx.breakout) h += `<div class="cancel-row"><button class="btn ghost" data-strat="">↩️ ยกเลิกการบุก</button></div>`;

      h += `<div class="cancel-row"><button class="btn ghost" data-retreat-open>🏃 ถอนทัพ (ไม่รบ) — เลือกปลายทางบนแผนที่</button></div>
        <div class="ret-note">ถอนแล้วเสีย ${esc(node.name)} และกองรักษาการณ์ ทัพเสียทหาร ${Math.round(ctx.retreatOpts[0].lossFrac * 100)}% จากการโดนไล่ล่า</div>`;
    }
    const chooseHtml = h;
    const lossPct = canRetreat ? Math.round(ctx.retreatOpts[0].lossFrac * 100) : 0;
    // ถอนทัพ: หน้าต่างย่อเป็นแถบเล็ก แตะดินแดนที่เรืองแสงบนแผนที่เพื่อเลือก แล้วยืนยัน
    const pickHtml = () => {
      const P = UI.retreatPick, o = P.opts.find(x => x.to === P.sel);
      return `<div class="rp-head"><b>🏃 ถอนทัพจาก ${esc(node.name)}</b> — แตะดินแดนที่เรืองแสงบนแผนที่
        <span class="rp-key"><i style="background:${RP_COLOR.safe}"></i>ถอยเข้าดินแดนเรา<i style="background:${RP_COLOR.break}"></i>ตีฝ่าวงล้อม</span></div>
        <div class="rp-chips">${P.opts.map(x => `<button class="rp-chip ${x.kind} ${x.to === P.sel ? 'on' : ''}" data-retreat-pick="${x.to}">${rpLabel(x).icon} ${esc(S.nodes[x.to].name)}</button>`).join('')}</div>
        ${o ? `<div class="rp-info">${retreatInfoHtml(o)}</div>` : `<div class="muted">${esc(facName(ctx.atk.fac))} ยึด ${esc(node.name)} โดยไม่รบ · กองรักษาการณ์แตกกระจาย · ทัพเสียทหาร ${lossPct}% (ตามสัดส่วนทหารม้าของฝ่ายบุก)</div>`}
        <div class="rp-btns"><button class="btn ghost" data-retreat-back>↩️ กลับไปเลือกกลยุทธ์</button>
        <button class="btn primary" data-retreat-confirm ${o ? '' : 'disabled'}>${o ? `✅ ยืนยัน${o.kind === 'safe' ? 'ถอยเข้า' : 'ตีฝ่าวงล้อมเข้า'} ${esc(S.nodes[o.to].name)}` : 'เลือกปลายทางก่อน'}</button></div>`;
    };
    const card = $('battleCard');
    let done = false;
    const finish = v => { if (done) return; done = true; card.onclick = null; resolve(v); };
    const show = html => { card.innerHTML = html; card.scrollTop = 0; };
    const startPick = () => {
      UI.retreatPick = { node: ctx.node, from: ctx.atk.pos, atkFac: ctx.atk.fac, opts: ctx.retreatOpts, sel: null, prevView: UI.view,
        refresh: () => { show(pickHtml()); renderMap(); } };
      $('battle').classList.add('mini');
      fxClear(); // ลูกศรสดของฝ่ายบุกซ้ำกับลูกศรในโหมดเลือกปลายทาง
      fitRetreatView(UI.retreatPick);
      show(pickHtml());
      renderMap(); renderTop();
    };
    const endPick = () => {
      const P = UI.retreatPick;
      if (!P) return;
      UI.retreatPick = null;
      $('battle').classList.remove('mini');
      if (canZoom()) UI.view = P.prevView;
      renderMap(); renderTop();
    };
    show(chooseHtml);
    $('battle').classList.remove('hidden');
    if (UI.tut === 'target') UI.tut = 'strat';
    coachUpdate();
    card.onclick = e => {
      const b = e.target.closest('button');
      if (!b || done) return;
      if (b.hasAttribute('data-retreat-open')) { startPick(); coachHide(); return; }
      if (b.hasAttribute('data-retreat-back')) { endPick(); show(chooseHtml); coachUpdate(); return; }
      if (b.dataset.retreatPick != null) { UI.retreatPick.sel = +b.dataset.retreatPick; UI.retreatPick.refresh(); return; }
      if (b.hasAttribute('data-retreat-confirm')) { const to = UI.retreatPick && UI.retreatPick.sel; if (to == null) return; endPick(); finish({ retreat: to }); return; }
      if (b.dataset.strat != null) {
        const v = b.dataset.strat || null;
        if (!v) $('battle').classList.add('hidden');
        finish(v);
      }
    };
    if (Ctrl.auto) setTimeout(() => {
      if (canRetreat && Math.random() < 0.3) {
        card.querySelector('[data-retreat-open]').click();
        const rs = card.querySelectorAll('[data-retreat-pick]');
        rs[Math.floor(Math.random() * rs.length)].click();
        card.querySelector('[data-retreat-confirm]').click();
        return;
      }
      const bs = card.querySelectorAll('.btn.strat');
      bs[Math.floor(Math.random() * bs.length)].click();
    }, 40);
  });
}

function uiShowBattle(ctx, human) {
  return new Promise(resolve => {
    const A = ctx.atk, D = ctx.def, card = $('battleCard');

      <div class="arena"><span class="fx fa">${aIco}</span><span class="boom">💥</span><span class="fx fb">${dIco}</span></div>`;

      const adv = STRATEGIES[A.strat].beats === D.strat ? 'ฝ่ายบุกได้เปรียบกลยุทธ์'
        : STRATEGIES[D.strat].beats === A.strat ? 'ฝ่ายรับได้เปรียบกลยุทธ์' : 'กลยุทธ์เสมอกัน';
      const sideRes = (s, label) => `<div class="res-side" style="--c:${facColor(s.fac)}"><div class="muted">${label}: ${esc(facName(s.fac))}</div>
        <div class="pw">พลังรบ ${Math.round(s.power)}</div><div class="muted">ฐาน ${Math.round(s.base)} (รวมแพ้ทางทหาร)</div>
        <ul>${s.mods.map(m => `<li>${esc(m.label)}${m.m === 1 ? '' : ` ×${m.m.toFixed(2)}`}</li>`).join('')}</ul>
        <div>เสียทหาร: ${unitsHtml(s.lost)}</div><div>เหลือ: ${sumU(s.after)} นาย</div></div>`;
      card.innerHTML = `<h2 class="res-title ${win ? 'win' : 'lose'}">${win ? '🏆 ชัยชนะ!' : '💀 พ่ายแพ้…'}</h2>
        <div class="strat-line">${stratTag(A.strat)} vs ${stratTag(D.strat)} — ${adv}</div>
        ${ctx.aiForesight != null ? `<div class="center muted">🪶 ขงเบ้งหยั่งรู้กลยุทธ์ของเรา</div>` : ''}
        <div class="res-grid">${sideRes(A, 'ฝ่ายบุก')}${sideRes(D, 'ฝ่ายรับ')}</div>
        <ul class="outcome">${ctx.outcome.map(o => `<li>${esc(o)}</li>`).join('')}</ul>
        <div class="center"><button class="btn primary" id="btContinue">ดำเนินต่อ</button></div>`;
      if (UI.tut === 'strat') UI.tut = 'result';
      coachUpdate();
      $('btContinue').addEventListener('click', () => {
        $('battle').classList.add('hidden');
        if (UI.tut === 'result') UI.tut = 'end';
        resolve();
      }, { once: true });
      if (Ctrl.auto) setTimeout(() => $('btContinue').click(), 20);
    }, Ctrl.auto ? 60 : 1700);
  });
}

function uiGameOver() {
  if (!S.over) return;
  clearSave();
  const o = S.over, myNodes = S.nodes.filter(n => n.owner === 0).length;
  if (o.reason === 'boss') {
    let first = false;
    if (!saveDisabled && !S.progressDone) { S.progressDone = true; first = recordBossWin(); }
    openDialog(bossEndingHtml(first || saveDisabled));
    return;
  }
  const reason = o.reason === 'bossTime' ? `ครบ ${maxTurns()} เทิร์นแล้ว Ares ยังครองสนามรบนิรันดร์`
    : o.reason === 'conquest' ? `ทุกฝ่ายพ่ายแพ้แล้ว! Ares มอบอิสรภาพคืนแก่ ${facName(0)}`
    : o.reason === 'leader' ? `เราไร้แผ่นดินและทัพจอมทัพแตก${o.by >= 0 ? ` (โดย ${facName(o.by)})` : ''}`
    : o.reason === 'landless' ? `ไร้แผ่นดินครบ ${HOMELESS_TURNS} เทิร์นโดยไม่ได้เมืองหลวงใหม่`
    : o.win ? `ครบ ${maxTurns()} เทิร์น — เราครองดินแดนมากที่สุด` : `ครบ ${maxTurns()} เทิร์น — มีฝ่ายที่ครองดินแดนมากกว่าเรา`;
  let unlockMsg = '';
  if (o.win && !saveDisabled && !S.progressDone) {
    S.progressDone = true;
    const hadBoss = loadProgress().boss;
    const newly = isBoss() ? null : recordWin(S.level);
    if (newly != null) unlockMsg = `<p class="center" style="font-weight:600">🔓 ปลดล็อกระดับ ${LEVELS[newly].icon} ${LEVELS[newly].name} แล้ว!</p>`;
    if (!hadBoss && loadProgress().boss) unlockMsg += `<p class="center" style="font-weight:600;color:#9b1c1c">🩸 ปลดล็อกโหมด “ศึกชิงอิสรภาพ” แล้ว! (ปุ่มแยกในหน้าแรก)</p>`;
  }
  const rank = o.counts ? S.factions.filter(f => f.alive).map(f => `${facIcon(f.id)} ${facName(f.id)}: ${o.counts[f.id]} ดินแดน`).join('<br>') : '';
  openDialog(`<h2 class="res-title ${o.win ? 'win' : 'lose'}">${o.win ? '🏆 มีชัยในศึก!' : '💀 พ่ายแพ้'}</h2>
    <p class="center">${reason}</p>${unlockMsg}
    <div class="end-stats"><div>ระดับ: <b>${isBoss() ? '🩸 ศึกชิงอิสรภาพ' : `${LEVELS[S.level].icon} ${LEVELS[S.level].name}`}</b></div><div>ย้อนไป: <b>${LEVELS[S.level].undo < 0 ? '—' : LEVELS[S.level].undo - S.undoLeft} ครั้ง</b></div><div>เทิร์น: <b>${S.turn}</b></div><div>ดินแดนของเรา: <b>${myNodes}</b></div>
    <div>การรบ: <b>${S.stats.battles}</b></div><div>ชนะ: <b>${S.stats.won}</b></div></div>
    ${rank ? `<p class="center muted">${rank}</p>` : ''}
    <div class="center"><button class="btn primary" data-act="title">เล่นอีกครั้ง</button> <button class="btn ghost" data-close>ดูแผนที่</button></div>`);
}

// เตือนก่อนจบเทิร์น ถ้ายังมีทัพที่เดินได้หรือเงินพอเกณฑ์ทหาร
const END_WARN_GOLD = 40;
const NO_END_WARN_KEY = 'legendsWarlord.noEndWarn';
function endWarnOff() { try { return localStorage.getItem(NO_END_WARN_KEY) === '1'; } catch (e) { return false; } }
function setEndWarnOff(off) {
  try { if (off) localStorage.setItem(NO_END_WARN_KEY, '1'); else localStorage.removeItem(NO_END_WARN_KEY); } catch (e) { /* ignore */ }
}
function endTurnWarnings() {
  const w = [];
  // ทัพที่ประจำอยู่ในเมืองหลวงถือว่าเฝ้าเมือง ไม่นับว่า "ยังเดินได้"
  const movable = S.armies.filter(a => a.fac === 0 && a.node !== fac(0).capital && moveTargets(a).length > 0);
  if (movable.length) w.push(`ยังมีทัพที่เดินได้ ${movable.length} ทัพ: ${movable.map(a => `${a.gen.icon} ${esc(a.gen.name)}`).join(', ')}`);
  const g = fac(0).gold, minCost = Math.min(...UNIT_TYPES.map(t => UNITS[t].cost));
  if (g >= END_WARN_GOLD) {
    const hire = fac(0).capital != null && !hireBlock(0, fac(0).capital) ? ' หรือแต่งตั้งแม่ทัพใหม่' : '';
    w.push(`ยังมีเงินเหลือ ${g} 💰 — เกณฑ์ทหารได้อีก${hire} (ถูกสุด ${minCost} 💰 ต่อ ${PACK} นาย)`);
  }
  return w;
}
function onEndTurnClick() {
  if (!S || S.phase !== 'player' || UI.busy || S.over) return;
  const w = endWarnOff() ? [] : endTurnWarnings();
  if (!w.length) { endPlayerTurn(); return; }
  if (UI.tut) finishTutorial();
  openDialog(`<h2>⚠️ จบเทิร์นเลยไหม?</h2><ul class="outcome">${w.map(x => `<li>${x}</li>`).join('')}</ul>
    <label class="opt" style="justify-content:center;margin-bottom:10px"><input type="checkbox" id="optNoEndWarn"> ไม่ต้องเตือนอีก</label>
    <div class="muted center" style="margin-bottom:8px">เปิดคำเตือนกลับได้จากเมนู ☰</div>
    <div class="center"><button class="btn" data-act="back">↩️ กลับไปสั่งการ</button> <button class="btn primary" data-act="endturn">จบเทิร์นเลย ▶</button></div>`);
}

    <div class="act-col"><button class="btn" data-act="title">🏠 กลับหน้าหลัก (เล่นต่อภายหลังได้)</button>

    <button class="btn" data-act="restart">🔄 ยอมแพ้และเริ่มใหม่</button>

function bindUI() {
  $('legendGrid').addEventListener('click', e => {
    const c = e.target.closest('[data-legend]');
    if (c) { UI.setupLegend = c.dataset.legend; renderTitle(); }
  });
  $('sizeSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-size]');
    if (!b) return;
    UI.setupSize = b.dataset.size;
    try { localStorage.setItem(SIZE_KEY, UI.setupSize); } catch (err) { /* ignore */ }
    renderTitle();
  });
  bindMapGestures();
  $('aiSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-ai]');
    if (b) { UI.setupAI = +b.dataset.ai; renderTitle(); }
  });
  $('btnStart').addEventListener('click', () => { if (UI.setupLegend) startGame(UI.setupLegend, UI.setupAI); });
  $('btnBoss').addEventListener('click', startBoss);
  $('btnContinue').addEventListener('click', continueGame);
  $('btnHelpTitle').addEventListener('click', () => openDialog(helpHtml()));
  $('btnStory').addEventListener('click', () => openDialog(storyHtml()));
  $('btnHelp').addEventListener('click', () => openDialog(helpHtml()));
  $('btnMenu').addEventListener('click', () => { if (!UI.busy) openDialog(menuHtml()); });
  $('btnEnd').addEventListener('click', onEndTurnClick);
  $('btnUndo').addEventListener('click', doUndo);
  $('lvlSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-lvl]');
    if (b && !b.disabled) { UI.setupLevel = +b.dataset.lvl; renderTitle(); }
  });
  $('map').addEventListener('click', e => {
    if (UI.suppressClick && Date.now() - UI.suppressClick < 400) { UI.suppressClick = 0; return; } // เพิ่งลากแผนที่ ไม่นับเป็นการแตะ
    const g = e.target.closest('[data-node]');
    if (UI.retreatPick) { if (g) retreatPickNode(+g.dataset.node); return; }
    if (g) onNodeClick(+g.dataset.node);
  });
  $('info').addEventListener('click', onInfoClick);
  $('btnReplay').addEventListener('click', replayRound);
  $('btnSpeed').addEventListener('click', () => { const ks = Object.keys(AI_SPEEDS); setAiSpeed(ks[(ks.indexOf(UI.aiSpeed) + 1) % ks.length]); });
  $('coach').addEventListener('click', e => { if (e.target.closest('[data-tut]')) finishTutorial(); });
  window.addEventListener('resize', coachUpdate);
  $('panel').addEventListener('scroll', coachUpdate);
  $('legList').addEventListener('click', e => {
    const b = e.target.closest('[data-legnode]');
    if (!b || !S) return;
    UI.selNode = +b.dataset.legnode;
    const a = armyAt(UI.selNode);
    UI.selArmy = a && a.fac === 0 ? a.id : UI.selArmy;
    render();
  });
  $('armyList').addEventListener('click', e => {
    const b = e.target.closest('[data-army]');
    if (!b) return;
    const a = armyById(+b.dataset.army);
    if (a) {
      UI.selArmy = a.id; UI.selNode = a.node;
      if (S.phase === 'player') UI.ghost = false;
      if (UI.tut === 'army' && canMove(a)) UI.tut = 'target';
      render();
    }
  });
  $('dialog').addEventListener('click', e => {
    if (e.target.id === 'dialog' || e.target.closest('[data-close]')) { closeDialog(); return; }
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'title') { closeDialog(); showScreen('title'); renderTitle(); }
    if (b.dataset.act === 'endturn' || b.dataset.act === 'back') {
      const nw = $('optNoEndWarn');
      if (nw && nw.checked) setEndWarnOff(true);
    }
    if (b.dataset.act === 'endwarn') { setEndWarnOff(!endWarnOff()); openDialog(menuHtml()); }
    if (b.dataset.act === 'endturn') { closeDialog(); endPlayerTurn(); }
    if (b.dataset.act === 'back') {
      closeDialog();
      const movable = S.armies.filter(x => x.fac === 0 && moveTargets(x).length > 0);
      const a = movable.find(x => x.node !== fac(0).capital) || movable[0];
      UI.selArmy = a ? a.id : null;
      UI.selNode = a ? a.node : homeNode(0);
      render();
    }
    if (b.dataset.act === 'restart') { clearSave(); closeDialog(); S = null; showScreen('title'); renderTitle(); }
  });
}

/* =====================================================================
   TEST — โหมดทดสอบอัตโนมัติ: ?sim=N (ตรรกะล้วน) / ?autotest=N (ผ่าน UI จริง)
   ===================================================================== */
async function playAutoGame(legendId, numAI, seed, report, opt = {}) {
  newGame(legendId, numAI, seed, opt.level == null ? 1 : opt.level, opt.size || 's', { boss: !!opt.boss, troy: !!opt.troy });
  if (opt.noret === 'human') S.noRetreat = [0];
  else if (opt.noret === 'all') S.noRetreat = S.factions.map(f => f.id);
  let steps = 0;
  S.lead8 = undefined;
  while (!S.over && steps++ < 300) {
    if (S.turn === 8 && S.lead8 === undefined) S.lead8 = leaderFac();
    await aiTakeActions(0);
    const errs = checkInvariants();
    if (errs.length) { report.errors.push(`seed ${seed} t${S.turn}: ${errs.join('; ')} | ${S.log.slice(0, 12).map(l => l.text).join(' / ')}`); break; }
    if (S.over) break;
    await endPlayerTurn();
    const errs2 = checkInvariants();
    if (errs2.length) { report.errors.push(`seed ${seed} t${S.turn} after AI: ${errs2.join('; ')} | ${S.log.slice(0, 12).map(l => l.text).join(' / ')}`); break; }
  }
  if (!S.over) report.errors.push(`seed ${seed}: game did not end`);
  report.size = S.size;
  return S.over;
}

async function runTests(mode, n, opt = {}) {
  const report = { tune: Object.keys(TUNE).join(','), mode, level: opt.level == null ? 1 : opt.level, noret: opt.noret || 'none', games: 0, wins: 0, reasons: {}, turns: 0, errors: [], byLegend: {}, legendAll: {}, nodes: 0, battles: 0,
    retreats: 0, retreatsByHuman: 0, breakWin: 0, breakLose: 0, coord: 0, capStrike: 0,
    give: SIMOPT.give || null, w: {}, lead8: 0, lead8Top: 0, wHeld: {} };
  saveDisabled = true;
  Ctrl.auto = true;
  if (mode === 'sim') {
    // ผู้เล่นจำลอง (ที่นั่ง 0) = AI ระดับแม่ทัพเสมอ, ถอนทัพแบบแม่ทัพ, ขงเบ้งใช้หยั่งรู้
    // และมีนิสัยแบบคน: ครึ่งหนึ่งใช้กลยุทธ์ถนัด (บุก = บุกตรง, รับ = ตั้งรับ) อีกครึ่งสุ่ม
    Ctrl.askStrategy = async (ctx, role) => {
      if (role === 'def' && ctx.retreatOpts && ctx.retreatOpts.length) {
        const o = aiRetreatChoice(ctx, 1);
        if (o) { report.retreatsByHuman++; return { retreat: o.to }; }
      }
      if (ctx.reveal) return counterOf(ctx.reveal);
      if (rng() < 0.5) return role === 'atk' ? 'charge' : 'defend';
      return pick(STRAT_KEYS);
    };
    Ctrl.showRetreat = async () => {};
    Ctrl.showBattle = async () => {};
    Ctrl.showJoin = async () => {};
    Ctrl.askDismiss = async (j, gen, cands) => cands.slice().sort((p, q) => sumU(p.units) - sumU(q.units))[0];
    Ctrl.delay = async () => {};
    Ctrl.render = () => {};
    Ctrl.gameOver = () => {};
    Ctrl.fx = false; Ctrl.aiArrow = async () => {}; Ctrl.aiCatchUp = async () => {}; Ctrl.fxClear = () => {};
  } else {
    Ctrl.gameOver = () => {};
    showScreen('game');
  }
  for (let i = opt.from || 0; i < (opt.from || 0) + n; i++) {
    const seats = LEGENDS.filter(l => !l.locked || opt.troy);
    const L = seats[i % seats.length].id, numAI = 2 + (i % 3 === 2 ? 1 : 0), seed = 1000 + i;
    try {
      const over = await playAutoGame(L, numAI, seed, report, opt);
      report.games++;
      report.retreats += S.rstats.retreat; report.breakWin += S.rstats.breakWin; report.breakLose += S.rstats.breakLose; report.coord += S.rstats.coord; report.focus = (report.focus || 0) + S.rstats.focus; report.capStrike += S.rstats.capStrike;
      report.nodes += S.nodes.length;
      for (const k in S.wstats) report.w[k] = (report.w[k] || 0) + S.wstats[k];
      if (S.boss) {
        const bs = report.boss = report.boss || { rage: 0, puppet: 0, athena: 0, net: 0, jar: 0, mortal: 0, freed: 0, throneTaken: 0, aresDead: 0 };
        bs.rage += S.boss.power.rage; bs.puppet += S.boss.power.puppet; bs.freed += S.boss.freed; bs.throneTaken += S.boss.throneTaken ? 1 : 0;
        for (const k of ['athena', 'net', 'jar', 'mortal']) bs[k] += S.boss.weak[k];
        if (!fac(S.boss.ares).alive) bs.aresDead++;
      }
      report.cap = report.cap || {};
      for (const k of ['reloc', 'homeless', 'regain']) report.cap[k] = (report.cap[k] || 0) + (S.rstats[k] || 0);
      report.elim = (report.elim || 0) + S.factions.filter(f => !f.alive).length;

      if (S.lead8 != null) {
        report.lead8++;
        const top = S.over && S.over.reason === 'conquest' ? 0 : leaderFac();
        if (top === S.lead8) report.lead8Top++;
      }
      // ตำนานที่อยู่กับที่นั่งผู้เล่นตอนจบเกม → อัตราชนะของที่นั่งนั้น
      for (const a of S.armies) if (a.fac === 0 && a.gen.wid) {
        const h = report.wHeld[a.gen.wid] = report.wHeld[a.gen.wid] || [0, 0];
        h[0]++; if (S.over && S.over.win) h[1]++;
      }
      report.battles += S.stats.battles;
      const TS = report.target = report.target || { onP: 0, onAI: 0, bP: 0, bAI: 0 };
      for (const k in TS) TS[k] += S.tstats[k];
      if (over) {
        if (over.win) report.wins++;
        report.reasons[over.reason + (over.win ? '-win' : '-lose')] = (report.reasons[over.reason + (over.win ? '-win' : '-lose')] || 0) + 1;
        report.turns += S.turn;
        const b = report.byLegend[L] = report.byLegend[L] || [0, 0];
        b[0]++; if (over.win) b[1]++;
        // ทุกที่นั่ง (รวมฝ่าย AI): รอดถึงจบเกม และสัดส่วนดินแดน
        for (const f of S.factions) {
          const x = report.legendAll[f.legend] = report.legendAll[f.legend] || { games: 0, alive: 0, share: 0 };
          x.games++; if (f.alive) x.alive++;
          x.share += S.nodes.filter(n => n.owner === f.id).length / S.nodes.length;
        }
      }
      if (mode === 'autotest') { render(); uiGameOver(); closeDialog(); }
    } catch (e) {
      report.errors.push(`seed ${seed}: EXC ${e && e.stack || e}`);
    }
  }
  report.avgTurns = +(report.turns / Math.max(1, report.games)).toFixed(1);
  report.avgNodes = +(report.nodes / Math.max(1, report.games)).toFixed(1);
  report.uiErrors = window.__errs || [];
  // สัดส่วนการบุกของ AI ที่ลงที่ผู้เล่น เทียบกับสัดส่วนดินแดนผู้เล่นในพรมแดนของ AI (ควรใกล้กัน)
  if (report.target) { const T = report.target; T.atkOnPlayerPct = Math.round(100 * T.onP / Math.max(1, T.onP + T.onAI)); T.borderPlayerPct = Math.round(100 * T.bP / Math.max(1, T.bP + T.bAI)); }
  report.seatWinPct = {};
  for (const k in report.byLegend) report.seatWinPct[k] = Math.round(100 * report.byLegend[k][1] / report.byLegend[k][0]);
  for (const k in report.legendAll) { const x = report.legendAll[k]; x.alivePct = Math.round(100 * x.alive / x.games); x.sharePct = Math.round(100 * x.share / x.games); delete x.share; }
  const out = $('testOut');
  out.textContent = 'TESTDONE ' + JSON.stringify(report);
  out.classList.remove('hidden');
  document.title = 'TESTDONE';
}

  try { localStorage.removeItem(PROGRESS_KEY); } catch (e) { /* ignore */ }
}

// ?legendtest — ทดสอบกติกาตำนานพเนจรทุกข้อ (ตั้งสถานการณ์ตรง ๆ แล้วตรวจผล)
async function runLegendTest() {
  saveDisabled = true;
  const res = [], check = (name, ok, extra) => res.push(`${ok ? 'PASS' : 'FAIL'} ${name}${extra ? ' ' + extra : ''}`);
  const q = sel => document.querySelector(sel);
  const inv = () => checkInvariants().join(';');
  // ตั้งสถานการณ์: ทัพ a (ฝ่าย fa) ที่ดินแดน A บุกดินแดน B ข้างเคียง
  const pair = () => {
    const e = S.edges.find(e => !e.mountain && S.nodes[e.a].capitalOf === null && S.nodes[e.b].capitalOf === null && !armyAt(e.a) && !armyAt(e.b) && !wildAt(e.a) && !wildAt(e.b));
    return [S.nodes[e.a], S.nodes[e.b]];
  };
  let seedK = +(new URLSearchParams(location.search).get('seed') || 4242);
  const fresh = (lvl = 1) => {
    $('optTut').checked = false;
    newGame('napoleon', 2, seedK++, lvl);
    UI.busy = false; UI.tut = null; clearUndo();
    UI.selNode = fac(0).capital; UI.selArmy = armyAt(fac(0).capital).id;
    showScreen('game'); render();
    Ctrl.auto = true;
  };
  try {
    // --- การวาง ---
    let okPlace = true, cnt = {};
    for (let i = 0; i < 40; i++) {
      newGame(LEGENDS[i % 4].id, 2 + (i % 2), 900 + i, 1);
      if (S.wild.length < 2 || S.wild.length > 3 || S.wild.some(w => S.nodes[w.node].owner !== NEUTRAL || sumU(S.nodes[w.node].garrison) < 4 + WANDER_GUARD)) okPlace = false;
      for (const w of S.wild) cnt[w.wid] = (cnt[w.wid] || 0) + 1;
    }
    check('placed 2-3 on neutral with +6 guard', okPlace);
    check('all 9 legends appear across games', Object.keys(cnt).length === 9, JSON.stringify(cnt));

    fresh();
    render();
    check('legend list shown', !$('legCard').classList.contains('hidden') && document.querySelectorAll('#legList .leg-item').length === S.wild.length);
    const w0 = S.wild[0];
    check('map shows wild badge', /✨/.test($('map').innerHTML) && $('map').innerHTML.includes(WMAP[w0.wid].icon));
    UI.selNode = w0.node; render();
    check('info shows skill & weakness', $('info').textContent.includes(WMAP[w0.wid].skillName) && $('info').textContent.includes(WMAP[w0.wid].weakName));

    // --- ยึดดินแดนตำนานด้วยแม่ทัพธรรมดา: ตำนานนำทัพแทน ทหารอยู่ครบ ---
    fresh();
    let [A, B] = pair();
    S.wild = [{ wid: 'robin', node: B.id }]; S.wInGame = ['robin'];
    A.owner = 0; B.owner = NEUTRAL; B.garrison = Z();
    fac(0).gold = 100;
    let g = newArmy(0, A.id, { name: 'แม่ทัพทดสอบ', icon: '🎖️', leader: false }, { inf: 10, cav: 0, arc: 10 });
    await moveArmy(g, B.id);
    check('wild + normal general → legend leads, troops kept', g.gen.wid === 'robin' && sumU(g.units) === 20 && g.node === B.id && !wildAt(B.id), inv());

    // --- ยึดด้วยจอมทัพ: ตำนานตั้งทัพใหม่ที่เมืองหลวง (มาตัวเปล่า) ---
    fresh();
    const lead = armyAt(fac(0).capital);
    const C = moveTargets(lead).find(id => S.nodes[id].capitalOf === null);
    S.wild = [{ wid: 'wukong', node: C }]; S.wInGame = ['wukong'];
    S.nodes[C].owner = NEUTRAL; S.nodes[C].garrison = Z();
    await moveArmy(lead, C);
    const wa = S.armies.find(a => a.gen.wid === 'wukong');
    check('wild + leader → new army at capital', !!wa && wa.node === fac(0).capital && wa.fac === 0 && sumU(wa.units) === 0 && wa.used === 99, inv());
    check('wukong moves 2 & loyal', maxMoves(wa) === 2 && isLoyal(wa.gen, 0));

    // --- ทัพครบ 3: ผู้เล่นเลือกปลดแม่ทัพธรรมดา ---
    fresh();
    [A, B] = pair();
    A.owner = 0;
    S.wild = [{ wid: 'pichai', node: B.id }]; S.wInGame = ['pichai'];
    B.garrison = Z();
    const lead3 = armyAt(fac(0).capital); lead3.node = A.id;
    const own = S.nodes.filter(n => n.capitalOf === null && !armyAt(n.id) && n.id !== A.id && n.id !== B.id).slice(0, 2);
    own.forEach(n => { n.owner = 0; });
    const h1 = newArmy(0, own[0].id, { name: 'แม่ทัพหนึ่ง', icon: '🎖️', leader: false }, { inf: 5, cav: 0, arc: 0 });
    const h2 = newArmy(0, own[1].id, { name: 'แม่ทัพสอง', icon: '🎖️', leader: false }, { inf: 9, cav: 0, arc: 0 });
    Ctrl.auto = false;
    const pm = moveArmy(lead3, B.id);
    await new Promise(r => setTimeout(r, 30));
    check('dismiss dialog shown', !$('battle').classList.contains('hidden') && document.querySelectorAll('#battleCard [data-dismiss]').length === 3);
    q(`#battleCard [data-dismiss="${h2.id}"]`).click();
    await new Promise(r => setTimeout(r, 30));
    check('join notice shown', !!$('btContinue') && /ได้ตำนาน/.test($('battleCard').textContent));
    $('btContinue').click();
    await pm;
    Ctrl.auto = true;
    check('dismissed general replaced by legend', h2.gen.wid === 'pichai' && sumU(h2.units) === 9 && S.armies.filter(a => a.fac === 0).length === 3, inv());
    check('pichai cannot retreat', retreatOptions(h2, h2.node, lead3).length === 0);

    // --- จับตำนานศัตรูแบบชนะขาด ---
    fresh();
    [A, B] = pair();
    A.owner = 0; B.owner = 1; B.garrison = Z(); A.garrison = Z();
    S.wild = []; S.wInGame = ['achilles'];
    let me = armyAt(fac(0).capital); me.node = A.id; me.units = { inf: 40, cav: 20, arc: 40 };
    let foe = newArmy(1, B.id, legendGen('achilles', null), { inf: 2, cav: 1, arc: 0 });
    // ไม่มีทางถอย: ล้อมดินแดนรอบ B ด้วยฝ่าย 0
    for (const nb of neighbors(B.id)) if (S.nodes[nb.id].capitalOf === null) S.nodes[nb.id].owner = 0;
    let ctx = await battle(me, B); await processJoins();
    const cap1 = S.armies.find(a => a.gen.wid === 'achilles');
    check('decisive win captures legend', ctx.atkWin && ctx.decisive && !!cap1 && cap1.fac === 0 && sumU(cap1.units) === 0 && cap1.gen.from === 1, inv());
    check('captured legend not loyal 3 turns', !isLoyal(cap1.gen, 0) && loyalLeft(cap1.gen) === WANDER_LOYAL);
    cap1.units = { inf: 10, cav: 0, arc: 0 };
    const pw = powerOf(atkSide(cap1), { fac: 1, units: { inf: 10, cav: 0, arc: 0 }, gen: null }, B.id, 'atk');
    check('unloyal: skill off, -20% vs old owner', !pw.mods.some(m => /นักรบไร้เทียมทาน/.test(m.label)) && pw.mods.some(m => /เจ้าของเก่า/.test(m.label) && m.m === TRAITOR_MOD));
    // แพ้การรบตอนยังไม่ภักดี = ทิ้งทัพหนี
    const C2 = neighbors(cap1.node).map(nb => nb.id).find(id => S.nodes[id].owner !== 0 && !armyAt(id) && !neighbors(cap1.node).find(nb => nb.id === id).mountain);
    if (C2 != null) {
      S.nodes[C2].garrison = { inf: 30, cav: 30, arc: 30 };
      const nW = S.nodes.filter(n => n.owner === NEUTRAL).length;
      ctx = await battle(cap1, S.nodes[C2]); await processJoins();
      const stillArmy = S.armies.find(a => a.gen.wid === 'achilles');
      check('unloyal legend loses → deserts', !ctx.atkWin && (!stillArmy) && (!!wildAt(S.wild.find(w => w.wid === 'achilles') ? S.wild.find(w => w.wid === 'achilles').node : -1) || S.resting.some(r => r.wid === 'achilles')), `neutral=${nW} ${inv()}`);
    } else check('unloyal legend loses → deserts', true, '(skip: no target)');
    S.turn += WANDER_LOYAL;
    check('loyal after 3 turns', isLoyal(legendGen('achilles', 1), 0) === false && (() => { const g2 = legendGen('achilles', 1); S.turn += WANDER_LOYAL; const ok = isLoyal(g2, 0); return ok; })());

    // --- ชนะไม่ขาด → หนีไปพเนจรที่ดินแดนกลางอื่น ---
    fresh();
    [A, B] = pair();
    A.owner = 0; B.owner = 1; B.garrison = Z(); A.garrison = Z();
    S.wild = []; S.wInGame = ['musashi'];
    me = armyAt(fac(0).capital); me.node = A.id; me.units = { inf: 12, cav: 0, arc: 0 };
    foe = newArmy(1, B.id, legendGen('musashi', null), { inf: 11, cav: 0, arc: 0 });
    for (const nb of neighbors(B.id)) if (S.nodes[nb.id].capitalOf === null) S.nodes[nb.id].owner = 0;
    S.nodes.find(n => n.owner === NEUTRAL) || (S.nodes.find(n => n.capitalOf === null && n.owner !== 0 && n.id !== B.id).owner = NEUTRAL);
    let fled = false;
    for (let k = 0; k < 20 && !fled; k++) {
      foe.units = { inf: 11, cav: 0, arc: 0 }; me.units = { inf: 12, cav: 0, arc: 0 }; me.node = A.id; A.owner = 0; B.owner = 1;
      if (!S.armies.includes(foe)) S.armies.push(foe);
      if (!S.armies.includes(me)) S.armies.push(me);
      S.wild = []; foe.node = B.id;
      ctx = await battle(me, B); await processJoins();
      if (ctx.atkWin && !ctx.decisive) fled = !S.armies.includes(foe) && (S.wild.some(w => w.wid === 'musashi') || S.resting.some(r => r.wid === 'musashi'));
      else { S.wild = []; S.resting = []; }
      if (S.over) break;
    }
    check('non-decisive break → legend flees to wander', fled);
    const wm = S.wild.find(w => w.wid === 'musashi');
    check('fled to other neutral node with new guard', !wm || (wm.node !== B.id && S.nodes[wm.node].owner === NEUTRAL && sumU(S.nodes[wm.node].garrison) >= WANDER_GUARD));

    // --- ไม่มีดินแดนกลาง → พัก 3 เทิร์น แล้วโผล่ในดินแดนที่ไม่มีทัพ/ไม่ใช่เมืองหลวง ---
    fresh();
    for (const n of S.nodes) if (n.owner === NEUTRAL) n.owner = 1;
    S.wild = []; S.wInGame = ['liubei'];
    wanderAway('liubei', null);
    check('no neutral → rests', S.resting.length === 1 && S.resting[0].back === S.turn + WANDER_REST);
    S.turn += WANDER_REST;
    for (const n of S.nodes) if (sumU(n.garrison) === 0) n.garrison.inf = 1;
    wanderReturn();
    check('return: no empty land → keeps waiting', S.resting.length === 1 && !S.wild.length && /รอดินแดนว่าง/.test(legendWhere('liubei').text));
    // ว่างหลายแบบ แต่โผล่ได้เฉพาะดินแดนที่ไม่มีทัพ ไม่มีกองรักษาการณ์ และไม่ใช่เมืองหลวง/อดีตเมืองหลวง
    for (const n of S.nodes.filter(n => n.capitalOf !== null)) n.garrison = Z();
    for (const a of S.armies) S.nodes[a.node].garrison = Z();
    const okNode = S.nodes.find(n => n.capitalOf === null && !armyAt(n.id));
    okNode.garrison = Z();
    S.turn++; wanderReturn();
    const lw = S.wild.find(w => w.wid === 'liubei');
    check('returns only on empty land (no army/garrison, not capital or ex-capital)', !!lw && lw.node === okNode.id && S.nodes[lw.node].owner === NEUTRAL && sumU(S.nodes[lw.node].garrison) === WANDER_GUARD, inv());
    // 2 เทิร์นสุดท้ายไม่โผล่ (หายไปจนจบเกม)
    S.wild = []; S.resting = [{ wid: 'liubei', back: 1 }];
    const ok2 = S.nodes.find(n => n.capitalOf === null && !armyAt(n.id) && n.id !== okNode.id);
    ok2.garrison = Z();
    let late = true;
    for (const t of [maxTurns() - 1, maxTurns()]) { S.turn = t; wanderReturn(); if (S.wild.length || S.resting.length !== 1) late = false; }
    check('no return in last 2 turns', late && /จนจบศึก/.test(legendWhere('liubei').text));
    S.turn = maxTurns() - 2; wanderReturn();
    check('returns at 3rd-to-last turn', S.wild.some(w => w.wid === 'liubei' && w.node === ok2.id) && !S.resting.length, inv());
    S.resting = [{ wid: 'joan', back: maxTurns() - 1 }]; S.turn = 3;
    check('rest ending in last 2 turns shown as gone till end', /จนจบศึก/.test(legendWhere('joan').text));
    S.resting = []; S.turn = 1;

    // --- หนุมาน: ลมพัดคืนชีพครั้งแรกเท่านั้น ---
    fresh();
    // เลือกคู่ดินแดนที่ B มีเพื่อนบ้านว่างอีกแห่งให้ถอยไป
    const freeSide = (x, y) => neighbors(y.id).some(nb => nb.id !== x.id && S.nodes[nb.id].capitalOf === null && !armyAt(nb.id));
    for (const e of S.edges) {
      const [x, y] = [S.nodes[e.a], S.nodes[e.b]];
      if (!e.mountain && x.capitalOf === null && y.capitalOf === null && !armyAt(x.id) && !armyAt(y.id) && freeSide(x, y)) { [A, B] = [x, y]; break; }
    }
    A.owner = 1; B.owner = 0; A.garrison = Z(); B.garrison = Z();
    S.wild = []; S.wInGame = ['hanuman'];
    const hn = newArmy(0, B.id, legendGen('hanuman', null), { inf: 10, cav: 0, arc: 10 });
    const side = neighbors(B.id).map(nb => nb.id).find(id => id !== A.id && S.nodes[id].capitalOf === null && !armyAt(id));
    for (const nb of neighbors(B.id)) if (S.nodes[nb.id].capitalOf === null && nb.id !== side) S.nodes[nb.id].owner = 1;
    if (side == null) throw new Error('no side node');
    S.nodes[side].owner = 0; // ที่ว่างให้ลมพัดคืนชีพถอยไป (ทัพโดนตีจนเหลือ 0 จึงไม่ได้ถอยตามปกติ)
    const big = newArmy(1, A.id, { name: 'ศัตรู', icon: '🎖️', leader: false }, { inf: 60, cav: 60, arc: 60 });
    S.noRetreat = [0];
    ctx = await battle(big, B); await processJoins();
    check('hanuman revives 30% once', S.armies.includes(hn) && sumU(hn.units) === 6 && hn.node === side && S.wflags.revive_hanuman, `units=${sumU(hn.units)} ${ctx.outcome.join('|')} ${inv()}`);
    const r2 = destroyArmy(hn, { by: 1, decisive: false });
    check('second break: no revive', !r2.revived && !S.armies.includes(hn));
    S.noRetreat = [];

    // --- โจน: ทัพแตก = หายถาวร / ธงแห่งศรัทธา ---
    fresh();
    const jn = newArmy(0, moveTargets(armyAt(fac(0).capital))[0], legendGen('joan', null), { inf: 5, cav: 0, arc: 0 });
    S.nodes[jn.node].owner = 0; S.wild = []; S.wInGame = ['joan'];
    const ld = armyAt(fac(0).capital);
    const pj = powerOf(atkSide(ld), { fac: 1, units: { inf: 5, cav: 0, arc: 0 }, gen: null }, jn.node, 'atk');
    check('joan aura on adjacent army', pj.mods.some(m => /ธงแห่งศรัทธา/.test(m.label)));
    destroyArmy(jn, { by: 1, decisive: true });
    check('joan perishes (not captured)', S.wgone.includes('joan') && !S.joins.length && !S.armies.some(a => a.gen.wid === 'joan'), inv());

    // --- ขุนแผนได้ทหารราบฟรี / โรบินฮู้ดได้เงิน ---
    fresh();
    [A, B] = pair();
    A.owner = 0; B.owner = 1; B.garrison = Z();
    S.wild = []; S.wInGame = ['khunphaen', 'robin'];
    const kp = newArmy(0, A.id, legendGen('khunphaen', null), { inf: 0, cav: 0, arc: 0 });
    startFactionTurn(0);
    check('khun phaen +3 inf at turn start', kp.units.inf === 3);
    kp.gen = legendGen('robin', null); kp.units = { inf: 5, cav: 0, arc: 5 };
    const g0 = fac(0).gold;
    await moveArmy(kp, B.id);
    check('robin loots 10 on enemy node', fac(0).gold === g0 + 10 && B.owner === 0);

    // --- เล่าปี่: ตำนานที่จับมาภักดีทันที ไม่โดนโทษ แต่ตัวเล่าปี่เองโดนตามปกติ ---
    fresh();
    S.wild = []; S.wInGame = ['liubei', 'musashi'];
    const t1 = moveTargets(armyAt(fac(0).capital))[0];
    S.nodes[t1].owner = 0;
    const lb = newArmy(0, t1, legendGen('liubei', null), { inf: 5, cav: 0, arc: 0 });
    const capd = { name: 'มูซาชิ', icon: '🥋', leader: false, wid: 'musashi', from: 1, loyalAt: S.turn + 3 };
    check('liu bei: captured legend loyal at once, no penalty', isLoyal(capd, 0) && !traitorPenalty(capd, 0, 1));
    lb.gen = { ...legendGen('liubei', 1) };
    check('liu bei captured himself: normal rules', !isLoyal(lb.gen, 0) && traitorPenalty(lb.gen, 0, 1));

    // --- AI: จอมพลเลือกตั้งรับใส่ซุนหงอคง, นายกองไม่สนตำนาน ---
    fresh(2);
    const wkSide = { fac: 0, units: { inf: 10, cav: 0, arc: 0 }, gen: legendGen('wukong', null) };
    const aiSide = { fac: 1, units: { inf: 10, cav: 0, arc: 0 }, gen: null };
    let def = 0;
    for (let k = 0; k < 200; k++) if (aiPickStrategy('def', { atk: wkSide, def: aiSide }, aiSide) === 'defend') def++;
    check('จอมพล AI defends vs wukong', def > 150, `defend=${def}/200`);
    fresh(0);
    check('นายกอง: no wandering legends', S.wild.length === 0 && S.wInGame.length === 0 && !/ตำนานพเนจรในศึกนี้/.test($('legCard').classList.contains('hidden') ? '' : $('legCard').textContent));
    fresh(1);
    check('แม่ทัพ values legends', legendValue(1, S.nodes[S.wild[0].node]) > 0);

    // --- หน้าต่างก่อนรบแสดงสกิล/จุดอ่อน ---
    fresh();
    Ctrl.auto = false;
    const lw2 = armyAt(fac(0).capital);
    [A, B] = pair();
    A.owner = 0; lw2.node = A.id; B.owner = 1;
    newArmy(1, B.id, legendGen('khunphaen', null), { inf: 5, cav: 0, arc: 0 });
    S.wInGame = ['khunphaen']; S.wild = [];
    const pb = moveArmy(lw2, B.id);
    await new Promise(r => setTimeout(r, 30));
    check('battle prompt shows legend box', /เสกหุ่นพยนต์/.test($('battleCard').textContent) && /ของขลังเสื่อมในน้ำ/.test($('battleCard').textContent));
    Ctrl.auto = true;
    q('#battleCard .btn.strat').click();
    await pb;

    // --- จุดอ่อนจอมทัพหลัก ---
    const mk = (leg, lvl = 1) => { newGame(leg, 2, seedK++, lvl); for (const f of S.factions) f.human = false; S.wild = []; S.wInGame = []; };
    // เจงกิสข่าน: กำแพงเมืองหลวงศัตรู +40%
    mk('genghis');
    const gE = fac(1).capital != null ? 1 : 2, gO = 3 - gE, capE = S.nodes[fac(gE).capital];
    let pg = powerOf({ fac: gE, units: { inf: 10, cav: 0, arc: 0 }, gen: null, pos: capE.id }, { fac: 0, units: { inf: 10, cav: 0, arc: 0 }, gen: null }, capE.id, 'def');
    let pn = powerOf({ fac: gE, units: { inf: 10, cav: 0, arc: 0 }, gen: null, pos: capE.id }, { fac: gO, units: { inf: 10, cav: 0, arc: 0 }, gen: null }, capE.id, 'def');
    check('genghis: enemy capital wall +40%', pg.mods.some(m => /กำแพง/.test(m.label) && Math.abs(m.m - 1.4) < 1e-9) && pn.mods.some(m => /กำแพง/.test(m.label) && Math.abs(m.m - CAPITAL_WALL) < 1e-9));
    // ขงเบ้ง: บุก -10%, รับไม่โดน
    mk('kongming');
    const ku = { fac: 0, units: { inf: 10, cav: 0, arc: 0 }, gen: null }, eu = { fac: 1, units: { inf: 10, cav: 0, arc: 0 }, gen: null };
    const kn = S.nodes.find(n => n.capitalOf === null).id;
    check('kongming: -10% only when attacking', powerOf(ku, eu, kn, 'atk').mods.some(m => /บุกเหนือ/.test(m.label) && m.m === 0.9) && !powerOf(ku, eu, kn, 'def').mods.some(m => /บุกเหนือ/.test(m.label)));
    // นโปเลียน: ห่างเมืองหลวงเกิน 3 ช่อง -15%
    mk('napoleon');
    const dN = bfs(fac(0).capital, 0, () => true).dist;
    const far = S.nodes.find(n => dN[n.id] > 3), near = S.nodes.find(n => dN[n.id] === 3);
    const nGen = { name: 'x', icon: '🎖️', leader: false };
    const nw = pos => powerOf({ fac: 0, units: { inf: 10, cav: 0, arc: 0 }, gen: nGen, pos }, eu, pos, 'def').mods.some(m => /ขยายเกินตัว/.test(m.label));
    check('napoleon: far army -15%, 3 hops ok', (!far || nw(far.id)) && (!near || !nw(near.id)), `far=${far && far.id} near=${near && near.id}`);

    check('bayinnaung leader broken → 2 farthest rebel', rebels.length === 2 && rebels.every(n => dB[n.id] >= farD && sumU(n.garrison) >= 4) && !!leaderArmy(0) && leaderArmy(0).node === capBy && sumU(leaderArmy(0).units) === 0,
      `rebels=${rebels.map(n => n.id + ':' + dB[n.id]).join(',')} farD=${farD} cand=${cand.slice(0, 4).map(n => n.id + ':' + dB[n.id]).join(',')} ${inv()}`);

    // --- AI ไร้แผ่นดินให้ค่าเมืองหลวงสูง ---
    fresh('napoleon');
    const ai = S.factions.find(F => !F.human && F.capital != null).id;
    const X = S.nodes[fac(0).capital], keep = fac(ai).capital, before = nodeValue(ai, X);
    fac(ai).capital = null; fac(ai).homeless = { left: 3, fresh: false };
    check('homeless AI values capitals', nodeValue(ai, X) >= before + 100);
    fac(ai).capital = keep; fac(ai).homeless = null;
  } catch (e) {
    res.push('EXC ' + (e && e.stack || e));
  }
  $('testOut').textContent = 'TESTDONE ' + JSON.stringify({ cap: res, errs: window.__errs });
  $('testOut').classList.remove('hidden'); document.title = 'TESTDONE';
}

// ?duel=N — วัดพลังรบของตำนานแต่ละตัว: ทัพตำนาน vs ทัพแม่ทัพธรรมดา ทหารสุ่มเท่ากัน ภูมิประเทศ/บทบาทสุ่ม
// (สกิลนอกสนามรบ เช่น เดิน 2 ช่อง ทหารฟรี ไม่ได้วัดที่นี่ — ดู ?sim&give=)
async function runDuel(n, lvl = 1) {
  saveDisabled = true; Ctrl.auto = true;
  Ctrl.askStrategy = async () => 'defend'; Ctrl.showRetreat = async () => {}; Ctrl.showBattle = async () => {};
  Ctrl.showJoin = async () => {}; Ctrl.delay = async () => {}; Ctrl.render = () => {};
  const out = {};
  for (const id of ['none', ...WANDERERS.map(w => w.id)]) {
    let win = 0, kept = 0;
    for (let i = 0; i < n; i++) {
      TUNE.nowander = true;
      newGame('kongming', 2, 5000 + i, lvl);
      TUNE.nowander = false;
      for (const f of S.factions) f.human = false;
      S.armies = []; S.wild = []; S.wInGame = [];
      const e = S.edges.find(e => !e.mountain && S.nodes[e.a].capitalOf === null && S.nodes[e.b].capitalOf === null);
      const legAtk = rng() < 0.5;
      const [na, nb] = [S.nodes[e.a], S.nodes[e.b]];
      na.owner = 0; nb.owner = 1; na.garrison = Z(); nb.garrison = Z();
      nb.terrain = weighted(TERRAIN_WEIGHTS);
      const u = Z(); for (let k = 0; k < 30; k++) u[pick(UNIT_TYPES)]++;
      const leg = id === 'none' ? { name: 'x', icon: '🎖️', leader: false } : legendGen(id, null);
      const plain = { name: 'y', icon: '🎖️', leader: false };
      // ฝ่ายบุกอยู่ที่ na (ฝ่าย 0) ฝ่ายรับอยู่ที่ nb (ฝ่าย 1)
      const atk = newArmy(0, na.id, legAtk ? leg : plain, { ...u });
      newArmy(1, nb.id, legAtk ? plain : leg, { ...u });
      const defNode = nb;
      const ctx = await battle(atk, defNode);
      const legWon = legAtk ? ctx.atkWin : !ctx.atkWin;
      if (legWon) win++;
      const mine = legAtk ? ctx.atk : ctx.def;
      kept += mine.after ? sumU(mine.after) / 30 : 0;
    }
    out[id] = { win: Math.round(100 * win / n), kept: Math.round(100 * kept / n) };
  }
  $('testOut').textContent = 'TESTDONE ' + JSON.stringify({ duel: out, errs: window.__errs });
  $('testOut').classList.remove('hidden'); document.title = 'TESTDONE';
}
