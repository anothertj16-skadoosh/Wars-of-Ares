<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wars of Ares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe4cc; --panel:#fffaf0; --ink:#2b2118; --muted:#7a6a55; --line:#d9c7a3;
  --dark:#3b2a1d; --accent:#b5452b; --accent2:#2f7d4f; --sea:#cbdde2; --land:#e8dcbc;
  --win:#2f7d4f; --lose:#b03a2e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Sarabun','Leelawadee UI','Tahoma',sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.btn,.kanit{font-family:'Kanit','Leelawadee UI','Tahoma',sans-serif;font-weight:600}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:14px}
.btn{border:0;border-radius:10px;padding:10px 16px;background:#e6d6b4;cursor:pointer;font-size:16px;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#fff}
.btn.green{background:var(--accent2);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--dark);color:#fff4dd;vertical-align:middle;margin-left:4px}

/* ---------- Screens ---------- */
.screen{display:none}
.screen.active{display:flex}

/* Title */
#title{flex-direction:column;align-items:center;min-height:100%;padding:24px 16px 40px}
.logo{text-align:center;margin:8px 0 18px}
.logo h1{font-size:clamp(30px,8vw,48px);color:var(--dark);letter-spacing:.5px}
.logo p{margin:4px 0 0;color:var(--muted)}
.logo .tagline{font-family:'Kanit',sans-serif;font-weight:600;font-size:clamp(17px,4.5vw,22px);color:var(--accent);margin-top:0}
.logo .story-btn{margin-top:10px;font-size:14px;padding:6px 14px}
.story p{margin:0 0 10px;line-height:1.75}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;width:100%;max-width:980px}
.legend-card{background:var(--panel);border:3px solid transparent;border-radius:14px;padding:14px;cursor:pointer;text-align:left;box-shadow:0 2px 6px #0001;display:flex;flex-direction:column;gap:4px}
.legend-card.sel{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.legend-card .lc-top{display:flex;align-items:center;gap:10px}
.legend-card .lc-ico{font-size:40px;width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,#fff)}
.legend-card .lc-name{font-family:'Kanit',sans-serif;font-weight:600;font-size:20px}
.legend-card .lc-origin{font-size:13px;color:var(--muted)}
.legend-card .lc-skill{font-weight:600;color:var(--c);margin-top:4px}
.legend-card .lc-desc{font-size:14px}
.legend-card .lc-weak{font-weight:600;color:#8a3a1c;margin-top:2px}
.setup-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin:18px 0 10px}
.seg{display:inline-flex;background:#e6d6b4;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--dark);color:#fff4dd}
.title-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Game layout */
#game{flex-direction:column;height:100%}
#topbar{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--dark);color:#fff4dd;flex-wrap:wrap}
#topbar .spacer{flex:1}
#tbFaction{font-family:'Kanit',sans-serif;font-weight:600}
.pill{background:#ffffff1c;border-radius:99px;padding:2px 10px;white-space:nowrap}
.icon-btn{background:#ffffff1c;border:0;border-radius:8px;width:38px;height:34px;cursor:pointer;font-size:17px}
#scorebar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#e2d3b1;flex-wrap:wrap}
#chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{border-radius:99px;padding:2px 10px;background:#fff8;border:2px solid var(--c);font-size:14px;white-space:nowrap}
.chip.dead{opacity:.45;text-decoration:line-through}
.chip.cur{background:var(--c);color:#fff}
.chip.homeless{border-style:dashed}
.pill.homeless{background:#b5452b}
.pill.homeless.urgent{background:#e0301e;animation:glow 1s ease-in-out infinite}
#main{display:flex;flex-direction:column;flex:1;min-height:0}
#board{position:relative;width:100%;aspect-ratio:1/1;max-height:68vh;margin:0 auto;background:var(--sea)}
#map{width:100%;height:100%;display:block;touch-action:manipulation;user-select:none}
.map-btns{position:absolute;right:8px;bottom:8px;display:none;flex-direction:column;gap:6px}
#board.zoomable .map-btns{display:flex}
#board.zoomable #map{touch-action:none;cursor:grab}
.map-btn{width:40px;height:40px;border:0;border-radius:10px;background:#fffaf0e6;box-shadow:0 1px 4px #0003;font-size:20px;cursor:pointer}
#phaseBanner{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#3b2a1de6;color:#fff4dd;padding:4px 14px;border-radius:99px;font-size:14px;pointer-events:none;white-space:nowrap}
#panel{padding:12px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
@media (min-width:900px){
  #main{flex-direction:row}
  #board{flex:1;aspect-ratio:auto;max-height:none;height:100%}
  #panel{width:390px;flex:none;overflow-y:auto;border-left:2px solid var(--line)}
}
.card{background:var(--panel);border-radius:12px;padding:12px;box-shadow:0 1px 4px #0001}
.card h3{font-size:16px;margin-bottom:6px}
.hint{color:var(--muted)}
.node-card{border-left:6px solid var(--c)}
.nc-head{display:flex;gap:10px;align-items:center}
.nc-ico{font-size:34px}
.nc-name{font-family:'Kanit',sans-serif;font-weight:600;font-size:19px}
.nc-sub{font-size:14px;color:var(--muted)}
.nc-terrain{font-size:14px;margin:6px 0;padding:4px 8px;background:#f1e7d2;border-radius:8px}
.army-box{margin-top:8px;padding:8px;border-radius:8px;background:color-mix(in srgb,var(--c) 12%,#fff)}
.u{display:inline-block;margin-right:8px;white-space:nowrap}
.act-title{margin-top:10px;font-weight:600;font-size:14px}
.act-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.btn.unit{padding:8px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.2;font-size:14px}
.btn.unit .ui{font-size:22px}
.btn.unit small{font-family:'Sarabun',sans-serif;font-weight:400}
.warn{background:#fdecdc;border:2px solid #e3a46a;color:#7a3b12;border-radius:8px;padding:6px 10px;font-size:14px}
.act-col{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.army-list{display:flex;flex-direction:column;gap:6px}
.army-item{display:flex;align-items:center;gap:8px;text-align:left;background:#f4ead6;border:2px solid transparent;border-radius:10px;padding:6px 10px;cursor:pointer}
.army-item.sel{border-color:var(--accent)}
.army-item .ai-ico{font-size:22px}
.army-item .ai-main{flex:1}
#log{margin:0;padding:0;list-style:none;font-size:14px;max-height:220px;overflow-y:auto}
#log li{margin-bottom:2px;padding-left:12px}
#log li.t{color:var(--muted);font-weight:600;padding-left:0;margin-top:4px}
@media (max-width:600px){
  #topbar{gap:6px;padding:6px 8px;flex-wrap:nowrap;font-size:14px}
  .pill{padding:2px 7px}
  .icon-btn{width:32px;height:30px;font-size:15px}
  #topbar:has(#tbHomeless:not(.hidden)){flex-wrap:wrap}
  #tbHomeless{order:10;flex-basis:100%;text-align:center}
  .nname{font-size:32px!important;stroke-width:7px!important}
  .badge-t{font-size:27px!important}
  .gar-t{font-size:24px!important}
}

/* SVG map */
.edge{stroke:#8a7556;stroke-width:9;stroke-linecap:round;opacity:.75}
.edge.mtn{stroke:#6b4a2b;stroke-width:12;stroke-dasharray:4 20;opacity:.9}
.edge-ico{font-size:30px}
.mv-arrow{stroke-width:7;fill:none;stroke-dasharray:16 10;opacity:.85}
.node{cursor:pointer}
.node text{text-anchor:middle;dominant-baseline:central;pointer-events:none}
.nname{font-family:'Kanit','Leelawadee UI',sans-serif;font-size:25px;font-weight:600;fill:#2b2118;paint-order:stroke;stroke:#fffaf0;stroke-width:6px}
.ticon{font-size:36px}
.capico{font-size:34px}
.badge-t{font-family:'Kanit',sans-serif;font-size:23px;font-weight:600;fill:#fff}
.gar-t{font-family:'Kanit',sans-serif;font-size:20px;font-weight:600;fill:#2b2118}
.tgt{fill:none;stroke-width:7;animation:pulse 1.1s ease-in-out infinite}
.tgt.mv{stroke:#2f9d5a}
.tgt.atk{stroke:#d1382b}
.selring{fill:none;stroke:#2b2118;stroke-width:5;stroke-dasharray:14 8}
.ready{animation:glow 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}

/* Overlays */
.overlay{position:fixed;inset:0;background:#1b120bb3;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--panel);border-radius:16px;padding:16px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 10px 40px #0006}
.modal h2{font-size:22px;text-align:center;margin-bottom:6px}
.bt-place{text-align:center;font-size:14px;color:var(--muted);margin-bottom:10px}
.bt-sides{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.side{border:3px solid var(--c);border-radius:12px;padding:8px;text-align:center;background:color-mix(in srgb,var(--c) 10%,#fff)}
.side-lbl{font-size:12px;color:var(--muted)}
.side-ico{font-size:36px;line-height:1.2}
.side-name{font-family:'Kanit',sans-serif;font-weight:600}
.side-gen{font-size:13px}
.side-units{font-size:14px;margin-top:4px}
.side-total{font-size:13px;color:var(--muted)}
.vs{font-family:'Kanit',sans-serif;font-weight:600;font-size:22px;color:var(--accent)}
.bt-est{text-align:center;margin:10px 0 4px}
.reveal{background:#e3f3e7;border:2px dashed #2f7d4f;border-radius:10px;padding:8px;text-align:center;margin:8px 0}
.strats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.btn.strat{display:flex;flex-direction:column;align-items:center;padding:10px 4px;line-height:1.25}
.btn.strat .si{font-size:28px}
.btn.strat small{font-family:'Sarabun',sans-serif;font-weight:400;font-size:12px;color:var(--muted)}
.strat-help{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.cancel-row{text-align:center;margin-top:10px}
.arena{position:relative;height:110px;margin:12px 0;overflow:hidden;border-radius:12px;background:linear-gradient(#f6ecd6,#e3d2ad)}
.arena .fx{position:absolute;top:22px;font-size:54px;line-height:1}
.arena .fa{left:6%;animation:goL 1.6s ease-in-out forwards}
.arena .fb{right:6%;animation:goR 1.6s ease-in-out forwards}
.arena .boom{position:absolute;left:50%;top:18px;font-size:64px;line-height:1;transform:translateX(-50%) scale(0);animation:boom 1.6s ease-out forwards}
@keyframes goL{0%{left:6%}40%{left:36%}48%{left:32%;transform:rotate(-14deg)}58%{left:37%;transform:rotate(8deg)}70%{left:33%;transform:rotate(0)}100%{left:30%}}
@keyframes goR{0%{right:6%}40%{right:36%}48%{right:32%;transform:rotate(14deg)}58%{right:37%;transform:rotate(-8deg)}70%{right:33%;transform:rotate(0)}100%{right:30%}}
@keyframes boom{0%,36%{transform:translateX(-50%) scale(0);opacity:0}46%{transform:translateX(-50%) scale(1.5);opacity:1}75%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) scale(.9);opacity:0}}
.strat-line{text-align:center;margin:6px 0}
.res-title.win{color:var(--win)} .res-title.lose{color:var(--lose)}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.res-side{border-radius:10px;padding:8px;background:color-mix(in srgb,var(--c) 10%,#fff);border:2px solid var(--c);font-size:14px}
.res-side .pw{font-family:'Kanit',sans-serif;font-size:20px;font-weight:600}
.res-side ul{margin:4px 0;padding-left:18px}
.outcome{margin:6px 0 12px;padding-left:20px}
.center{text-align:center}
.help h3{margin-top:12px}
.help ul{margin:4px 0;padding-left:20px}
.end-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.end-stats div{background:#f1e7d2;border-radius:8px;padding:6px 10px}
/* Tutorial coach */
#coach{position:absolute;z-index:70;width:270px;max-width:calc(100vw - 16px);background:#2b2118;color:#fff4dd;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.45;box-shadow:0 6px 20px #0007}
#coach .c-step{font-size:12px;color:#e8c98a;font-family:'Kanit',sans-serif}
#coach .c-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
#coach .c-btns button{border:0;border-radius:8px;padding:4px 12px;cursor:pointer;background:#ffffff26;color:inherit;font-size:14px}
#coach .c-btns .go{background:var(--accent)}
#coachArrow{position:absolute;z-index:70;font-size:42px;line-height:1;pointer-events:none;filter:drop-shadow(0 2px 3px #0009)}
#coachArrow.down{animation:bobD .7s ease-in-out infinite alternate}
#coachArrow.up{animation:bobU .7s ease-in-out infinite alternate}
@keyframes bobD{from{transform:translate(-50%,-100%)}to{transform:translate(-50%,-80%)}}
@keyframes bobU{from{transform:translate(-50%,0)}to{transform:translate(-50%,-20%)}}
.tgt.tut{stroke-width:11}
.opt{display:flex;gap:8px;align-items:center;cursor:pointer}
.opt input{width:18px;height:18px}
.seg button:disabled{opacity:.5;cursor:not-allowed}
.lvl-info{max-width:600px;text-align:center;font-size:14px;color:var(--muted);margin:0 0 14px}
.ret-row{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.btn.ret{text-align:left;font-family:'Sarabun',sans-serif;font-weight:400;font-size:14px;line-height:1.4;padding:8px 12px}
.btn.ret b{font-family:'Kanit',sans-serif;font-weight:600;font-size:15px}
.btn.ret.safe{background:#e2f1e6}
.btn.ret.break{background:#fbe6dc}
.ret-note{font-size:13px;color:var(--muted);text-align:center;margin-top:4px}
.leg{margin-top:6px;padding:6px 8px;border-radius:8px;background:#fff6dc;border:2px solid #e2b84a;font-size:13px;line-height:1.4;text-align:left}
.leg .lg-h{font-family:'Kanit',sans-serif;font-weight:600;font-size:14px}
.leg .lg-w{color:#8a3a1c}
.leg .lg-x{color:#7a5a12}
.side .leg{font-size:12px;padding:4px 6px}
.leg-list{display:flex;flex-direction:column;gap:6px}
.leg-item{display:flex;gap:8px;align-items:flex-start;text-align:left;background:#fff6dc;border:2px solid transparent;border-radius:10px;padding:6px 8px;cursor:pointer;font-size:13px;line-height:1.35}
.leg-item:hover{border-color:#e2b84a}
.leg-item .li-ico{font-size:22px;line-height:1.2}
.leg-item.off{opacity:.55;cursor:default}
.dis-row{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.chip.blood{border-color:#9b1c1c;background:#fbe4e4;color:#7a1010;font-weight:600;letter-spacing:.5px}
.chip.blood.full{background:#9b1c1c;color:#fff}
.boss-card{border-left:6px solid #9b1c1c}
.boss-head{display:flex;gap:10px;align-items:center}
.gauge{display:flex;gap:4px;margin:6px 0}
.gauge i{flex:1;height:12px;border-radius:4px;background:#ead2d2;border:1px solid #c99}
.gauge i.on{background:#b3201f;border-color:#7a1010}
.boss-weak li.on{color:#2f7d4f;font-weight:600}
.boss-btn{background:#9b1c1c;color:#fff}
.cine{opacity:0;animation:cine 1.4s ease forwards;font-size:17px;line-height:1.8;text-align:center;margin:10px 0}
.cine-end{opacity:0;animation:cine 1s ease forwards}
@keyframes cine{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ending{background:#1b120b;color:#f3e3c3;border-radius:12px;padding:16px}
/* การกระทำของฝ่ายอื่นบนแผนที่ */
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#fx text,#map .ghost text,#map .tag-g text{text-anchor:middle;dominant-baseline:central;pointer-events:none}
#map .ghost,#map .rp,#map .rp-arrow,#map .rp-atk{pointer-events:none}
.gh-ico,.fx-ico{font-size:24px}
.tag-g text{font-family:'Kanit','Leelawadee UI',sans-serif;font-weight:600}
.rp-ring{fill:none;stroke-width:9}
.rp-ring.on{stroke-width:14}
.fx-boom{font-size:86px;transform-box:fill-box;transform-origin:center;animation:fxBoom .9s ease-out forwards}
@keyframes fxBoom{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.25);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}
.fx-float{font-family:'Kanit',sans-serif;font-size:36px;font-weight:600;paint-order:stroke;stroke:#fffaf0;stroke-width:8px;animation:fxFloat 1.3s ease-out forwards}
@keyframes fxFloat{0%{transform:translateY(10px);opacity:0}15%{opacity:1}75%{opacity:1}100%{transform:translateY(-75px);opacity:0}}
.fx-flash{fill:none;stroke-width:15;animation:fxFlash .16s ease-in-out 6 alternate}
@keyframes fxFlash{from{opacity:1}to{opacity:.12}}
.fx-pop{transform-box:fill-box;transform-origin:center;animation:fxPop 1.2s ease-out forwards}
@keyframes fxPop{0%{transform:scale(.3);opacity:0}20%{transform:scale(1.15);opacity:1}80%{transform:scale(1);opacity:1}100%{transform:translateY(-24px);opacity:0}}
.btn.fx-btn{padding:8px 10px;font-size:14px;background:#efe2c4}
.btn.fx-btn small{font-size:13px}
.sb-gap{display:none}
.ghost-key{font-size:13px;background:#f1e7d2;border-radius:8px;padding:6px 8px;margin-bottom:6px;line-height:1.6}
.gk{display:inline-block;border-radius:99px;padding:0 4px;color:#fff}
.gk-win{background:#2f7d4f} .gk-lose{background:#b03a2e}
/* เลือกปลายทางถอนทัพบนแผนที่: หน้าต่างรบย่อเป็นแถบเล็กด้านล่าง */
#battle.mini{background:transparent;pointer-events:none;align-items:flex-end;padding:8px}
#battle.mini .modal{pointer-events:auto;max-height:36vh;padding:10px 12px;border:3px solid #e8862a;box-shadow:0 4px 22px #0006}
.rp-head{font-size:14px;line-height:1.5}
.rp-key i{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 3px 0 8px;vertical-align:-1px}
.rp-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.rp-chip{border:2px solid #2f9d5a;background:#e2f1e6;border-radius:99px;padding:3px 10px;font-size:14px;cursor:pointer}
.rp-chip.break{border-color:#e8862a;background:#fbe6dc}
.rp-chip.on{box-shadow:0 0 0 3px #2b2118;font-weight:600}
.rp-info{font-size:14px;background:#f6efe0;border-radius:8px;padding:6px 8px;line-height:1.45}
.rp-btns{display:flex;gap:8px;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
@media (max-width:600px){
  .gh-ico,.fx-ico{font-size:28px}
  #chips{flex-basis:100%}
  .sb-gap{display:block;flex:1}
  .fx-btn .lbl{display:none}
  #scorebar .btn{padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){.tgt,.ready,#coachArrow,.fx-flash{animation:none!important}}
</style>
</head>
<body>

<!-- ===================== SCREENS ===================== -->
<div id="title" class="screen active">
  <div class="logo">
    <h1>⚔️ Wars of Ares</h1>
    <p class="tagline">ศึกตำนานข้ามกาล</p>
    <p>เลือกจอมทัพ พิชิตดินแดน ล้มศัตรูให้ครบทุกฝ่ายก่อนหมดเทิร์น</p>

// RNG แบบมี seed (mulberry32) — สถานะ seed อยู่ใน S จึงเซฟ/โหลดต่อได้
function rng() {
  let t = (S.seed = (S.seed + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const randInt = (a, b) => a + Math.floor(rng() * (b - a + 1));
const pick = arr => arr[Math.floor(rng() * arr.length)];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function weighted(pairs) {
  let tot = 0; for (const p of pairs) tot += p[1];
  let r = rng() * tot;
  for (const p of pairs) { r -= p[1]; if (r < 0) return p[0]; }
  return pairs[pairs.length - 1][0];
}
const Z = () => ({ inf: 0, cav: 0, arc: 0 });
const sumU = u => u.inf + u.cav + u.arc;
const addU = (a, b) => ({ inf: a.inf + b.inf, cav: a.cav + b.cav, arc: a.arc + b.arc });

const skill = (f, k) => f >= 0 && !!legendOf(f).skill[k];
// สกิลจอมทัพของทัพนี้: ของฝ่าย + ของจอมทัพหุ่นเชิดที่ถูกปลดปล่อยมานำทัพ (gen.lid)
const askv = (f, g, k) => (g && g.lid && LEG(g.lid).skill[k] != null) ? LEG(g.lid).skill[k] : (f >= 0 ? legendOf(f).skill[k] : undefined);
const askill = (f, g, k) => !!askv(f, g, k);
const maxArmies = f => (f >= 0 && legendOf(f).skill.armies) || MAX_ARMIES;
// โหมดศึกชิงอิสรภาพ: ทุกฝ่ายที่ไม่ใช่ผู้เล่นเป็นพวกเดียวกัน (Ares + หุ่นเชิด) ไม่รบกันเอง
const isBoss = () => !!(S && S.boss);
const allied = (f, g) => isBoss() && f > 0 && g > 0 && f !== g;
const hostile = (f, g) => g !== f && !allied(f, g);
const isAres = f => isBoss() && f === S.boss.ares;
// บุคคลในประวัติศาสตร์จริง (บาดเจ็บจากมนุษย์): จอมทัพ / จอมทัพที่ถูกปลดปล่อย / ตำนานพเนจร — แม่ทัพธรรมดาไม่นับ
const historical = (g, f) => !!g && (g.lid ? LEG(g.lid).hist : g.wid ? WMAP[g.wid].hist : g.leader ? legendOf(f).hist : false);
const armyAt = n => S.armies.find(a => a.node === n);
const armyById = id => S.armies.find(a => a.id === id);
const facName = f => f === NEUTRAL ? 'กองกำลังท้องถิ่น' : legendOf(f).name;
const facIcon = f => f === NEUTRAL ? '🏳️' : legendOf(f).icon;
const facColor = f => f === NEUTRAL ? '#8d8d8d' : S.factions[f].color;

function log(text) {

}

function newArmy(f, node, gen, units) {
  const a = { id: S.nextId++, fac: f, node, gen, units, used: 0 };
  S.armies.push(a);

// opts.boss = โหมดศึกชิงอิสรภาพ (แผนที่ใหญ่ AI ระดับตำนาน หุ่นเชิด 2–3 ฝ่าย + Ares) / opts.troy = ปลดล็อกอากาเม็มนอนและชุดสงครามทรอยแล้ว
function newGame(legendId, numAI, seed, level = 1, size = 's', opts = {}) {
  if (opts.boss) { level = LEVELS.length - 1; size = 'l'; }
  const SZ = MAP_SIZES[size] || MAP_SIZES.s;
  S = {
    size, maxTurns: SZ.turns, troy: !!opts.troy, bossSetup: !!opts.boss,
    level, undoLeft: LEVELS[level].undo, noRetreat: [],
    stratHist: { atk: { charge: 0, ambush: 0, defend: 0 }, def: { charge: 0, ambush: 0, defend: 0 } },
    rstats: { retreat: 0, breakWin: 0, breakLose: 0, coord: 0, capStrike: 0, focus: 0 },
    v: SAVE_VERSION, seed: seed == null ? ((Date.now() ^ (Math.random() * 1e9)) | 0) : seed,
    turn: 1, phase: 'player', current: 0, factions: [], nodes: [], edges: [], armies: [],
    log: [], nextId: 1, over: null, lastMove: null, genNames: [],
    stats: { battles: 0, won: 0, captured: 0 },
    grudge: {}, tstats: { onP: 0, onAI: 0, bP: 0, bAI: 0 },
    ...wanderFields(),
  };
  const me = LEGENDS.find(l => l.id === legendId);
  if (opts.boss) numAI = randInt(2, 3);
  // หุ่นเชิดต้องมีเมืองหลวงให้ปลดปล่อย จึงไม่ใช้จอมทัพที่ไร้แผ่นดินโดยกำเนิด
  const others = shuffle(LEGENDS.filter(l => l.id !== legendId && (!l.locked || S.troy) && !(opts.boss && l.landless))).slice(0, numAI);
  if (opts.boss) others.push(ARES);
  S.factions = [me, ...others].map((l, i) => ({ id: i, legend: l.id, human: i === 0, gold: START_GOLD, capital: -1, alive: true, color: l.color }));
  S.genNames = shuffle(GENERAL_NAMES);
  genMap(randInt(SZ.nodes[0], SZ.nodes[1]), S.factions.length, SZ.mtn);
  for (const f of S.factions) {
    const L = legendOf(f.id), n = S.nodes[f.capital];
    f.start = f.capital; f.homeless = null;
    n.owner = f.id; n.terrain = 'plain'; n.name = L.capitalName;
    if (L.landless) {
      // ไร้แผ่นดินโดยกำเนิด: ยืนบนดินแดนเริ่มต้นที่ไม่ใช่เมืองหลวง ไม่นับถอยหลัง
      n.garrison = Z(); f.capital = null; f.homeless = { left: null, fresh: false };
    } else { n.capitalOf = f.id; n.garrison = { inf: 5, cav: 0, arc: 5 }; }
    newArmy(f.id, f.start, { name: L.name, icon: L.icon, leader: true }, { ...L.start });
  }
  if (opts.boss) {
    const ares = S.factions.length - 1;
    S.boss = { ares, throne: fac(ares).capital, gauge: 0, rage: 0, siege: 0, jar: false, pending: false, spLine: false,
      power: { rage: 0, puppet: 0 }, weak: { athena: 0, net: 0, jar: 0, mortal: 0 }, freed: 0, throneTaken: 0 };
  }
  delete S.bossSetup;
  // ตำนานพเนจรมีตั้งแต่ระดับแม่ทัพขึ้นไป (นายกองเล่นแบบไม่มีตำนานพเนจร)
  if (!TUNE.nowander && level >= 1) placeWanderers();
  const inc = startFactionTurn(0);
  log(`${me.name} เริ่มศึกที่ ${S.nodes[fac(0).start].name}! ศัตรู: ${others.map(o => o.name).join(', ')}`);
  log(`— เทิร์น 1: รับรายได้ ${inc} 💰 —`);
}

// สถานะตำนานพเนจร: wild = อยู่บนแผนที่ (ดินแดนกลาง), resting = หายไปพัก, wgone = หายไปถาวร,
// joins = คิวตำนานที่รอเข้าฝ่าย (จัดการหลังจบการเดินทัพแต่ละครั้ง), wflags = สกิลที่ใช้ไปแล้ว
function wanderFields() {
  return { wInGame: [], wild: [], resting: [], wgone: [], joins: [], wflags: {},
    wstats: { wild: 0, captured: 0, capLead: 0, fled: 0, rest: 0, gone: 0, revive: 0, desert: 0, dismiss: 0 } };
}

// วางตำนาน 2–3 ตัวบนดินแดนกลาง โดยเลือกจุดที่ระยะจากเมืองหลวงทุกฝ่ายใกล้เคียงกันที่สุด (ยุติธรรมทุกฝ่าย)
function placeWanderers() {
  let pool = shuffle(WANDERERS.filter(w => (!w.set || S.troy) && w.id !== SIMOPT.give).map(w => w.id));
  const wz = (MAP_SIZES[S.size] || MAP_SIZES.s).wander;
  const k = Math.min(pool.length, randInt(wz[0], wz[1]));
  const caps = S.factions.map(f => bfs(f.start, NEUTRAL, () => true).dist);
  const cand = S.nodes.filter(n => n.owner === NEUTRAL).map(n => {
    const ds = caps.map(d => d[n.id] == null ? 99 : d[n.id]);
    return { id: n.id, near: Math.min(...ds), spread: Math.max(...ds) - Math.min(...ds) + rng() * 0.9 };
  }).sort((a, b) => a.spread - b.spread);
  // รอบแรก: ไม่ติดเมืองหลวงและไม่วางติดกัน — ถ้าไม่พอค่อยผ่อนเงื่อนไข
  const used = [];
  for (const strict of [true, false]) for (const c of cand) {
    if (used.length >= k || used.includes(c.id)) continue;
    if (strict && (c.near < 2 || used.some(u => adjacent(u, c.id)))) continue;
    if (c.near < 1) continue;
    used.push(c.id);
  }
  const picked = pool.slice(0, used.length);
  // ปาโตรคลัสมาพร้อมอคิลลิสเสมอ (ไม่นับโควตา)
  if (picked.includes('patroclus') && !picked.includes('achilles') && SIMOPT.give !== 'achilles') {
    const extra = cand.find(c => !used.includes(c.id) && c.near >= 1);
    if (extra) { used.push(extra.id); picked.push('achilles'); }
  }
  used.forEach((node, i) => { if (picked[i]) { S.wInGame.push(picked[i]); putWild(picked[i], node); } });
}
function putWild(wid, node) {
  const g = S.nodes[node].garrison;
  for (let i = 0; i < WANDER_GUARD; i++) g[pick(UNIT_TYPES)]++;
  S.wild.push({ wid, node });
}
const wildAt = nodeId => S.wild.find(w => w.node === nodeId);

/* ---------- Map generation ---------- */
function segCross(p1, p2, p3, p4) {
  const o = (a, b, c) => Math.sign((b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x));
  return o(p1, p2, p3) * o(p1, p2, p4) < 0 && o(p3, p4, p1) * o(p3, p4, p2) < 0;
}
function segDist(q, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const t = Math.max(0, Math.min(1, ((q.x - a.x) * dx + (q.y - a.y) * dy) / (dx * dx + dy * dy)));
  return Math.hypot(q.x - (a.x + t * dx), q.y - (a.y + t * dy));
}

function genMap(n, k, mtn = [2, 3]) {
  for (let attempt = 0; attempt < 80; attempt++) {
    if (tryGenMap(n, k, attempt < 40 && k <= 3 ? 3 : 2, mtn)) return;
  }
  throw new Error('สร้างแผนที่ไม่สำเร็จ');
}

function tryGenMap(n, k, needCapDist, mtn) {
  // แผนที่ใหญ่ขึ้น = พื้นที่ใหญ่ขึ้น (ระยะห่างระหว่างดินแดนเท่าเดิม)
  const M = 95, W = Math.round(1000 * Math.max(1, Math.sqrt(n / 13.5)));
  let pts, minD = 215;
  for (;;) {
    pts = []; let tries = 0;
    while (pts.length < n && tries < 4000) {
      tries++;
      const p = { x: M + rng() * (W - 2 * M), y: M + rng() * (W - 2 * M) };
      if (pts.every(q => Math.hypot(p.x - q.x, p.y - q.y) >= minD)) pts.push(p);
    }
    if (pts.length === n) break;
    minD *= 0.96;
  }
  // MST (ต่อกันครบทุกจุด) + เส้นเสริมที่ไม่ตัดกัน
  const pairs = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) pairs.push({ a: i, b: j, d: Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y) });
  pairs.sort((p, q) => p.d - q.d);
  const parent = [...Array(n).keys()];
  const find = x => parent[x] === x ? x : (parent[x] = find(parent[x]));
  const edges = [], deg = Array(n).fill(0);
  const tooClose = (a, b) => pts.some((q, i) => i !== a && i !== b && segDist(q, pts[a], pts[b]) < 70);
  for (const p of pairs) {
    const ra = find(p.a), rb = find(p.b);
    if (ra !== rb) {
      if (tooClose(p.a, p.b)) return false;
      parent[ra] = rb; edges.push({ a: p.a, b: p.b, tree: true, mountain: false }); deg[p.a]++; deg[p.b]++;
    }
  }
  for (const p of pairs) {
    if (p.d > minD * 1.85) break;
    if (edges.some(e => e.a === p.a && e.b === p.b)) continue;
    if (deg[p.a] >= 4 || deg[p.b] >= 4) continue;
    if (edges.some(e => e.a !== p.a && e.a !== p.b && e.b !== p.a && e.b !== p.b && segCross(pts[p.a], pts[p.b], pts[e.a], pts[e.b]))) continue;
    if (tooClose(p.a, p.b)) continue;
    edges.push({ a: p.a, b: p.b, tree: false, mountain: false }); deg[p.a]++; deg[p.b]++;
  }
  // เทือกเขาปิดกั้น (เฉพาะเส้นเสริม จึงไม่ทำให้แผนที่ขาดจากกัน)
  const extra = shuffle(edges.filter(e => !e.tree));
  const mcount = Math.min(extra.length, randInt(mtn[0], mtn[1]));
  for (let i = 0; i < mcount; i++) extra[i].mountain = true;

  S.nodes = pts.map((p, i) => ({ id: i, x: Math.round(p.x), y: Math.round(p.y), terrain: 'plain', owner: NEUTRAL, capitalOf: null, garrison: Z(), name: '' }));
  S.edges = edges.map(e => ({ a: e.a, b: e.b, mountain: e.mountain }));

  // เมืองหลวง: เลือกให้ห่างกันมากที่สุด
  const D = S.nodes.map(nd => bfs(nd.id, NEUTRAL, () => true).dist);
  if (Object.keys(D[0]).length !== n) return false;
  if (S.bossSetup) {
    // ศึกชิงอิสรภาพ: บัลลังก์แห่ง Ares กลางแผนที่ ล้อมด้วยเมืองหลวงหุ่นเชิด ผู้เล่นเริ่มที่ขอบ
    const cx = pts.reduce((t, p) => t + p.x, 0) / n, cy = pts.reduce((t, p) => t + p.y, 0) / n;
    const order = [...Array(n).keys()].sort((a, b) => Math.hypot(pts[a].x - cx, pts[a].y - cy) - Math.hypot(pts[b].x - cx, pts[b].y - cy));
    const throne = order.find(i => S.edges.filter(e => !e.mountain && (e.a === i || e.b === i)).length >= 3);
    if (throne == null) return false;
    const Dt = D[throne], P = k - 2;
    const ring = shuffle([...Array(n).keys()].filter(i => Dt[i] === 2 && deg[i] >= 2));
    const puppets = [];
    for (const i of ring) if (puppets.length < P && puppets.every(j => D[i][j] >= 2)) puppets.push(i);
    if (puppets.length < P) return false;
    const far = [...Array(n).keys()].filter(i => deg[i] >= 2 && !puppets.includes(i) && i !== throne).sort((a, b) => Dt[b] - Dt[a] || rng() - 0.5)[0];
    if (far == null || Dt[far] < 4 || puppets.some(j => D[far][j] < 3)) return false;
    S.factions[0].capital = far;
    puppets.forEach((c, i) => { S.factions[i + 1].capital = c; });
    S.factions[k - 1].capital = throne;
  } else {
  const caps = [randInt(0, n - 1)];
  while (caps.length < k) {
    let best = -1, bd = -1;
    for (let i = 0; i < n; i++) {
      if (caps.includes(i)) continue;
      const d = Math.min(...caps.map(c => D[c][i])) + rng() * 0.5;
      if (d > bd) { bd = d; best = i; }
    }
    caps.push(best);
  }
  for (let i = 0; i < k; i++) for (let j = i + 1; j < k; j++) if (D[caps[i]][caps[j]] < needCapDist) return false;
  if (caps.some(c => deg[c] < 2)) return false;
  shuffle(caps).forEach((c, i) => { S.factions[i].capital = c; });
  }

  // ภูมิประเทศ ชื่อ และกองกำลังท้องถิ่น
  const pools = {};
  for (const t in NAME_POOLS) pools[t] = shuffle(NAME_POOLS[t]);
  for (const nd of S.nodes) {
    nd.terrain = weighted(TERRAIN_WEIGHTS);
    nd.name = pools[nd.terrain].pop() || `${TERRAINS[nd.terrain].name} ${nd.id + 1}`;
    let g = randInt(4, 9) + (nd.terrain === 'mountain' ? 2 : 0);
    while (g-- > 0) nd.garrison[pick(UNIT_TYPES)]++;
  }
  return true;
}

/* =====================================================================
   LOGIC — กติกา การเดินทัพ การปะทะ
   ===================================================================== */
function neighbors(id) {
  const r = [];
  for (const e of S.edges) {
    if (e.a === id) r.push({ id: e.b, mountain: e.mountain });
    else if (e.b === id) r.push({ id: e.a, mountain: e.mountain });
  }
  return r;
}
const passable = (f, nb) => !nb.mountain || skill(f, 'crossMountain');
const adjacent = (u, v) => neighbors(u).some(nb => nb.id === v);
const fweak = f => f >= 0 ? legendOf(f).weak : {};
// เมืองหลวงปัจจุบันของฝ่ายใดฝ่ายหนึ่ง (เมืองหลวงย้ายได้ จึงไม่ใช้ capitalOf ซึ่งเป็นแค่เครื่องหมายว่าเคยเป็นเมืองหลวง)
const isSeat = n => n.owner >= 0 && fac(n.owner).alive && fac(n.owner).capital === n.id;
const leaderArmy = f => S.armies.find(a => a.fac === f && a.gen.leader);
const homeNode = f => fac(f).capital != null ? fac(f).capital : (leaderArmy(f) ? leaderArmy(f).node : fac(f).start);
const mountainEdge = (u, v) => S.edges.some(e => e.mountain && ((e.a === u && e.b === v) || (e.a === v && e.b === u)));
// ราคาของแอลป์ (ฮันนิบาล): สัดส่วนทหารที่เสียถ้าทัพ a ข้ามจาก u ไป v
const alpsFrac = (a, u, v) => (fweak(a.fac).alpsToll && mountainEdge(u, v)) ? fweak(a.fac).alpsToll : 0;
function payAlps(a, u, v) {
  const fr = alpsFrac(a, u, v);
  if (!fr) return Z();
  const lost = applyLoss(a.units, fr);
  if (sumU(lost)) log(`🏔️ ราคาของแอลป์: ${a.gen.name} ข้ามเทือกเขา เสียทหาร ${sumU(lost)} นาย`);
  return lost;
}
const scaleU = (u, k) => { const r = Z(); for (const t of UNIT_TYPES) r[t] = u[t] - Math.min(u[t], Math.round(u[t] * k)); return r; };

/* ---------- ตำนานพเนจร: ความภักดี สกิล จุดอ่อน ---------- */
const baseLoyal = g => !g.loyalAt || S.turn >= g.loyalAt;
// ฝ่ายนี้มีเล่าปี่ (ที่ภักดีแล้ว) อยู่ไหม
const benevolent = f => S.armies.some(a => a.fac === f && a.gen.wid && WMAP[a.gen.wid].skill.benevolence && baseLoyal(a.gen));
const selfBenevolent = g => !!(g.wid && WMAP[g.wid].skill.benevolence);
// ตำนานที่ถูกจับ: 3 เทิร์นแรกยังไม่ภักดี (ยกเว้นฝ่ายที่จับมีเล่าปี่ — แต่เล่าปี่เองที่ถูกจับโดนกฎปกติ)
// อากาเม็มนอน (ราชาผู้โลภ): ตำนานต้องผ่านช่วงไม่ภักดีเสมอ แม้มีเล่าปี่
const isLoyal = (g, f) => !g.wid || baseLoyal(g) || (!fweak(f).greedy && !selfBenevolent(g) && benevolent(f));
const loyalLeft = g => Math.max(0, (g.loyalAt || 0) - S.turn);
// สกิลที่ใช้ได้ตอนนี้ / จุดอ่อน (มีผลเสมอ)
const wsk = (g, f) => (g && g.wid && isLoyal(g, f)) ? WMAP[g.wid].skill : {};
const wwk = g => (g && g.wid) ? WMAP[g.wid].weak : {};
// ตำนานที่ถูกจับ รบกับเจ้าของเก่าโดนโทษ (ไม่โดนถ้าฝ่ายนี้มีเล่าปี่ ยกเว้นตัวเล่าปี่เอง)
const traitorPenalty = (g, f, foe) => !!(g && g.wid && g.from != null && g.from === foe && !(benevolent(f) && !selfBenevolent(g)));
const passableA = (a, nb) => !nb.mountain || askill(a.fac, a.gen, 'crossMountain') || !!wsk(a.gen, a.fac).crossMountain;

// BFS: canEnter(v) บอกว่าขยายต่อจากโหนดนั้นได้ไหม (โหนดปลายทางยังได้ dist)
function bfs(start, f, canEnter) {
  const dist = { [start]: 0 }, prev = {};
  const q = [start];
  while (q.length) {
    const u = q.shift();
    for (const nb of neighbors(u)) {
      if (!passable(f, nb) || nb.id in dist) continue;
      dist[nb.id] = dist[u] + 1; prev[nb.id] = u;
      if (canEnter(nb.id)) q.push(nb.id);
    }
  }
  return { dist, prev };
}
function pathTo(prev, s, g) {
  const p = [g];
  while (p[0] !== s) { const u = prev[p[0]]; if (u == null) return null; p.unshift(u); }
  return p;
}

function nodeIncome(n) { return TERRAINS[n.terrain].income + (n.capitalOf !== null ? CAPITAL_BONUS : 0); }
function income(f) { return S.nodes.filter(n => n.owner === f).reduce((s, n) => s + nodeIncome(n), 0); }
function startFactionTurn(f) {
  const inc = income(f);
  fac(f).gold += inc;
  for (const a of S.armies) if (a.fac === f) {
    a.used = 0;
    const free = wsk(a.gen, f).freeInf;
    if (free) { a.units.inf += free; if (isHumanFac(f)) log(`🪄 ${a.gen.name} เสกหุ่นพยนต์ ได้ทหารราบ ${free} นาย`); }
  }
  return inc;
}

function maxMoves(a) {
  if (wsk(a.gen, a.fac).moves2) return 2;
  return (askill(a.fac, a.gen, 'cavRush') && a.units.cav > 0 && a.units.cav * 2 >= sumU(a.units)) ? 2 : 1;
}
const canMove = a => a.used < maxMoves(a) && sumU(a.units) > 0;
function moveTargets(a) {
  if (!canMove(a)) return [];
  return neighbors(a.node).filter(nb => passableA(a, nb)).map(nb => nb.id).filter(id => {
    const o = armyAt(id);
    return !(o && o.fac === a.fac) && !allied(a.fac, S.nodes[id].owner);
  });
}

function canRecruitAt(f, nodeId) {
  const n = S.nodes[nodeId], a = armyAt(nodeId);
  return n.owner === f && (fac(f).capital === nodeId || (a && a.fac === f));
}
function recruit(f, nodeId, type) {
  const F = fac(f), cost = UNITS[type].cost;
  if (!canRecruitAt(f, nodeId) || F.gold < cost) return false;
  emitFx({ t: 'recruit', fac: f, node: nodeId, n: PACK });
  F.gold -= cost;
  const a = armyAt(nodeId);
  if (a) a.units[type] += PACK; else S.nodes[nodeId].garrison[type] += PACK;
  return true;
}
function hireBlock(f, nodeId) {
  if (fac(f).capital == null) return 'ไร้แผ่นดิน: แต่งตั้งแม่ทัพใหม่ไม่ได้จนกว่าจะยึดเมืองหลวงแห่งใดก็ได้มาเป็นของเรา';
  const n = S.nodes[nodeId];
  if (nodeId == null || fac(f).capital !== nodeId || n.owner !== f) return 'แต่งตั้งแม่ทัพได้เฉพาะที่เมืองหลวงของเรา';
  const here = armyAt(nodeId);
  if (here) return here.gen.leader
    ? `ย้ายจอมทัพ${here.gen.name}ออกจากเมืองหลวงก่อน แม่ทัพใหม่ต้องมีที่ว่างในเมืองหลวง`
    : `ย้ายทัพของ${here.gen.name}ออกจากเมืองหลวงก่อน แม่ทัพใหม่ต้องมีที่ว่างในเมืองหลวง`;
  const n2 = S.armies.filter(a => a.fac === f).length;
  if (n2 >= maxArmies(f)) return `มีทัพครบ ${maxArmies(f)} ทัพแล้ว (สูงสุด ${maxArmies(f)}) — ต้องเสียทัพไปก่อนจึงแต่งตั้งเพิ่มได้`;
  if (fac(f).gold < HIRE_COST) return `เงินไม่พอ: ต้องใช้ ${HIRE_COST} 💰 แต่มีอยู่ ${fac(f).gold} 💰`;
  return null;
}
function hireGeneral(f) {
  const cap = fac(f).capital;
  if (hireBlock(f, cap)) return null;
  fac(f).gold -= HIRE_COST;
  const used = new Set(S.armies.map(a => a.gen.name));
  const name = S.genNames.find(x => !used.has(x)) || 'แม่ทัพนิรนาม';
  if (SIMOPT.give && f === 0 && !S.simGiven) {
    // โหมดจำลองวัดพลังตำนาน: แม่ทัพคนแรกของที่นั่งผู้เล่นเป็นตำนาน (ภักดีแล้ว)
    S.simGiven = true; S.wInGame.push(SIMOPT.give);
    const a = newArmy(f, cap, legendGen(SIMOPT.give, null), Z());
    log(`${facName(f)} แต่งตั้ง ${a.gen.name}`);
    return a;
  }
  const a = newArmy(f, cap, { name, icon: '🎖️', leader: false }, Z());
  log(`${facName(f)} แต่งตั้ง ${name}`);
  emitFx({ t: 'hire', fac: f, node: cap });
  return a;
}
function absorbGarrison(a, keep = 0) {
  const g = S.nodes[a.node].garrison;
  let left = keep;
  for (const t of UNIT_TYPES) {
    const k = Math.min(g[t], left); left -= k;
    a.units[t] += g[t] - k; g[t] = k;
  }
}
function splitToGarrison(a) {
  const g = S.nodes[a.node].garrison;
  for (const t of UNIT_TYPES) { const k = Math.floor(a.units[t] / 2); a.units[t] -= k; g[t] += k; }
}

// pos = ตำแหน่งทัพ (ใช้กับธงแห่งศรัทธา), armyN = ทหารในทัพ (ไม่รวมกองรักษาการณ์)
function defSide(nodeId) {
  const n = S.nodes[nodeId], d = armyAt(nodeId);
  return { fac: n.owner, units: addU(d ? d.units : Z(), n.garrison), gen: d ? d.gen : null, pos: nodeId, armyN: d ? sumU(d.units) : 0 };
}
const atkSide = a => ({ fac: a.fac, units: a.units, gen: a.gen, pos: a.node, armyN: sumU(a.units) });

// พลังรบ = ทหาร × แพ้ทาง × ภูมิประเทศ × กลยุทธ์ × แม่ทัพ/สกิล × สุ่ม
function powerOf(side, other, nodeId, role, opts = {}) {
  const node = S.nodes[nodeId], T = TERRAINS[node.terrain];
  const et = sumU(other.units);
  const hanni = askill(side.fac, side.gen, 'crossMountain');
  const g = side.gen, W = g && g.wid ? WMAP[g.wid] : null, ws = wsk(g, side.fac), wk = wwk(g);
  let base = 0, arcPart = 0;
  for (const t of UNIT_TYPES) {
    const adv = et > 0 ? other.units[UNITS[t].beats] / et : 0;
    let tm = T.unitMod[t] || 1;
    if (hanni && tm < 1) tm = 1;
    const v = side.units[t] * (1 + 0.5 * adv) * tm;
    base += v;
    if (t === 'arc') arcPart = v;
  }
  let mult = 1;
  const mods = [];
  const push = (label, m) => { if (Math.abs(m - 1) > 0.001) { mult *= m; mods.push({ label, m }); } };
  const note = label => mods.push({ label, m: 1 });
  if (role === 'def') push(`ชัยภูมิ${T.name}`, (node.terrain === 'mountain' && askill(other.fac, other.gen, 'crossMountain')) ? 1 : T.defMod);
  else if (T.atkMod < 1 && ws.riverWalk) note(`✨ ${W.skillName}: ข้ามแม่น้ำไม่โดนโทษ`);
  else push('บุกข้ามแม่น้ำ', T.atkMod);
  if (role === 'def' && isSeat(node)) {
    const sw = fweak(other.fac).siegeWall;
    if (wsk(other.gen, other.fac).trojanHorse) note('✨ ม้าไม้เมืองทรอย: ไม่โดนกำแพงเมือง');
    else if (isBoss() && node.id === S.boss.throne && S.boss.jar) note('🏺 ไหทองแดง: บัลลังก์ไม่มีกำแพงเมือง');
    else push(sw ? `กำแพงเมืองหลวง (⚠️ ${legendOf(other.fac).weakName})` : 'กำแพงเมืองหลวง', sw || CAPITAL_WALL);
  }
  const cmd = fweak(side.fac).commander;

}
// จบรอบ (ก่อนเทิร์นใหม่ของผู้เล่น): โลหิตเดือดลดลง ไหทองแดง สนามรบเปลี่ยนรูป
function bossRound() {
  const B = S.boss;
  if (!B) return;
  if (B.rage > 0) B.rage--;
  if (throneNet()) B.siege++; else B.siege = 0;
  const jar = B.siege >= 3 && !TUNE.nojar;
  if (jar && !B.jar) { log('🏺 ไหทองแดง! บัลลังก์ถูกล้อมครบ 3 เทิร์น — ทัพของ Ares -30% และบัลลังก์ไม่มีกำแพงเมือง'); UI.notices.push('🏺 ไหทองแดง: ล้อมบัลลังก์ครบ 3 เทิร์นแล้ว ทัพของ Ares -30% และบัลลังก์ไม่มีกำแพงเมือง!'); }
  B.jar = jar;
  if (S.turn % 5 === 0) {
    const pickN = shuffle(S.nodes.filter(n => n.capitalOf === null)).slice(0, 3);
    for (const n of pickN) n.terrain = pick(Object.keys(TERRAINS).filter(t => t !== n.terrain));
    const text = `🌀 สนามรบนิรันดร์เปลี่ยนรูป: ${pickN.map(n => `${n.name} → ${TERRAINS[n.terrain].name}`).join(', ')}`;
    log(text); UI.notices.push(text);
    emitFx({ t: 'terrain', fac: NEUTRAL, nodes: pickN.map(n => n.id) });
  }
}

/* ---------- เมืองหลวงแตก / ไร้แผ่นดิน ---------- */
// เมืองหลวงแตก: ย้ายไปอดีตเมืองหลวงของฝ่ายอื่นที่ยังครองอยู่ (ใกล้ทัพจอมทัพที่สุด) ไม่งั้นกลายเป็นไร้แผ่นดิน
function loseSeat(f, by) {
  const F = fac(f), old = S.nodes[F.capital];
  const lead = leaderArmy(f);
  const cands = S.nodes.filter(n => n.owner === f && n.capitalOf !== null && n.id !== old.id);
  if (cands.length) {
    const { dist } = bfs(lead ? lead.node : old.id, NEUTRAL, () => true);
    const nb = cands.reduce((b, n) => ((dist[n.id] == null ? 99 : dist[n.id]) < (dist[b.id] == null ? 99 : dist[b.id]) ? n : b), cands[0]);
    F.capital = nb.id; S.rstats.reloc = (S.rstats.reloc || 0) + 1;
    log(`🏚️ เมืองหลวง ${old.name} ของ ${facName(f)} แตกโดย ${facName(by)}! ย้ายเมืองหลวงไป ${nb.name}`);
    if (isHumanFac(f)) UI.notices.push(`🏚️ เมืองหลวง ${old.name} แตก! ย้ายเมืองหลวงไป ${nb.name} แล้ว เล่นต่อได้ตามปกติ`);
  } else {
    F.capital = null; S.rstats.homeless = (S.rstats.homeless || 0) + 1;
    // เสียเมืองหลวงระหว่างตาของตัวเอง เทิร์นนี้ไม่นับ
    F.homeless = { left: HOMELESS_TURNS, fresh: S.current === f };
    log(`⛺ เมืองหลวง ${old.name} ของ ${facName(f)} แตกโดย ${facName(by)}! ${facName(f)} กลายเป็นไร้แผ่นดิน — ต้องยึดเมืองหลวงแห่งใดก็ได้ภายใน ${HOMELESS_TURNS} เทิร์น`);
    if (isHumanFac(f)) UI.notices.push(`⛺ เมืองหลวง ${old.name} แตก! เรากลายเป็น “ไร้แผ่นดิน”: ไม่มีรายได้เมืองหลวง แต่งตั้งแม่ทัพไม่ได้ ต้องยึดเมืองหลวงแห่งใดก็ได้ภายใน ${HOMELESS_TURNS} เทิร์น และถ้าทัพจอมทัพแตกระหว่างนี้ = แพ้ทันที`);
  }
}
// จบตาของฝ่าย f: นับถอยหลังไร้แผ่นดิน ครบแล้วยังไม่มีเมืองหลวง = แพ้ ดินแดนกลายเป็นดินแดนกลาง
function homelessTick(f) {
  const H = fac(f).homeless;
  if (!fac(f).alive || !H || H.left == null) return;
  if (H.fresh) { H.fresh = false; return; }
  H.left--;
  if (H.left <= 0) eliminate(f, NEUTRAL, 'landless');
}
// บุเรงนอง: ทัพจอมทัพแตก ดินแดนที่ไกลเมืองหลวงที่สุด (ไม่มีทัพ) ก่อกบฏ
function rebellion(f) {
  const N = fweak(f).fragile, cap = fac(f).capital;
  if (!N || cap == null) return [];
  const { dist } = bfs(cap, NEUTRAL, () => true);
  const far = S.nodes.filter(n => n.owner === f && n.id !== cap && !armyAt(n.id))
    .sort((a, b) => (dist[b.id] == null ? 99 : dist[b.id]) - (dist[a.id] == null ? 99 : dist[a.id])).slice(0, N);
  for (const n of far) {
    emitFx({ t: 'own', node: n.id, from: f, to: NEUTRAL });
    n.owner = NEUTRAL; n.garrison = Z();
    let g = randInt(4, 9) + (n.terrain === 'mountain' ? 2 : 0);
    while (g-- > 0) n.garrison[pick(UNIT_TYPES)]++;
  }
  if (far.length) log(`🔥 จักรวรรดิเปราะบาง: ${far.map(n => n.name).join(', ')} ก่อกบฏแยกจาก ${facName(f)}`);
  return far;
}

function retreatNode(d, fromId) {
  const opts = neighbors(fromId).filter(nb => passableA(d, nb) && S.nodes[nb.id].owner === d.fac && !armyAt(nb.id));
  return opts.length ? pick(opts).id : null;
}

/* ---------- ตำนานพเนจร: ทัพแตก ถูกจับ หนี และการเข้าฝ่าย ---------- */
// หนีกลับไปพเนจรที่ดินแดนกลางแห่งอื่น พร้อมกองกำลังเฝ้าชุดใหม่ — ไม่มีดินแดนกลาง = หายไปพัก
function wanderAway(wid, fromNode) {
  const W = WMAP[wid];
  const opts = S.nodes.filter(n => n.owner === NEUTRAL && n.id !== fromNode && !wildAt(n.id));
  if (opts.length) {
    const n = pick(opts);
    putWild(wid, n.id);
    S.wstats.fled++;
    log(`🌫️ วิญญาณของ ${W.name} หนีกลับไปพเนจรที่ ${n.name}`);
    return `${W.name} หนีกลับไปพเนจรที่ ${n.name}`;
  }
  S.resting.push({ wid, back: S.turn + WANDER_REST });
  S.wstats.rest++;
  log(`🌫️ ไม่มีดินแดนกลางเหลือ วิญญาณของ ${W.name} หายไปพัก ${WANDER_REST} เทิร์น`);
  return `${W.name} หายไปพัก ${WANDER_REST} เทิร์น`;
}
// ต้นเทิร์นใหม่: ตำนานที่พักครบโผล่ในดินแดนที่ไม่มีทัพ ไม่มีกองรักษาการณ์ และไม่ใช่เมืองหลวง/อดีตเมืองหลวง
// พร้อมปลุกกองกำลังท้องถิ่น — ไม่มีที่ว่างให้โผล่ = รอเทิร์นถัดไป · 2 เทิร์นสุดท้ายไม่โผล่อีก (หายไปจนจบศึก)
const WANDER_LATE = 2;
const wanderClosed = () => S.turn > maxTurns() - WANDER_LATE;
const returnSpots = () => S.nodes.filter(n => n.capitalOf === null && !armyAt(n.id) && !wildAt(n.id) && sumU(n.garrison) === 0);
function wanderReturn() {
  if (wanderClosed()) return;
  for (const r of S.resting.slice()) {
    if (r.back > S.turn) continue;
    const opts = returnSpots();
    if (!opts.length) continue;
    const n = pick(opts), prev = n.owner;
    S.resting = S.resting.filter(x => x !== r);
    n.owner = NEUTRAL;
    putWild(r.wid, n.id);
    emitFx({ t: 'legend', fac: NEUTRAL, node: n.id, wid: r.wid });
    log(`✨ วิญญาณของ ${WMAP[r.wid].name} ปรากฏที่ ${n.name}${prev !== NEUTRAL ? ` — กองกำลังท้องถิ่นลุกขึ้นแยกตัวจาก ${facName(prev)}` : ''}`);
  }
}
function legendSpot(f) {
  const cap = fac(f).capital;
  if (cap != null && S.nodes[cap].owner === f && !armyAt(cap)) return cap;
  const { dist } = bfs(homeNode(f), NEUTRAL, () => true);
  let best = null, bd = Infinity;
  for (const n of S.nodes) if (n.owner === f && !armyAt(n.id) && dist[n.id] != null && dist[n.id] < bd) { bd = dist[n.id]; best = n.id; }
  return best;
}
function legendGen(wid, from) {
  const W = WMAP[wid];
  return { name: W.name, icon: W.icon, leader: false, wid, from: from == null ? null : from, loyalAt: from == null ? 0 : S.turn + WANDER_LOYAL };
}
// ฝ่ายที่ครองดินแดนมากที่สุด (null ถ้าเสมอ)
function leaderFac() {
  const cnt = S.factions.map(F => F.alive ? S.nodes.filter(n => n.owner === F.id).length : -1);
  const m = Math.max(...cnt);
  return cnt.filter(c => c === m).length === 1 ? cnt.indexOf(m) : null;
}
// ทัพของตำนานแตก: ลมพัดคืนชีพ → หายถาวร (โจน) → ถูกจับ (ชนะขาด) → หนีกลับไปพเนจร
// info: { by: ฝ่ายที่ชนะ, decisive, pre: ทหารก่อนรบ, at: ดินแดนที่รบ, avoid: [ดินแดนที่ห้ามถอยไป] }
function legendBroken(x, info) {
  const W = WMAP[x.gen.wid], key = 'revive_' + W.id;
  if (wsk(x.gen, x.fac).revive && !S.wflags[key] && fac(x.fac).alive) {
    const avoid = info.avoid || [];
    const ok = id => S.nodes[id].owner === x.fac && !avoid.includes(id) && (!armyAt(id) || armyAt(id) === x);
    const around = info.at != null ? info.at : x.node;
    const near = neighbors(around).map(nb => nb.id).filter(ok);
    let dest = near.length ? pick(near) : null;
    if (dest == null) {
      const { dist } = bfs(around, NEUTRAL, () => true);
      let bd = Infinity;
      for (const n of S.nodes) if (ok(n.id) && dist[n.id] != null && dist[n.id] < bd) { bd = dist[n.id]; dest = n.id; }
    }
    if (dest != null) {
      S.wflags[key] = true;
      const pre = info.pre || x.units;
      for (const t of UNIT_TYPES) x.units[t] = Math.round(pre[t] * W.skill.revive);
      emitFx({ t: 'retreat', fac: x.fac, from: around, to: dest, kind: 'revive' });
      x.node = dest; x.used = 99;
      S.wstats.revive++;
      const text = `🌬️ ลมพัดคืนชีพ! ${W.name} ฟื้นทหาร ${sumU(x.units)} นาย ถอยไป ${S.nodes[dest].name}`;
      log(text);
      return { revived: true, text };
    }
  }
  if (W.weak.perish) {
    S.wgone.push(W.id); S.wstats.gone++;
    let text = `🕯️ ${W.name} จากสนามรบนิรันดร์ไปตลอดกาล`;
    if (W.weak.wrath && S.armies.some(y => y !== x && y.fac === x.fac && y.gen.wid === 'achilles')) {
      S.wflags.achillesWrath = true;
      text += ' — อคิลลิสคลั่งแค้น พลังรบ +30% ถาวร';
    }
    log(text);
    return { text };
  }
  if (info.decisive && info.by != null && info.by >= 0 && info.by !== x.fac && fac(info.by).alive) {
    S.joins.push({ wid: W.id, fac: info.by, army: null, from: x.fac });
    S.wstats.captured++;
    if (leaderFac() === info.by) S.wstats.capLead++;
    const text = `🔗 ชนะขาด! ${facName(info.by)} จับตัว ${W.name} ได้`;
    log(text);
    return { text };
  }
  return { text: wanderAway(W.id, x.node) };
}
// ตำนานที่ยังไม่ภักดีแพ้การรบ: ทิ้งทัพหนีกลับไปพเนจร ทหารกลายเป็นกองรักษาการณ์
function legendDesert(x) {
  const W = WMAP[x.gen.wid], g = S.nodes[x.node].garrison;
  for (const t of UNIT_TYPES) g[t] += x.units[t];
  S.armies = S.armies.filter(y => y !== x);
  S.wstats.desert++;
  log(`💨 ${W.name} ยังไม่ภักดีและแพ้การรบ จึงทิ้งทัพ (ทหารอยู่รักษาการณ์ที่ ${S.nodes[x.node].name})`);
  return `💨 ${W.name} ยังไม่ภักดี ทิ้งทัพหนีไป (ทหารอยู่รักษาการณ์) — ${wanderAway(W.id, x.node)}`;
}
// จัดการคิวตำนานที่รอเข้าฝ่าย (หลังจบการเดินทัพแต่ละครั้ง)
async function processJoins() {
  while (S.joins.length) {
    const j = S.joins.shift();
    const W = WMAP[j.wid], F = fac(j.fac);
    if (!F.alive || S.over) { wanderAway(j.wid, null); continue; }
    const gen = j.gen || legendGen(j.wid, j.from);
    if (fweak(j.fac).greedy && !j.gen) gen.loyalAt = S.turn + WANDER_LOYAL; // ราชาผู้โลภ
    const a = j.army != null ? armyById(j.army) : null;
    let text;
    if (j.from == null && !j.gen && a && a.fac === j.fac && !a.gen.leader && !a.gen.wid) {
      // ยึดดินแดนตำนานพเนจรด้วยแม่ทัพธรรมดา: ตำนานนำทัพนั้นแทน ทหารอยู่ครบ
      text = `${W.name} เข้าร่วม ${facName(j.fac)} นำทัพแทน ${a.gen.name} (ทหารอยู่ครบ ${sumU(a.units)} นาย)`;
      a.gen = gen;
    } else {
      const mine = S.armies.filter(x => x.fac === j.fac);
      const spot = mine.length < maxArmies(j.fac) ? legendSpot(j.fac) : null;
      if (spot != null) {
        const na = newArmy(j.fac, spot, gen, Z());
        na.used = 99;
        if (!isHumanFac(j.fac) && spot === F.capital) absorbGarrison(na, 6);
        text = `${W.name} เข้าร่วม ${facName(j.fac)} ตั้งทัพใหม่ที่ ${S.nodes[spot].name}${j.from != null ? ' (มาตัวเปล่า)' : ''}`;
      } else {
        const cands = mine.filter(x => !x.gen.leader && !x.gen.wid);
        const fewest = () => cands.slice().sort((p, q) => sumU(p.units) - sumU(q.units))[0];
        const out = !cands.length ? null : isHumanFac(j.fac) ? await Ctrl.askDismiss(j, gen, cands) : fewest();
        if (!out) { log(`${facName(j.fac)} ไม่มีที่ให้ ${W.name} ตั้งทัพ`); wanderAway(j.wid, null); continue; }
        S.wstats.dismiss++;
        text = `${facName(j.fac)} ปลด ${out.gen.name} — ${W.name} รับช่วงนำทัพที่ ${S.nodes[out.node].name} (${sumU(out.units)} นาย)`;
        out.gen = gen;
      }
    }
    log(`✨ ${text}`);
    const at = S.armies.find(x => x.gen === gen);
    if (at) emitFx({ t: 'legend', fac: j.fac, node: at.node, wid: j.wid });
    if (isHumanFac(j.fac)) await Ctrl.showJoin(gen, text);
  }
}

function destroyArmy(x, info = {}) {
  if (x.gen.wid) {
    const r = legendBroken(x, info);
    if (!r.revived) S.armies = S.armies.filter(y => y !== x);
    return r;
  }
  S.armies = S.armies.filter(y => y !== x);
  if (!x.gen.leader) return {};
  const F = fac(x.fac);
  if (!F.alive) return {};
  if (F.capital != null && S.nodes[F.capital].owner !== x.fac) return {}; // เมืองหลวงเพิ่งถูกปลดปล่อย (โหมดบอส)
  // ไร้แผ่นดินแล้วทัพจอมทัพแตก = แพ้ทันที ดินแดนตกเป็นของผู้ที่ตีทัพแตก
  if (F.capital == null) { eliminate(x.fac, info.by != null ? info.by : NEUTRAL, 'leader'); return { text: `💀 ${facName(x.fac)} พ่ายแพ้ (ไร้แผ่นดินและทัพจอมทัพแตก)` }; }
  const reb = rebellion(x.fac);
  // จอมทัพไม่ตาย — วิญญาณถูกดึงกลับคืนสู่เมืองหลวง (สนามรบนิรันดร์ของ Ares)
  const o = armyAt(F.capital);
  if (o) {
    log(`${o.gen.name} มอบทัพให้ ${x.gen.name} ที่เมืองหลวง`);
    // ตำนานที่ถูกแทนที่ไปหาที่ตั้งทัพใหม่ (คงสถานะความภักดีเดิม)
    if (o.gen.wid) S.joins.push({ wid: o.gen.wid, fac: x.fac, army: null, from: o.gen.from, gen: o.gen });
    o.gen = x.gen;
  }
  else { const na = newArmy(x.fac, F.capital, x.gen, Z()); na.used = 99; }
  log(`วิญญาณของ ${x.gen.name} กลับคืนสู่เมืองหลวง ${S.nodes[F.capital].name}`);
  return reb.length ? { text: `🔥 ${reb.map(n => n.name).join(', ')} ก่อกบฏ (จักรวรรดิเปราะบาง)` } : {};
}

// why: 'leader' = ไร้แผ่นดินแล้วทัพจอมทัพแตก (ดินแดนให้ผู้ตีทัพแตก) / 'landless' = ครบ 3 เทิร์น (ดินแดนกลายเป็นดินแดนกลาง)
function eliminate(loser, winner, why) {
  const L = fac(loser);
  if (!L.alive) return;
  if (winner >= 0 && !fac(winner).alive) winner = NEUTRAL;
  L.alive = false; L.capital = null; L.homeless = null;
  // ตำนานของฝ่ายที่ล่มสลาย: หนีกลับไปพเนจร (โจนหายไปถาวร)
  for (const a of S.armies.filter(a => a.fac === loser && a.gen.wid)) {
    if (WMAP[a.gen.wid].weak.perish) { S.wgone.push(a.gen.wid); S.wstats.gone++; log(`🕯️ ${a.gen.name} จากสนามรบนิรันดร์ไปตลอดกาล`); }
    else wanderAway(a.gen.wid, null);
  }
  S.armies = S.armies.filter(a => a.fac !== loser);
  let cnt = 0;
  for (const n of S.nodes) if (n.owner === loser) { emitFx({ t: 'own', node: n.id, from: loser, to: winner }); n.owner = winner; cnt++; }
  const rest = winner >= 0 ? `${facName(winner)} รับดินแดนที่เหลือ ${cnt} แห่ง` : `ดินแดน ${cnt} แห่งกลายเป็นดินแดนกลาง`;
  log(why === 'leader' ? `💀 ${facName(loser)} ไร้แผ่นดินและทัพจอมทัพแตก — พ่ายแพ้! ${rest}`
    : `💀 ${facName(loser)} ไร้แผ่นดินครบ ${HOMELESS_TURNS} เทิร์นโดยไม่ได้เมืองหลวงใหม่ — พ่ายแพ้! ${rest}`);
  if (L.human) {
    S.over = { win: false, reason: why, by: winner };
  } else if (isAres(loser) && fac(0).alive) {
    S.over = { win: true, reason: 'boss' };
  } else if (!isBoss() && S.factions.every(f => f.human || !f.alive) && fac(0).alive) {
    S.over = { win: true, reason: 'conquest' };
  }
}

async function chooseStrategies(ctx) {
  const sides = [ctx.atk, ctx.def];
  const other = s => s === ctx.atk ? ctx.def : ctx.atk;
  // ฝ่ายที่ไม่ใช่ผู้เล่นและไม่มีสกิลหยั่งรู้ ตัดสินใจก่อน
  for (const s of sides) if (!isHumanFac(s.fac) && !askill(s.fac, s.gen, 'foresight')) s.strat = aiPickStrategy(s === ctx.atk ? 'atk' : 'def', ctx, s);
  for (const s of sides) {
    if (!isHumanFac(s.fac)) continue;
    const o = other(s), role = s === ctx.atk ? 'atk' : 'def';
    ctx.reveal = askill(s.fac, s.gen, 'foresight') && o.strat ? o.strat : null;
    const choice = await Ctrl.askStrategy(ctx, role);
    if (choice == null && role === 'atk' && !ctx.breakout) { ctx.cancelled = true; return; }
    if (choice && typeof choice === 'object') { ctx.retreatChoice = choice.retreat; return; }
    s.strat = STRATEGIES[choice] ? choice : 'defend';
    S.stratHist[role][s.strat]++;
  }
  // AI ขงเบ้ง: รู้ทางศัตรูแล้วเลือกแก้ทาง (ไม่ 100%)
  for (const s of sides) {
    if (s.strat) continue;
    const o = other(s);
    s.strat = (o.strat && rng() < 0.65) ? counterOf(o.strat) : aiPickStrategy(s === ctx.atk ? 'atk' : 'def', ctx, s);
    if (o.strat) ctx.aiForesight = s.fac;
  }
}

/* ---------- ถอนทัพ (ฝ่ายรับ) ---------- */
// เสียทหาร 10–30% ตามสัดส่วนทหารม้าของฝ่ายบุก (โดนไล่ล่า)
function retreatLossFrac(atkUnits) {
  const t = sumU(atkUnits);
  return 0.1 + 0.2 * (t > 0 ? atkUnits.cav / t : 0);
}
// ทางเลือกปลายทาง: ถอยเข้าดินแดนเราที่ว่าง (safe) หรือตีฝ่าวงล้อมเข้าดินแดนกลาง/ศัตรู (break)
// ใช้ได้เฉพาะฝ่ายรับที่มีทัพ และไม่ใช่เมืองหลวงของตัวเอง; ไม่ถอยเข้าจุดที่ฝ่ายบุกยกมา
function retreatOptions(d, nodeId, a) {
  const n = S.nodes[nodeId];
  if (!d || sumU(d.units) === 0 || (isSeat(n) && n.owner === d.fac) || S.noRetreat.includes(d.fac) || wwk(d.gen).noRetreat) return [];
  const lossFrac = retreatLossFrac(a.units);
  const after = {};
  for (const t of UNIT_TYPES) after[t] = d.units[t] - Math.min(d.units[t], Math.round(d.units[t] * lossFrac));
  if (sumU(after) === 0) return [];
  const opts = [];
  for (const nb of neighbors(nodeId)) {
    if (!passableA(d, nb) || nb.id === a.node) continue;
    const m = S.nodes[nb.id], x = armyAt(nb.id);
    if (m.owner === d.fac) { if (!x) opts.push({ to: nb.id, kind: 'safe', lossFrac, after: sumU(after) }); continue; }
    if (allied(d.fac, m.owner)) continue;
    const ds = defSide(nb.id);
    const ratio = sumU(ds.units) === 0 ? Infinity : estimateSides({ fac: d.fac, units: after, gen: d.gen, pos: nodeId, armyN: sumU(after) }, ds, nb.id, { tired: true });
    opts.push({ to: nb.id, kind: 'break', lossFrac, after: sumU(after), ratio });
  }
  return opts;
}

async function executeRetreat(ctx, a, d, node, opt) {
  const prevOwner = node.owner, dest = S.nodes[opt.to];
  ctx.retreat = { to: opt.to, kind: opt.kind, lossFrac: opt.lossFrac, gen: d.gen, fac: d.fac };
  emitFx({ t: 'retreat', fac: d.fac, from: node.id, to: opt.to, kind: opt.kind });
  ctx.retreat.lost = applyLoss(d.units, opt.lossFrac);
  ctx.retreat.garrisonLost = { ...node.garrison };
  node.garrison = Z();
  a.used = 99;
  S.rstats.retreat++;
  log(`🏃 ${d.gen.name} ถอนทัพจาก ${node.name} (เสียทหาร ${sumU(ctx.retreat.lost)} นาย) — ${facName(a.fac)} ยึดได้โดยไม่ต้องรบ`);
  if (sumU(d.units) === 0) {
    ctx.outcome.push(`ทัพของ ${d.gen.name} แตกระหว่างถอย`);
    const r = destroyArmy(d, { by: a.fac, pre: addU(d.units, ctx.retreat.lost), at: node.id, avoid: [node.id] });
    if (r.text) ctx.outcome.push(r.text);
  }
  else if (opt.kind === 'safe') { payAlps(d, node.id, opt.to); d.node = opt.to; d.used = 99; ctx.outcome.push(`${d.gen.name} ถอยเข้า ${dest.name}`); }
  else ctx.outcome.push(`${d.gen.name} ตีฝ่าวงล้อมไปยัง ${dest.name} — ต้องรบต่อทันที (ทัพล้า -20%)`);
  const human = isHumanFac(a.fac) ? 'atk' : isHumanFac(d.fac) ? 'def' : null;
  if (human) await Ctrl.showRetreat(ctx, human);
  if (opt.kind === 'break' && S.armies.includes(d)) {
    if (sumU(defSide(opt.to).units) === 0) {
      payAlps(d, node.id, opt.to);
      log(`${d.gen.name} ตีฝ่าวงล้อมยึด ${dest.name} ได้โดยไม่ต้องรบ`);
      capture(d, dest, dest.owner);
      S.rstats.breakWin++;
    } else {
      const bctx = await battle(d, dest, { breakout: true });
      if (bctx.atkWin) S.rstats.breakWin++; else S.rstats.breakLose++;
    }
    if (S.armies.includes(d)) d.used = 99;
  }
  if (S.over) return ctx;
  // ฝ่ายบุกเข้ายึดดินแดนที่ถูกทิ้ง (ถ้าฝ่ายบุกยังอยู่ — ตีฝ่าวงล้อมอาจยึดเมืองหลวงฝ่ายบุกได้)
  if (S.armies.includes(a) && fac(a.fac).alive && node.owner === prevOwner) capture(a, node, prevOwner, ctx.retreat.garrisonLost);
  return ctx;
}

async function battle(a, node, opts = {}) {
  const d = armyAt(node.id);
  const ctx = {
    node: node.id, breakout: !!opts.breakout,
    atk: { fac: a.fac, units: { ...a.units }, gen: a.gen, pos: a.node, armyN: sumU(a.units) },
    def: { fac: node.owner, units: addU(d ? d.units : Z(), node.garrison), gen: d ? d.gen : null, pos: node.id, armyN: d ? sumU(d.units) : 0 },
    outcome: [], wild: wildAt(node.id) ? wildAt(node.id).wid : null,
    alps: alpsFrac(a, a.node, node.id),
  };
  // ราคาของแอลป์จ่ายตอนตัดสินใจบุกแล้ว (ยกเลิกการบุกได้โดยไม่เสีย)
  const commit = () => { if (ctx.alps) { ctx.alpsLost = payAlps(a, a.node, node.id); ctx.atk.units = { ...a.units }; ctx.atk.armyN = sumU(a.units); } };
  const preD = d ? { ...d.units } : null, preG = { ...node.garrison };
  let preA = { ...a.units };
  ctx.retreatOpts = ctx.breakout ? [] : retreatOptions(d, node.id, a);
  // AI ฝ่ายรับตัดสินใจถอนทัพก่อนที่ใครจะเลือกกลยุทธ์
  if (ctx.retreatOpts.length && !isHumanFac(d.fac)) {
    const opt = aiRetreatChoice(ctx);
    if (opt) { commit(); return executeRetreat(ctx, a, d, node, opt); }
  }
  await chooseStrategies(ctx);
  if (ctx.cancelled) return ctx;
  commit();
  if (ctx.retreatChoice != null) {
    const opt = ctx.retreatOpts.find(o => o.to === ctx.retreatChoice);
    if (opt) return executeRetreat(ctx, a, d, node, opt);
    ctx.def.strat = 'defend';
    ctx.atk.strat = ctx.atk.strat || aiPickStrategy('atk', ctx, ctx.atk);
  }

  preA = { ...a.units };
  const A = ctx.atk, D = ctx.def;
  const pa = powerOf(A, D, node.id, 'atk', { stratAdv: STRATEGIES[A.strat].beats === D.strat, luck: 0.9 + rng() * 0.2, tired: ctx.breakout, myStrat: A.strat, foeStrat: D.strat });
  const pd = powerOf(D, A, node.id, 'def', { stratAdv: STRATEGIES[D.strat].beats === A.strat, luck: 0.9 + rng() * 0.2, myStrat: D.strat, foeStrat: A.strat });
  A.power = pa.power; A.mods = pa.mods; A.base = pa.base;
  D.power = pd.power; D.mods = pd.mods; D.base = pd.base;
  ctx.atkWin = pa.power > pd.power;
  const w = Math.max(pa.power, pd.power), l = Math.min(pa.power, pd.power);
  const r = w > 0 ? l / w : 0;
  const winFrac = 0.1 + 0.4 * r, loseFrac = 0.55 + 0.45 * (1 - r);
  const prevOwner = node.owner;
  ctx.decisive = r < 1 / CAPTURE_RATIO;
  // มูซาชิ: ชนะแล้วเสียทหารแค่ครึ่ง
  const winLoss = side => winFrac * (wsk(side.gen, side.fac).winLossHalf ? 0.5 : 1);
  // สปาร์ตาคัส: ปลดแอก — ชนะแล้วทหารที่ศัตรูเสียไป 20% เข้าร่วม (เข้าทัพ หรือกองรักษาการณ์ถ้าตั้งรับโดยไม่มีทัพ)
  const liberate = (side, army, lost, nodeIfGarrison) => {
    const k = askv(side.fac, army ? army.gen : side.gen, 'liberate') || 0;
    if (!k || !fac(side.fac).alive) return false;
    const g = Z();
    for (const t of UNIT_TYPES) g[t] = Math.round(lost[t] * k);
    if (!sumU(g)) return false;
    const tgt = army ? army.units : (nodeIfGarrison && nodeIfGarrison.owner === side.fac ? nodeIfGarrison.garrison : null);
    if (!tgt) return false;
    for (const t of UNIT_TYPES) tgt[t] += g[t];
    ctx.libText = `⛓️ ปลดแอก: ทหารศัตรู ${sumU(g)} นายเข้าร่วม ${facName(side.fac)}`;
    log(ctx.libText);
    return true;
  };

  if (ctx.atkWin) {
    A.lost = applyLoss(a.units, winLoss(A));
    node.owner = a.fac; // ตั้งเจ้าของก่อน เพื่อไม่ให้วิญญาณจอมทัพที่แตกกลับคืนสู่เมืองหลวงที่เพิ่งแตก
    // เมืองหลวงแตก: ย้ายเมืองหลวง/ไร้แผ่นดินก่อน แล้วค่อยจัดการทัพที่อยู่ในนั้น (ถอยตามกติกาเดิม)
    if (prevOwner >= 0 && fac(prevOwner).capital === node.id && !liberates(prevOwner, a.fac)) loseSeat(prevOwner, a.fac);
    let dl = Z();
    if (d) {
      dl = applyLoss(d.units, loseFrac);
      wipeIfTiny(d.units, dl);
    }
    dl = addU(dl, node.garrison);
    node.garrison = Z();
    D.lost = dl;
    D.after = d ? { ...d.units } : Z();
    if (d) {
      const ret = sumU(d.units) > 0 ? retreatNode(d, node.id) : null;
      if (ret != null) { payAlps(d, node.id, ret); d.node = ret; d.used = 99; ctx.outcome.push(`${d.gen.name} ถอยทัพไป ${S.nodes[ret].name}`); emitFx({ t: 'retreat', fac: d.fac, from: node.id, to: ret, kind: 'fall' }); }
      else {
        ctx.outcome.push(`ทัพของ ${d.gen.name} แตกพ่าย`);
        const rr = destroyArmy(d, { by: a.fac, decisive: ctx.decisive, pre: preD, at: node.id });
        if (rr.text) ctx.outcome.push(rr.text);
      }
    }
    ctx.outcome.unshift(`${a.gen.name} ยึด ${node.name} ได้!`);
    capture(a, node, prevOwner, preG);
    liberate(A, a, D.lost);
    A.after = { ...a.units };
  } else {
    A.lost = applyLoss(a.units, loseFrac);
    wipeIfTiny(a.units, A.lost);
    // ตีฝ่าวงล้อมแล้วแพ้ = ทัพแตกทั้งหมด
    if (ctx.breakout) for (const t of UNIT_TYPES) { A.lost[t] += a.units[t]; a.units[t] = 0; }
    A.after = { ...a.units };
    let dl = Z();
    if (d) dl = applyLoss(d.units, winLoss(D));
    dl = addU(dl, applyLoss(node.garrison, winFrac));
    D.lost = dl;
    D.after = defSide(node.id).units;
    if (sumU(a.units) === 0) {
      ctx.outcome.push(`ทัพของ ${a.gen.name} แตกพ่าย`);
      const rr = destroyArmy(a, { by: D.fac, decisive: ctx.decisive, pre: preA, at: node.id, avoid: ctx.breakout ? [a.node] : [] });
      if (rr.text) ctx.outcome.push(rr.text);
    }
    else ctx.outcome.push(`${a.gen.name} ถอยกลับ ${S.nodes[a.node].name}`);
    ctx.outcome.unshift(`${facName(D.fac)} รักษา ${node.name} ไว้ได้`);
    if (liberate(D, d && S.armies.includes(d) ? d : null, A.lost, node)) D.after = defSide(node.id).units;
  }
  if (S.armies.includes(a)) a.used = 99;
  if (ctx.libText) ctx.outcome.push(ctx.libText);
  // ตำนานที่ยังไม่ภักดีแพ้การรบ = ทิ้งทัพหนีไป
  const loser = ctx.atkWin ? d : a;
  if (loser && S.armies.includes(loser) && loser.gen.wid && !isLoyal(loser.gen, loser.fac)) ctx.outcome.push(legendDesert(loser));
  if (ctx.atkWin && ctx.wild) ctx.outcome.push(`✨ ${WMAP[ctx.wild].name} จะเข้าร่วม ${facName(A.fac)}`);

  const human = isHumanFac(A.fac) ? 'atk' : isHumanFac(D.fac) ? 'def' : null;
  if (human) { S.stats.battles++; if ((human === 'atk') === ctx.atkWin) S.stats.won++; }
  if (isBoss()) {
    const B = S.boss;
    for (const [me, foe] of [[A, D], [D, A]]) {
      if (isAres(foe.fac) && foe.strat === 'charge' && me.strat === 'ambush' && isHumanFac(me.fac)) B.weak.athena++;
      if (me.mods.some(m => /บาดเจ็บจากมนุษย์/.test(m.label))) B.weak.mortal++;
      if (me.mods.some(m => /ไหทองแดง/.test(m.label))) B.weak.jar++;
    }
    if (node.id === B.throne && ctx.atkWin) B.throneTaken++;
    bloodTick();
  }
  log(`${ctx.breakout ? '🏃 ' + facName(A.fac) + ' ตีฝ่าวงล้อมเข้า' : '⚔️ ' + facName(A.fac) + ' บุก'} ${node.name} (${facName(prevOwner)}) — ${ctx.atkWin ? 'ฝ่ายบุกชนะ' : 'ฝ่ายรับชนะ'}`);
  emitFx({ t: 'battle', node: node.id, atk: A.fac, def: D.fac, win: ctx.atkWin, lostA: sumU(A.lost), lostD: sumU(D.lost), human: !!human });
  if (human) await Ctrl.showBattle(ctx, human);
  return ctx;
}

function endByTurns() {
  const counts = S.factions.map(f => f.alive ? S.nodes.filter(n => n.owner === f.id).length : -1);
  const troops = S.factions.map(f => f.alive ? S.armies.filter(a => a.fac === f.id).reduce((s, a) => s + sumU(a.units), 0)
    + S.nodes.filter(n => n.owner === f.id).reduce((s, n) => s + sumU(n.garrison), 0) : -1);
  const best = Math.max(...counts.slice(1));
  const bestTroops = Math.max(-1, ...troops.filter((t, i) => i > 0 && counts[i] === best));
  const win = counts[0] > best || (counts[0] === best && troops[0] > bestTroops);
  S.over = isBoss() ? { win: false, reason: 'bossTime' } : { win, reason: 'turns', counts };
}

async function endPlayerTurn() {
  if (!S || S.over || S.phase !== 'player' || UI.busy) return;
  if (UI.tut) finishTutorial();
  clearUndo();
  UI.busy = true; UI.selArmy = null; S.phase = 'ai';
  UI.ghost = false; FX.steps = []; FX.cur = null; FX.played = 0; FX.last = null; FX.rec = Ctrl.fx;
  const keepView = UI.view;
  homelessTick(0);
  Ctrl.render();
  try {
    for (const f of S.factions) {
      if (f.human || !f.alive || S.over) continue;
      S.current = f.id;
      Ctrl.render();
      await Ctrl.delay(Math.round(350 * Ctrl.aiPace()));
      await aiTurn(f.id);
      if (!S.over) homelessTick(f.id);
    }
    if (!S.over) {
      S.turn++;
      if (S.turn > maxTurns()) { S.turn = maxTurns(); endByTurns(); }
      else {
        S.phase = 'player'; S.current = 0;
        wanderReturn();
        bossRound();
        await Ctrl.aiCatchUp();
        const inc = startFactionTurn(0);
        log(`— เทิร์น ${S.turn}: รับรายได้ ${inc} 💰 —`);
        const H = fac(0).homeless;
        if (H && H.left === 1) UI.notices.push(`⚠️ ไร้แผ่นดิน: เหลือเทิร์นนี้เป็นเทิร์นสุดท้าย! ยึดเมืองหลวงแห่งใดก็ได้ภายในเทิร์นนี้ ไม่งั้นแพ้`);
        saveGame();
      }
    }
  } finally {
    UI.busy = false;
    // จบรอบ: การกระทำทั้งหมดค้างบนแผนที่แบบจาง ๆ จนกว่าผู้เล่นจะเริ่มสั่งการ (กด 🔁 ดูซ้ำได้)
    FX.rec = false; FX.cur = null;
    FX.last = FX.steps.length ? FX.steps : null; FX.steps = [];
    UI.ghost = !!FX.last;
    if (FX.panned) { UI.view = keepView; FX.panned = false; }
    Ctrl.fxClear();
  }
  Ctrl.render();
  if (S.over) Ctrl.gameOver();
  else showNotices();
}

function checkInvariants() {
  const e = [], seen = new Set();
  const okU = u => UNIT_TYPES.every(t => Number.isInteger(u[t]) && u[t] >= 0);
  for (const a of S.armies) {
    if (seen.has(a.node)) e.push(`two armies at node ${a.node}`);
    seen.add(a.node);
    if (S.nodes[a.node].owner !== a.fac) e.push(`army ${a.id} on foreign node`);
    if (!fac(a.fac).alive) e.push(`army of dead faction`);
    if (!okU(a.units)) e.push(`army ${a.id} bad units ${JSON.stringify(a.units)}`);
  }
  for (const n of S.nodes) {
    if (!okU(n.garrison)) e.push(`node ${n.id} bad garrison`);
    if (n.owner !== NEUTRAL && !S.factions[n.owner]) e.push(`node ${n.id} bad owner`);
  }
  // ตำนานพเนจรแต่ละตัวต้องอยู่ที่เดียว: บนแผนที่ / ในทัพ / พัก / หายถาวร
  const wseen = {};
  const wadd = (id, where) => { if (wseen[id]) e.push(`legend ${id} in ${wseen[id]} and ${where}`); wseen[id] = where; };
  for (const w of S.wild) { wadd(w.wid, 'wild'); if (S.nodes[w.node].owner !== NEUTRAL) e.push(`wild ${w.wid} on owned node`); }
  for (const r of S.resting) wadd(r.wid, 'rest');
  for (const id of S.wgone) wadd(id, 'gone');
  for (const a of S.armies) if (a.gen.wid) { wadd(a.gen.wid, 'army'); if (a.gen.leader) e.push(`legend ${a.gen.wid} as leader`); }
  if (S.joins.length) e.push(`pending joins ${S.joins.length}`);
  for (const id of S.wInGame) if (!wseen[id]) e.push(`legend ${id} lost`);
  for (const f of S.factions) {
    if (!Number.isFinite(f.gold) || f.gold < 0) e.push(`faction ${f.id} bad gold ${f.gold}`);
    const mine = S.armies.filter(a => a.fac === f.id);
    if (f.alive) {
      if (f.capital != null && S.nodes[f.capital].owner !== f.id) e.push(`faction ${f.id} capital not owned`);
      if (f.capital == null && !f.homeless) e.push(`faction ${f.id} no capital but not homeless`);
      if (f.capital != null && f.homeless) e.push(`faction ${f.id} has capital but homeless`);
      const L = mine.filter(a => a.gen.leader).length;
      if (L !== 1) e.push(`faction ${f.id} has ${L} leaders`);
      if (mine.length > maxArmies(f.id)) e.push(`faction ${f.id} has ${mine.length} armies`);
    } else if (S.nodes.some(n => n.owner === f.id)) e.push(`dead faction ${f.id} owns nodes`);
  }
  return e;
}

/* =====================================================================
   AI
   ===================================================================== */
// กลยุทธ์ของ AI (ไม่เคยเห็นตัวเลือกของอีกฝ่ายในการรบครั้งนั้น ยกเว้นสกิลหยั่งรู้ของขงเบ้ง)
function aiPickStrategy(role, ctx, side) {
  const lvl = side && side.fac >= 0 ? aiLevel(side.fac) : 1; // กองกำลังท้องถิ่นไม่ใช่ AI ฝ่ายใด ใช้แบบมาตรฐาน
  // แพ้อาเธน่า: Ares บ้าคลั่ง เลือกบุกตรง 60% ของเวลา
  if (side && isAres(side.fac) && !TUNE.noathena && rng() < 0.6) return 'charge';
  if (lvl === 0) return pick(STRAT_KEYS);
  // จอมพลขึ้นไป: ใช้จุดอ่อนของตำนานฝ่ายตรงข้าม และเลี่ยงจุดอ่อนของตำนานฝ่ายตัวเอง
  if (lvl >= 2 && ctx && side && !TUNE.noweak) {
    const foe = side === ctx.atk ? ctx.def : ctx.atk;

    const foe = role === 'atk' ? ctx.def.fac : ctx.atk.fac;

// ถอนทัพ: คืนทางเลือกที่จะใช้ หรือ null = สู้ (นายกองไม่ถอน)
function aiRetreatChoice(ctx, lvl = aiLevel(ctx.def.fac)) {

  const risky = fac(ctx.def.fac).capital == null && ctx.def.gen && ctx.def.gen.leader;

function threatAt(nodeId, f) {

function playerLeads() {

// เลือกเป้าแบบยุติธรรม (โหมดปกติ ใช้กับผู้เล่นและ AI เหมือนกันหมด — โหมดศึกชิงอิสรภาพไม่ใช้)
// ความแค้น: ถูกฝ่ายไหนบุก จะเล็งฝ่ายนั้นเต็มที่ GRUDGE.full เทิร์น แล้วค่อย ๆ ลดลงจนหมดใน GRUDGE.fade เทิร์น

function grudgeBonus(f, g) {

}
const troopsOf = f => S.armies.reduce((t, a) => t + (a.fac === f ? sumU(a.units) : 0), 0) + S.nodes.reduce((t, n) => t + (n.owner === f ? sumU(n.garrison) : 0), 0);

  if (fac(g).capital == null && fac(g).homeless && fac(g).homeless.left != null) return true; // ไร้แผ่นดินระหว่างเกม (ไม่นับสปาร์ตาคัสที่ไร้แผ่นดินโดยกำเนิด)

// ฝ่ายที่ครองดินแดนนำห่าง (มากกว่าอันดับสองอย่างน้อย 3 แห่ง และ 25%) หรือ null

function targetBonus(f, g) {

  if (isPrey(g)) v += PREY_BONUS;

}
function nodeValue(f, n) {
  let v = (n.owner === NEUTRAL ? 9 : 13) + TERRAINS[n.terrain].income * 1.5;
  if (isSeat(n)) v += 50;
  else if (n.capitalOf !== null) v += 10;                         // อดีตเมืองหลวง: เมืองหลวงสำรอง

  // ทัพจอมทัพของฝ่ายที่ไร้แผ่นดิน: ตีแตก = ฝ่ายนั้นแพ้ และได้ดินแดนทั้งหมดของมัน

  if (TUNE.oldbias && isHumanFac(n.owner) && !isHumanFac(f)) v += aiLevel(f) >= 2 ? 7 : 3; // พฤติกรรมเดิม (ไว้เทียบใน ?sim เท่านั้น)

  if (aiLevel(f) >= 3 && !isHumanFac(f) && playerLeads()) {

// ความคุ้มค่าของตำนานในดินแดนนั้น: นายกองไม่สน, แม่ทัพให้ค่าเท่ากันทุกตัว, จอมพลขึ้นไปดูว่าตัวไหนคุ้ม
function legendValue(f, n) {

      const mine = S.armies.filter(a => a.fac === f);

const isPlayerCapital = n => isHumanFac(n.owner) && isSeat(n);

// จอมพลขึ้นไป: ถ่วงน้ำหนักทหารศัตรูตามระยะ แล้วเลือกประเภทที่ได้เปรียบสุทธิมากที่สุด

  if (!TUNE.noweak && a && a.fac === f && a.units.arc < (sumU(a.units) + PACK) * 0.3 && rng() < 0.8

function aiRecruit(f) {

    const arms = myArmies().filter(a => canRecruitAt(f, a.node) && !(aiLevel(f) >= 2 && wwk(a.gen).bigArmy && sumU(a.units) + PACK > wwk(a.gen).bigArmy));

// จอมพลขึ้นไป: เลือก "เป้าร่วม" — ดินแดนที่ทัพเดียวตีไม่ไหว แต่ทัพของเราภายใน 3 ช่องรวมกันชนะได้

function aiFocusTarget(f) {
  const arms = S.armies.filter(a => a.fac === f && sumU(a.units) > 0);

    const ds = defSide(n.id);
    if (sumU(ds.units) === 0) continue;
    const idx = arms.map((a, i) => i).filter(i => dists[i][n.id] != null && dists[i][n.id] <= 3);
    if (idx.length < 2) continue;
    const group = idx.map(i => arms[i]);
    if (group.some(a => estimateRatio(a, n.id) >= LEVELS[2].atkThr)) continue;
    const comb = group.reduce((u, a) => addU(u, a.units), Z());
    const lead = group.find(a => a.gen.leader) || group[0];
    const r = estimateSides({ fac: f, units: comb, gen: lead.gen }, ds, n.id);
    if (r < 1.5) continue;
    const avgD = idx.reduce((t, i) => t + dists[i][n.id], 0) / idx.length;
    const sc = nodeValue(f, n) * Math.min(r, 3) * (isPlayerCapital(n) && !isHumanFac(f) ? 1.5 : 1) / avgD;
    if (sc > bs) { bs = sc; best = { node: n.id, armies: group.map(a => a.id) }; }
  }
  return best;
}

// จอมพลขึ้นไป: หาเป้าที่ทัพเดียวสู้ไม่ไหว แต่หลายทัพที่อยู่ติดกันรวมกันชนะได้
// แล้วบุกต่อเนื่องจากทัพเล็กไปทัพใหญ่ (ทัพสุดท้ายบุกเมื่อศัตรูอ่อนลงพอ)
async function aiCoordinatedStrike(f) {
  const cap = fac(f).capital;
  const capSafe = cap == null || threatAt(cap, f) <= capDefense(cap, f) * 0.8;
  const mine = S.armies.filter(a => a.fac === f && canMove(a) && (capSafe || a.node !== cap));
  let plan = null, best = 0;
  for (const n of S.nodes) {
    if (!hostile(f, n.owner)) continue;
    const ds = defSide(n.id);
    if (sumU(ds.units) === 0) continue;
    const group = mine.filter(a => moveTargets(a).includes(n.id));
    if (group.length < 2 || group.some(a => estimateRatio(a, n.id) >= LEVELS[2].atkThr)) continue;
    const comb = group.reduce((u, a) => addU(u, a.units), Z());
    const lead = group.find(a => a.gen.leader) || group[0];
    const r = estimateSides({ fac: f, units: comb, gen: lead.gen }, ds, n.id);
    if (r < 1.6) continue;
    const sc = nodeValue(f, n) * Math.min(r, 3);
    if (sc > best) { best = sc; plan = { node: n.id, group }; }
  }
  if (!plan) return;
  S.rstats.coord++;
  const order = plan.group.slice().sort((x, y) => sumU(x.units) - sumU(y.units));
  for (let i = 0; i < order.length; i++) {
    const a = order[i];
    if (S.over || !fac(f).alive || S.nodes[plan.node].owner === f) break;
    if (!S.armies.includes(a) || !moveTargets(a).includes(plan.node)) continue;
    if (i === order.length - 1 && estimateRatio(a, plan.node) < 1.0) break;
    await aiMove(a, plan.node);
  }
}

// เดินทัพของ AI พร้อมแสดงบนแผนที่: ลูกศรวิ่งไปก่อน แล้วค่อยแสดงผล (💥 ทหารที่เสีย ดินแดนเปลี่ยนเจ้าของ)
async function aiMove(a, to) {
  const st = fxBegin(a.fac, a.node, to, S.nodes[to].owner === a.fac ? 'move' : 'atk');
  if (st) await Ctrl.aiArrow(st);
  const res = await moveArmy(a, to);
  fxEnd(st, res.type === 'invalid' || res.type === 'cancel');
  Ctrl.render();
  await Ctrl.aiCatchUp();
  return res;
}

async function aiTakeActions(fid) {
  if (!S.focus) S.focus = {};
  S.focus[fid] = aiLevel(fid) >= 2 && !TUNE.nocoord ? aiFocusTarget(fid) : null;
  if (S.focus[fid]) S.rstats.focus++;
  aiRecruit(fid);
  await Ctrl.aiCatchUp();
  if (aiLevel(fid) >= 2 && !TUNE.nocoord) await aiCoordinatedStrike(fid);
  if (S.over || !fac(fid).alive) return;
  const armies = S.armies.filter(a => a.fac === fid).sort((x, y) => sumU(y.units) - sumU(x.units));
  for (const a of armies) {
    let guard = 0;
    while (!S.over && S.armies.includes(a) && canMove(a) && guard++ < 3) {
      const to = aiChooseMove(a);
      if (to == null) break;
      const res = await aiMove(a, to);
      if (res.type === 'invalid' || res.type === 'cancel') break;
      if (!fac(fid).alive || S.over) return;
    }
  }
  if (!S.over && fac(fid).alive) { aiRecruit(fid); await Ctrl.aiCatchUp(); }
}
// สถิติ ?sim: ดินแดนของฝ่ายอื่นที่ติดพรมแดนเรา แยกเป็นของผู้เล่น / ของ AI
function sampleBorder(f) {
  const T = S.tstats;
  if (!T || isHumanFac(f)) return;
  const seen = new Set();
  for (const n of S.nodes) if (n.owner === f) for (const nb of neighbors(n.id)) {
    const o = S.nodes[nb.id].owner;
    if (o >= 0 && o !== f && passable(f, nb) && !seen.has(nb.id)) { seen.add(nb.id); if (isHumanFac(o)) T.bP++; else T.bAI++; }
  }
}
async function aiTurn(fid) {
  sampleBorder(fid);
  startFactionTurn(fid);
  await aiTakeActions(fid);
}

    if (!d || !(d.v === SAVE_VERSION || d.v === 2) || !d.s || !Array.isArray(d.s.nodes) || d.s.over) return null;
    if (d.v === 2) Object.assign(d.s, wanderFields(), { v: SAVE_VERSION }); // เซฟเก่า: เล่นต่อได้โดยไม่มีตำนานพเนจร
    for (const f of d.s.factions) { if (f.start == null) f.start = f.capital; if (f.homeless === undefined) f.homeless = null; }

  } catch (e) { return null; }
}

    if (a) {
