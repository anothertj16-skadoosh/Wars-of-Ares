      const d = armyAt(capA); d.node = Xa; S.nodes[Xa].owner = 1; d.units = { inf: 5, cav: 0, arc: 0 };
      const a = armyAt(fac(0).capital); a.node = Ya; S.nodes[Ya].owner = 0; a.units = { inf: 30, cav: 30, arc: 30 };
      const ctx = { node: Xa, atk: { fac: 0, units: a.units, gen: a.gen }, def: { fac: 1, units: defSide(Xa).units, gen: d.gen } };
      ctx.retreatOpts = retreatOptions(d, Xa, a);
      return aiRetreatChoice(ctx);
    };
    check('นายกอง AI never retreats', aiRetreatCase(0) === null);
    check('แม่ทัพ AI retreats when crushed', aiRetreatCase(1) !== null);

    // --- เลือกเป้าแบบยุติธรรม: ไม่มีโบนัสตีผู้เล่น / ความแค้น / ฉวยโอกาส / ถ่วงดุลอำนาจ ---
    // ดินแดนสองแห่งที่เหมือนกันทุกอย่าง ต่างกันแค่เจ้าของ (ผู้เล่น vs AI อีกฝ่าย) — มองจาก AI ฝ่าย 1
    const fairCase = lvl => {
      for (let sd = 300 + lvl * 50; ; sd++) { newGame('napoleon', 2, sd, lvl, 'm'); if (!S.factions.some(F => legendOf(F.id).landless)) break; }
      for (const n of S.nodes) if (n.capitalOf === null && n.owner === NEUTRAL) n.garrison = Z();
      const free = S.nodes.filter(n => n.capitalOf === null && !armyAt(n.id) && !wildAt(n.id));
      const nP = free[0], nA = free[1];
      nP.terrain = nA.terrain = 'plain'; nP.owner = 0; nA.owner = 2;
      return { nP, nA, v: () => [nodeValue(1, nP), nodeValue(1, nA)] };
    };
    for (const lvl of [0, 1, 2]) {
      const c = fairCase(lvl), [vp, va] = c.v();
      check(`fair ${LEVELS[lvl].name}: player land not favoured`, Math.abs(vp - va) < 1e-9, `p=${vp} ai=${va}`);
    }
    {
      const c = fairCase(3);
      for (const n of S.nodes.filter(n => n.owner === NEUTRAL).slice(0, 3)) n.owner = 0;
      const [vp, va] = c.v();
      check('ตำนาน: still gangs up when player leads', playerLeads() && vp > va + 10, `p=${vp} ai=${va}`);
    }
    {
      const c = fairCase(1);
      const [p0, a0] = c.v();
      noteAttack(2, 1);
      const a1 = c.v()[1];
      noteAttack(0, 1);
      const p1 = c.v()[0];
      check('grudge: attacked AI targets its attacker (same for player & AI)', a1 - a0 === GRUDGE.bonus && p1 - p0 === GRUDGE.bonus);
      const t0 = S.turn;
      S.turn = t0 + GRUDGE.full; const full = c.v()[1] - a0;
      S.turn = t0 + GRUDGE.full + 1; const fading = c.v()[1] - a0;
      S.turn = t0 + GRUDGE.full + GRUDGE.fade; const gone = c.v()[1] - a0;
      check('grudge: full 3–4 turns then fades out', full === GRUDGE.bonus && fading > 0 && fading < GRUDGE.bonus && gone === 0, `full=${full} fading=${fading} gone=${gone}`);
      S.turn = t0;
      check('grudge only on the attacker', grudgeBonus(2, 0) === 0 && grudgeBonus(1, 2) === GRUDGE.bonus);
    }
    {
      const c = fairCase(1);
      S.grudge = {};
      const [p0, a0] = c.v();
      fac(2).capital = null; fac(2).homeless = { left: 3, fresh: false };
      const a1 = c.v()[1];
      fac(2).capital = fac(2).start; fac(2).homeless = null;
      for (const a of S.armies.filter(a => a.fac === 0)) a.units = { inf: 1, cav: 0, arc: 0 };
      for (const n of S.nodes.filter(n => n.owner === 0)) n.garrison = Z();
      const p1 = c.v()[0];
      check('opportunism: homeless / weak side is juicier (AI or player)', a1 - a0 === PREY_BONUS && isPrey(0) && p1 - p0 === PREY_BONUS && !isPrey(1));
      newGame('spartacus', 2, 361, 1, 'm');
      check('opportunism: born-landless Spartacus is not prey just for being landless', fac(0).capital == null && !isPrey(0));
    }
    for (const lvl of [1, 2]) {
      const c = fairCase(lvl);
      for (const n of S.nodes.filter(n => n.owner === NEUTRAL).slice(0, 5)) n.owner = 2;
      const [vp, va] = c.v();
      check(`balance of power ${LEVELS[lvl].name}: ${lvl >= 2 ? 'targets' : 'ignores'} runaway AI`, runawayFac() === 2 && (lvl >= 2 ? va - vp === BALANCE_BONUS : va === vp), `p=${vp} ai=${va}`);
    }
    {
      const c = fairCase(2);
      for (const n of S.nodes.filter(n => n.owner === NEUTRAL).slice(0, 5)) n.owner = 0;
      const [vp, va] = c.v();
      check('balance of power: runaway player targeted the same way', runawayFac() === 0 && vp - va === BALANCE_BONUS);
    }
    {
      // ยึด/รบจริงผ่าน moveArmy ก็จดความแค้น
      newGame('napoleon', 2, 333, 1, 'm');
      for (const f of S.factions) f.human = f.id === 0;
      const e = S.edges.find(e => !e.mountain && S.nodes[e.a].capitalOf === null && S.nodes[e.b].capitalOf === null && !armyAt(e.a) && !armyAt(e.b));
      S.nodes[e.a].owner = 2; S.nodes[e.b].owner = 1; S.nodes[e.b].garrison = { inf: 2, cav: 0, arc: 0 };
      const ga = newArmy(2, e.a, { name: 'x', icon: '🎖️', leader: false }, { inf: 30, cav: 30, arc: 30 });
      await moveArmy(ga, e.b);
      check('real attack records grudge', S.grudge[1] && S.grudge[1][2] === S.turn && S.tstats.onAI === 1);
      newGame('napoleon', 2, 334, 3, 'l', { boss: true });
      check('boss mode: fair-targeting rules off (puppets still gang up)', targetBonus(1, 0) === 0 && (noteAttack(0, 1), !S.grudge[1]));
    }

    // --- ตาของฝ่ายอื่นแสดงบนแผนที่ ---
    startGame('napoleon', 2, 1, 'm');
    Ctrl.auto = true; setAiSpeed('normal');
    let sawFx = 0, sawBoom = 0;
    const fxObs = new MutationObserver(recs => { for (const r of recs) for (const nd of r.addedNodes) { sawFx++; if (nd.querySelector && nd.querySelector('.fx-boom')) sawBoom++; } });
    fxObs.observe($('fx'), { childList: true });
    await endPlayerTurn();
    check('AI turn: arrows animate on map', sawFx > 0 && !FX.panned, `fx=${sawFx} boom=${sawBoom}`);
    check('AI turn: battles show 💥 (incl. AI vs neutral/AI)', sawBoom > 0 || !FX.last.some(st => st.ev.some(e => e.t === 'battle' && !e.human)));
    check('round recorded', !!FX.last && FX.last.some(st => st.from != null) && UI.ghost && $('fx').childElementCount === 0);
    UI.selNode = null; render();
    check('player turn: faded arrows + key shown', !!q('#map .ghost[data-ghost]') && !!q('#info .ghost-key'));
    check('attack badge colour = result', [...document.querySelectorAll('#map .gbadge[data-won="1"] circle')].every(c => c.getAttribute('fill') === '#2f7d4f')
      && [...document.querySelectorAll('#map .gbadge[data-won="0"] circle')].every(c => c.getAttribute('fill') === '#b03a2e'));
    const recruited = FX.last.some(st => st.ev.some(e => e.t === 'recruit'));
    check('recruit +N icon on map', !recruited || [...document.querySelectorAll('#map .gmark')].some(g => /\+\d+/.test(g.textContent)));
    check('replay button enabled', !$('btnReplay').disabled);
    sawFx = 0;
    const stBefore = JSON.stringify(S);
    await replayRound();
    check('🔁 replay plays the round again and restores state', sawFx > 0 && JSON.stringify(S) === stBefore && !UI.busy && !!q('#map .ghost'));
    await onNodeClick(leaderArmy(0).node);
    check('faded arrows clear when player starts commanding', !UI.ghost && !q('#map .ghost') && !q('#info .ghost-key'));
    setAiSpeed('skip');
    sawFx = 0;
    await endPlayerTurn();
    let spd = null; try { spd = localStorage.getItem(SPEED_KEY); } catch (e) { /* ignore */ }
    check('speed "skip": no animation but still recorded', sawFx === 0 && !!FX.last && UI.ghost, `fx=${sawFx}`);
    $('btnSpeed').click();
    check('speed choice remembered + cycles', spd === 'skip' && UI.aiSpeed === 'normal' && /ปกติ/.test($('btnSpeed').textContent));
    setAiSpeed('normal');
    fxObs.disconnect();
    Ctrl.auto = false;
    check('invariants after fx rounds', checkInvariants().length === 0, checkInvariants().join(';'));

    // --- ปุ่มกลับไปสั่งการเลือกทัพนอกเมืองหลวงก่อน ---
    startGame('napoleon', 2, 1);
    setEndWarnOff(false);
    const capB = fac(0).capital, leadB = armyAt(capB);
    const XB = moveTargets(leadB).find(id => S.nodes[id].capitalOf === null);
    leadB.node = XB; S.nodes[XB].owner = 0; S.nodes[XB].garrison = Z();
    fac(0).gold = 100;
    const gB = hireGeneral(0); gB.units.inf = 5;
    UI.selArmy = null; render();
    $('btnEnd').click();
    q('#dialogCard [data-act="back"]').click();
    check('back selects army outside capital', UI.selArmy === leadB.id, `sel=${UI.selArmy} lead=${leadB.id} hired=${gB.id}`);
  } catch (e) {
    if (e === STOP) { document.title = 'TESTDONE'; return; }
    res.push('EXC ' + (e && e.stack || e));
  }
  out();
}

/* =====================================================================
   BOOT
   ===================================================================== */
function boot() {
  bindUI();
  $('optTut').checked = !tutDone();
  UI.setupLevel = loadProgress().unlocked;
  try { const sz = localStorage.getItem(SIZE_KEY); if (MAP_SIZES[sz]) UI.setupSize = sz; } catch (e) { /* ignore */ }
  try { const sp = localStorage.getItem(SPEED_KEY); if (AI_SPEEDS[sp]) UI.aiSpeed = sp; } catch (e) { /* ignore */ }
  renderSpeed();
  renderTitle();
  const q = new URLSearchParams(location.search);
  const errs = [];
  window.addEventListener('error', e => errs.push(String(e.message)));
  window.addEventListener('unhandledrejection', e => errs.push('rejection: ' + String(e.reason && e.reason.stack || e.reason)));
  window.__errs = errs;
  const topt = { level: q.has('level') ? +q.get('level') : 1, noret: q.get('noret') || null };
  if (q.get('give')) SIMOPT.give = q.get('give');
  if (q.get('size')) topt.size = q.get('size');
  if (q.has('boss')) topt.boss = true;
  if (q.has('troy')) topt.troy = true;
  if (q.get('from')) topt.from = +q.get('from');
  if (q.has('sim')) {
    for (const k of (q.get('tune') || '').split(',')) if (k) TUNE[k] = true;
    runTests('sim', +q.get('sim') || 50, topt);
  }
  else if (q.has('autotest')) runTests('autotest', +q.get('autotest') || 3, topt);
  else if (q.has('featuretest')) runFeatureTest();
  else if (q.has('legendtest')) runLegendTest();
  else if (q.has('capitaltest')) runCapitalTest();
  else if (q.has('zoomtest')) runZoomTest();
  else if (q.has('duel')) runDuel(+q.get('duel') || 300, topt.level);
  else if (q.has('tuttest')) runTutorialTest(+q.get('tuttest') || 99);
  else if (q.has('shot')) {
    saveDisabled = true;
    UI.setupLegend = q.get('legend') || 'kongming';
    if (q.get('shot') === 'boss' || q.get('shot') === 'ending' || q.get('shot') === 'bossintro') {
      newGame(UI.setupLegend, 2, 42, 1, 'l', { boss: true });
      UI.selNode = homeNode(0); UI.selArmy = leaderArmy(0).id;
      S.boss.gauge = 4; S.boss.rage = 1;
      showScreen('game'); render();
      if (q.get('shot') === 'bossintro') openDialog(bossIntroHtml());
      if (q.get('shot') === 'ending') { S.over = { win: true, reason: 'boss' }; uiGameOver(); }
    } else if (q.get('shot') !== 'title') {
      newGame(UI.setupLegend, 2, 42, 1, q.get('size') || 's');
      UI.selNode = fac(0).capital; UI.selArmy = armyAt(fac(0).capital).id;
      showScreen('game'); render();
      if (q.get('shot') === 'homeless') {
        // เราเสียเมืองหลวงจนไร้แผ่นดิน เหลือ 1 เทิร์น
        const c = fac(0).capital; S.nodes[c].owner = 1;
        const la = leaderArmy(0), nb = neighbors(c).map(x => x.id).find(id => !armyAt(id));
        S.nodes[nb].owner = 0; la.node = nb;
        fac(0).capital = null; fac(0).homeless = { left: 1, fresh: false };
        UI.selNode = nb; UI.selArmy = la.id; render();
        UI.notices.push('⚠️ ไร้แผ่นดิน: เหลือเทิร์นนี้เป็นเทิร์นสุดท้าย! ยึดเมืองหลวงแห่งใดก็ได้ภายในเทิร์นนี้ ไม่งั้นแพ้'); showNotices();
      }
      if (q.get('shot') === 'legend') { UI.selNode = S.wild[0].node; UI.selArmy = null; render(); }
      if (q.get('shot') === 'ghost') {
        // ภาพตาศัตรูจาง ๆ หลังเล่นไป 3 รอบ (&level= ระดับ AI)
        (async () => {
          S.level = +(q.get('level') || 2);
          Ctrl.auto = true; UI.aiSpeed = 'skip';
          for (let i = 0; i < 3 && !S.over; i++) { if (i) await aiTakeActions(0); await endPlayerTurn(); }
          Ctrl.auto = false; UI.selNode = null; UI.selArmy = null; closeDialog(); render();
          document.title = 'SHOTREADY';
        })();
      }
      if (q.get('shot') === 'aiturn') { UI.aiSpeed = 'normal'; UI.selArmy = null; endPlayerTurn(); }  // ภาพระหว่างตาศัตรู (ใช้คู่กับ virtual time)
      if (q.get('shot') === 'retreatpick') {
        // ศัตรูบุกทัพเรา แล้วกดถอนทัพ → เลือกปลายทางบนแผนที่
        const cap = fac(0).capital;
        const X = neighbors(cap).filter(nb => !nb.mountain).map(nb => nb.id).find(id => S.nodes[id].capitalOf === null && neighbors(id).filter(nb => !nb.mountain && nb.id !== cap).length >= 2);
        const Y = neighbors(X).filter(nb => !nb.mountain).map(nb => nb.id).find(id => id !== cap && S.nodes[id].capitalOf === null && !armyAt(id));
        const me = armyAt(cap); me.node = X; S.nodes[X].owner = 0; me.units = { inf: 10, cav: 0, arc: 10 };
        const foe = leaderArmy(1); foe.node = Y; S.nodes[Y].owner = 1; foe.units = { inf: 20, cav: 20, arc: 20 };
        for (const nb of neighbors(X)) if (nb.id !== Y && nb.id !== cap && S.nodes[nb.id].owner === NEUTRAL) S.nodes[nb.id].garrison = { inf: 3, cav: 2, arc: 2 };
        S.phase = 'ai'; S.current = 1; UI.busy = true; render();
        moveArmy(foe, X);
        setTimeout(() => { document.querySelector('#battleCard [data-retreat-open]').click(); if (q.has('sel')) document.querySelector('#battleCard .rp-chip.break, #battleCard .rp-chip').click(); document.title = 'SHOTREADY'; }, 50);
      }
      if (q.get('shot') === 'legbattle') {
        // ทัพตำนานศัตรู (ยังไม่ภักดี เคยเป็นของเรา) ยืนติดเมืองหลวงเรา แล้วเราบุก
        const a = armyAt(fac(0).capital), t = moveTargets(a).find(id => S.nodes[id].capitalOf === null && !wildAt(id));
        S.nodes[t].owner = 1; S.nodes[t].garrison = Z();
        newArmy(1, t, legendGen('achilles', 0), { inf: 8, cav: 4, arc: 2 });
        S.wInGame.push('achilles');
        render(); moveArmy(a, t);
      }
      if (q.get('shot') === 'battle') {
        const a = armyAt(fac(0).capital), t = moveTargets(a).find(id => S.nodes[id].owner === NEUTRAL);
        if (t != null) moveArmy(a, t);
      }
    } else renderTitle();
  }
}
if (typeof document !== 'undefined') boot();
</script>
